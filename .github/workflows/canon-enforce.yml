# VJS canon enforcement (improvement #1, machinery on [2026] VJS-PC 14 /
# REG-FRONT-DOOR-001).
#
# The host commit hook is the local wall, but `git commit --no-verify` bypasses it.
# This re-runs the SAME deterministic kernel gate on the canonical remote, on every
# push and pull request, where no --no-verify can reach. It is not a NEW guarantee -
# it is the front-door gate enforced at a second, un-bypassable point (defence in
# depth). A push that skipped the local hook fails here.
name: canon-enforce

on:
  push:
  pull_request:

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so we can diff against the push base
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the kernel
        run: cargo build --release --bin vjs
      # Make the runner a complete jurisdiction so the commit gates (which include the
      # install-surface check) run; the hooks/manifest are ephemeral here.
      - name: Invoke + lock (complete the install surface)
        run: |
          ./target/release/vjs invoke --jurisdiction vjs --principal ci --install-hooks
          ./target/release/vjs install-lock
      # The fix for "CI was blind to the staged gates": stage the PUSHED diff against
      # its base and run the full commit gates (permit, bench, canon-write, apex,
      # media, assent floor) over it - exactly what `--no-verify` skips locally.
      - name: Commit gates over the pushed diff
        run: |
          BASE="${{ github.event.before }}"
          [ -n "${{ github.event.pull_request.base.sha }}" ] && BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          echo "diffing against $BASE"
          git reset --soft "$BASE"
          ./target/release/vjs validate --staged
      - name: Canon-wide checks (citations, lock, referential integrity, boundary)
        run: ./target/release/vjs local-ci && ./target/release/vjs validate
      - name: Workspace tests
        run: cargo test --workspace
