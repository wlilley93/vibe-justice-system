# VJS canon enforcement (improvement #1, machinery on [2026] VJS-PC 14 /
# REG-FRONT-DOOR-001).
#
# The host commit hook is the local wall, but `git commit --no-verify` bypasses it,
# and a write-access author can edit a local gate and re-lock it ([2026] VJS-PC 16 D4
# records that this is beyond any in-binary check). This job is the TRUST ROOT: it
# re-runs the SAME deterministic kernel gate on the canonical remote, on every push and
# pull request, on a PINNED toolchain (rust-toolchain.toml), where no --no-verify and no
# local edit can reach. Make this a REQUIRED status check in branch protection so its
# verdict - not the committer's say-so - is what admits a change to canon.
name: canon-enforce

on:
  push:
  pull_request:

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      # Actions are SHA-PINNED (immutable commit, not a movable tag) so a compromised
      # or re-tagged action cannot inject code into the trust root. The trailing comment
      # records the human-readable version; bump the SHA deliberately, never by drift.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5 (node24)
        with:
          fetch-depth: 0               # full history, so we can diff against the push base
          persist-credentials: false   # do not leak the checkout token to later steps
      # SHA-pinned; the exact toolchain is selected by the `toolchain:` input (and matches
      # rust-toolchain.toml) so the verdict is reproducible - a moving tag or "stable"
      # could silently change what passes.
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Quality gate: zero clippy warnings, enforced (now that the toolchain is pinned,
      # this is reproducible - "0 warnings" stops being an honour system).
      - name: Clippy (no warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build the kernel
        run: cargo build --release --bin vjs
      # Make the runner a complete jurisdiction so the commit gates (which include the
      # install-surface check) run; the hooks/manifest are ephemeral here.
      - name: Invoke + lock (complete the install surface)
        run: |
          ./target/release/vjs invoke --jurisdiction vjs --principal ci --install-hooks
          ./target/release/vjs install-lock
      # The fix for "CI was blind to the staged gates": stage the PUSHED diff against
      # its base and run the full commit gates (permit, bench, canon-write, apex,
      # media, assent floor) over it - exactly what `--no-verify` skips locally.
      - name: Commit gates over the pushed diff
        run: |
          BASE="${{ github.event.before }}"
          [ -n "${{ github.event.pull_request.base.sha }}" ] && BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi
          echo "diffing against $BASE"
          git reset --soft "$BASE"
          ./target/release/vjs validate --staged
      - name: Canon-wide checks (citations, lock, referential integrity, boundary)
        run: ./target/release/vjs local-ci && ./target/release/vjs validate
      - name: Workspace tests
        run: cargo test --workspace
