# VJS v3 verification: TypeScript court plus Lean statute book
name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the TypeScript court
        run: npm run build
      - name: Run the court tests
        run: npm test
      - name: Build the Lean statute book
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
      - name: Replay the Lean proof terms
        working-directory: lean
        run: lake env leanchecker Vjs
