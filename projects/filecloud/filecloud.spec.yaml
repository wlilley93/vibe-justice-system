id: SPEC-FILECLOUD-001
title: Filecloud file browser component
version: "3"
status: active

scope:
  paths:
    - projects/filecloud/**
  action_kinds:
    - implementation_decision
    - dependency_change
    - security_sensitive_act
    - governed_load_bearing_act

owner: principal

purpose: >
  Filecloud is a React component embedded in the Opbox frontend at /files.
  It replaces FilesBrowserPage. Files are stored in Opbox's S3 bucket and
  accessed exclusively via the Opbox kernel's verb API (file.put, file.get,
  file.list, file.delete, file.replace_bytes). The kernel handles AEAD
  encryption before bytes reach S3 - filecloud never handles ciphertext.
  Decrypted bytes are served via /api/stored-files/[key]. Auth is Opbox's
  existing NextAuth session. Persistent state (tags, share links, recent,
  starred) lives in Opbox Postgres via the kernel or existing API routes.
  The S3 backend (ReservedBackend) is fail-closed pending a VJS court record
  unlock (DEC-FC-017). Stack: React component within the Opbox frontend build.
  Onyx design system, all five themes inherited from the Opbox html class.

