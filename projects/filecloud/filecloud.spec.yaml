superseded_decisions:
  - id: DEC-FC-003
    note: No separate SQLite. Opbox Postgres is the data layer.
  - id: DEC-FC-006
    note: No port. Filecloud is a component, not a server.
  - id: DEC-FC-013
    note: No ffmpeg. Video served via /api/stored-files/[key] with range requests.
  - id: DEC-FC-014
    note: No .filecloud-trash/ directory. Soft-delete flag in Opbox Postgres.

