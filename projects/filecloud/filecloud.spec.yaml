open_unknowns:
  - U-11: Does a file.list verb exist in the kernel, or must filecloud use /api/files/browse?
  - U-12: Does the kernel have a file.delete verb, and what does it do to the S3 object?
  - U-13: Does the kernel have a tagging verb, or does that go via a separate API route?
  - U-14: What S3 provider and credentials will be used? (Not yet configured - see DEC-FC-017)
  - U-15: Does file.put support folder paths/hierarchy, or is it flat (key-prefix convention)?
  - U-16: Is there a bulk download (zip) API route in Opbox already?
  - U-17: What is the 50MiB blob cap in file.put - is there a chunked upload path?
  - U-18: Does Opbox already have a calendar surface? If so, what route is it at and what does it accept (date, event ID)?

review_triggers:
