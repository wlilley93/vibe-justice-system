# Global kernel invariants (K-1..K-30) - the single source of truth both kernels measure
# against. See docs/kernel-building-single-source-of-truth.md for the full statements.
#
# This file is machine-checked by the K-29 binding gate
# (crates/vjs-testkit/tests/global_invariants_gate.rs), which:
#   1. HARD-FAILS if any named test in a `vjs.tests` list does not exist (a broken binding);
#   2. RATCHETS the VJS "binding debt" (in-scope invariants with no bound test) so it can
#      only decrease - levelling the kernel up toward full invariant->test coverage.
# The opbox side is tracked here as the shared record; it is gated in the Opbox repo.
#
# status: met | partial | gap | n/a   (n/a = out of this kernel's layer, excluded from debt)

