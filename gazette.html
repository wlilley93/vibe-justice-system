<style>
  :root {
    --cream:#fcf7f1; --paper:#fffdfa; --ink:#1a2744; --rule:#c8d0dc; --muted:#5b6472; --accent:#8b0000;
    --sc:#8a5a00;  --sc-bg:#fff2bf;
    --ca:#1d4f91;  --ca-bg:#e8f1ff;
    --first:#3d7fbd; --first-bg:#eef7ff;
    --act:#b42318; --act-bg:#fff0ec;
    --si:#761919;  --si-bg:#fbe6e6;
    --pc:#5b6472;  --pc-bg:#eceef2;
    --submission:#4b5563; --submission-bg:#f3f4f6;
    --v1:#7a5c1e;  --v1-bg:#f6eeda;
    --v2:#1a5c46;  --v2-bg:#e9f5ef;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:#15202b;
    font-family:'Iowan Old Style','Palatino Linotype','Times New Roman',serif; line-height:1.5; }

  /* the compact header bar */
  .bar { position:sticky; top:0; z-index:9; display:flex; align-items:center; gap:.8rem;
    padding:.45rem .9rem; background:var(--paper); border-bottom:2px solid var(--ink); }
  .bar img.mark { height:34px; width:auto; display:block; }
  .bar .word { line-height:1.1; }
  .bar .word b { display:block; font-size:.95rem; letter-spacing:.03em; color:var(--ink); }
  .bar .word span { font-size:.64rem; color:var(--muted); font-style:italic; }
  .bar nav { display:flex; gap:.9rem; margin-left:1rem; }
  .bar nav a { color:var(--ink); text-decoration:none; font-size:.85rem; border-bottom:1px solid transparent; }
  .bar nav a:hover { border-bottom-color:var(--ink); }
  .bar .gh { margin-left:auto; display:flex; align-items:center; color:var(--ink); }
  .bar .gh svg { width:22px; height:22px; display:block; }
  .bar .gh:hover { opacity:.7; }

  .wrap { max-width:980px; margin:0 auto; padding:1rem 1rem 4rem; }
  .pagelogo { display:block; margin:2.2rem auto 1.8rem; width:min(270px,62vw); height:auto; }
  #q { width:100%; padding:.7rem 1rem; font-size:1.05rem; border:1.5px solid var(--ink);
    border-radius:6px; background:#fff; font-family:inherit; }
  #q:focus { outline:none; box-shadow:0 0 0 3px rgba(26,39,68,.12); }

  /* the filter rows: quiet pills, counts as small figures */
  .tabs { display:flex; flex-wrap:wrap; gap:.35rem; margin:.6rem 0 0; align-items:center; }
  .tabs .lbl { font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
    margin-right:.2rem; min-width:3.4rem; }
  .tab { --tone:var(--ink); padding:.22rem .65rem; border:1px solid var(--rule);
    border-radius:999px; cursor:pointer; background:var(--paper); color:var(--tone); font:inherit; font-size:.8rem; }
  .tab:hover { border-color:var(--tone); }
  .tab.active { background:var(--tone); border-color:var(--tone); color:var(--cream); }
  .tab .n { opacity:.6; font-size:.7rem; margin-left:.2rem; }
  .tone-sc.tab { --tone:var(--sc); } .tone-ca.tab { --tone:var(--ca); } .tone-first.tab { --tone:var(--first); }
  .tone-act.tab { --tone:var(--act); } .tone-si.tab { --tone:var(--si); } .tone-pc.tab { --tone:var(--pc); }
  .tone-submission.tab { --tone:var(--submission); }
  .tone-v1.tab { --tone:var(--v1); } .tone-v2.tab { --tone:var(--v2); }
  .meta { color:var(--muted); font-size:.82rem; margin:.5rem 0 .8rem; }

  /* the register cards: the whole card opens the document */
  .card { --tone:var(--ink); position:relative; border:1px solid var(--rule); border-left:5px solid var(--tone);
    border-radius:6px; padding:.75rem 9rem .75rem 1rem; margin:.65rem 0; background:var(--paper);
    cursor:pointer; transition:border-color .12s ease, transform .12s ease; }
  .card:hover { border-color:var(--ink); transform:translateY(-1px); }
  .card:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .card:target { outline:2px solid var(--ink); outline-offset:2px; }
  .tone-sc.card { --tone:var(--sc); } .tone-ca.card { --tone:var(--ca); } .tone-first.card { --tone:var(--first); }
  .tone-act.card { --tone:var(--act); } .tone-si.card { --tone:var(--si); } .tone-pc.card { --tone:var(--pc); }
  .tone-submission.card { --tone:var(--submission); }
  .card .titleline { font-weight:bold; color:var(--ink); font-size:1.05rem; }
  .card .court { color:var(--muted); font-size:.84rem; margin-top:.12rem; }
  .card .ratio { margin:.35rem 0 0; }
  .card .snip { margin:.35rem 0 0; font-size:.84rem; color:#5b4a2e; background:var(--v1-bg);
    border-left:2px solid var(--v1); border-radius:0 4px 4px 0; padding:.2rem .5rem; font-style:italic; }
  /* exactly two uniform chips, docked top right: the kind and the source */
  .chips { position:absolute; top:.7rem; right:.7rem; display:flex; flex-direction:column; gap:.22rem; }
  .chip { display:inline-block; width:6.3rem; text-align:center; border:1px solid var(--tone,var(--muted));
    border-radius:4px; background:var(--tone-bg,#fff); color:var(--tone,var(--muted)); font-size:.62rem;
    font-style:normal; font-weight:normal; letter-spacing:.05em; line-height:1.25; text-transform:uppercase;
    padding:.12rem 0; margin:0; }
  .chip.tone-sc { --tone:var(--sc); --tone-bg:var(--sc-bg); }
  .chip.tone-ca { --tone:var(--ca); --tone-bg:var(--ca-bg); }
  .chip.tone-first { --tone:var(--first); --tone-bg:var(--first-bg); }
  .chip.tone-act { --tone:var(--act); --tone-bg:var(--act-bg); }
  .chip.tone-si { --tone:var(--si); --tone-bg:var(--si-bg); }
  .chip.tone-pc { --tone:var(--pc); --tone-bg:var(--pc-bg); }
  .chip.tone-submission { --tone:var(--submission); --tone-bg:var(--submission-bg); }
  .chip.tone-v1 { --tone:var(--v1); --tone-bg:var(--v1-bg); }
  .chip.tone-v2 { --tone:var(--v2); --tone-bg:var(--v2-bg); }
  .tl { display:inline-block; font-size:.62rem; letter-spacing:.05em; text-transform:uppercase;
    padding:.05rem .45rem; border-radius:10px; border:1px solid var(--rule); color:var(--muted); background:#fff; }
  .tl.live { background:#dff3e4; color:#0a5a26; border-color:#7cc894; }
  .chips-status { margin-top:.05rem; }
  .chips-status .tl { font-size:.6rem; padding:.08rem .4rem; }
  .card .court .metastatus { margin-left:.45rem; }
  .card .court .metastatus .tl { font-size:.56rem; padding:.04rem .32rem; vertical-align:.05rem; }
  .tl.assent { background:#cdf3d6; color:#0a5224; border-color:#5cbf80; }
  .tl.arch { background:#f1ece1; color:#6b5b3a; border-color:#cdbf9c; }
  .tl.bad  { background:#fbe3e3; color:#a01010; border-color:#c0392b; }
  .tl.pend { background:#fff2d6; color:#8a5a00; border-color:#d99b1f; }
  .card details { margin:.45rem 0 0; }
  .card summary { cursor:pointer; color:var(--muted); font-size:.8rem; user-select:none; }
  .card summary:hover { color:var(--ink); }
  .card .points { margin:.4rem 0 .2rem; padding-left:1.25rem; font-size:.92rem; }
  .card .points li { margin:.26rem 0; }
  .card .linbody { font-size:.8rem; color:var(--muted); padding:.25rem 0 .1rem; }
  .card .linbody b { font-size:.64rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
    display:block; margin-top:.3rem; }
  .card .linbody button { font:inherit; font-size:.78rem; color:var(--ink); border:1px solid var(--rule);
    border-radius:4px; background:#fff; padding:.08rem .4rem; margin:.12rem .22rem .12rem 0; cursor:pointer; }
  .card .linbody button:hover { border-color:var(--ink); }
  .part { margin:1.6rem 0 .2rem; padding-bottom:.3rem; border-bottom:2px solid var(--ink);
    color:var(--ink); font-size:1.15rem; letter-spacing:.04em; }

  footer { border-top:1px solid var(--rule); margin-top:2rem; padding:1.2rem 1rem; text-align:center;
    color:var(--muted); font-size:.8rem; font-style:italic; }
  @media print {
    body { background:#fff; }
    .bar, #q, .tabs, .meta { display:none !important; }
    .card { background:#fff; border:none; border-left:3px solid #000; border-radius:0;
      break-inside:avoid; padding:.4rem .8rem; cursor:auto; }
    .chip { background:#fff !important; }
    footer { font-size:.7rem; }
    @page { margin:2cm; }
  }
  @media (max-width: 640px) {
    .bar nav { gap:.55rem; }
    .bar .word span { display:none; }
    .card { padding-right:1rem; }
    .chips { position:static; flex-direction:row; margin:.3rem 0 0; }
  }
</style>
</head>
<body>
<noscript>
  <div style="max-width:680px;margin:1rem auto;padding:1rem;border:1px solid #c8d0dc;border-radius:6px;background:#fffdfa">
    <b>The Gazette renders with JavaScript; the record itself needs none.</b>
    The canon is the lawpack under <code>lawpack/v2/</code>; machine-readable copies:
    <a href="gazette-data.json">gazette-data.json</a> and <a href="gazette.xml">gazette.xml</a>.
    Publication is constitutively inert (REG-GAZETTE-CONTINUITY-001).
  </div>
</noscript>

<div class="bar">
  <span class="word"><b>The VJS Gazette</b><span>the Realm Law Reports</span></span>
  <nav>
    <a href="index.html">Constellation</a>
    <a href="gazette.xml">Feed</a>
  </nav>
  <a class="gh" href="https://github.com/wlilley93/vibe-justice-system" title="The canonical repository" aria-label="The canonical repository on GitHub">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
</div>

<div class="wrap">
  <img class="pagelogo" src="assets/vjs-logo-page.png" alt="Vibe Justice System">
  <input id="q" placeholder="Search the law&hellip;  (e.g. assent, permits, hooks, PC 5, REALM-SC 10)" autocomplete="off"
    aria-label="Search the law">
  <div class="tabs" id="estate-tabs" role="group" aria-label="Filter by estate"></div>
  <div class="tabs" id="class-tabs" role="group" aria-label="Filter by class"></div>
  <div class="tabs" id="sort-tabs" role="group" aria-label="Sort order"></div>
  <div class="meta" id="meta" aria-live="polite"></div>
  <div id="list"></div>
</div>
<footer id="foot"></footer>

<script src="gazette-data.js"></script>
<script src="gazette-text.js"></script>
<script>
'use strict';
const ITEMS = window.GAZETTE.items;
const byId = new Map(ITEMS.map(d => [d.id, d]));

// Presentation-only tone taxonomy: an orientation aid, never a source of force.
function tone(d) {
  if (d.kind === 'statute' || d.kind === 'act') return 'act';
  if (d.kind === 'regulation' || d.kind === 'rule' || d.kind === 'instrument') return 'si';
  if (d.kind === 'order' || d.kind === 'judgment') {
    if (d.court === 'sc') return 'sc';
    if (d.court === 'pc') return 'pc';
    if (d.court === 'ca') return 'ca';
    return 'first';
  }
  if (d.kind === 'decision') return 'first';
  return 'submission';
}
const KIND_LABEL = { statute:'Act', act:'Act', regulation:'Regulation', rule:'Rule', instrument:'Instrument',
  order:'Order', judgment:'Judgment', decision:'Decision', invariant:'Invariant', obligation:'Obligation', spec:'Spec' };
const SOURCE_LABEL = { sc:'Supreme Court', pc:'Privy Council', ca:'Court of Appeal', county:'County Court' };
const ESTATE_NAME = { v2:'The living canon', v1:'The honoured archive' };
const KIND_PART = { statute:'Acts', act:'Acts', regulation:'Instruments and regulations',
  instrument:'Instruments and regulations', rule:'Instruments and regulations',
  order:'Orders and judgments', judgment:'Orders and judgments', decision:'Decisions of record' };
const CLASS_TABS = [
  ['all','All law'], ['act','Acts'], ['si','Instruments'], ['sc','Supreme Court'],
  ['pc','Privy Council'],
];
const ESTATE_TABS = [['all','Both estates'], ['v2','The living canon'], ['v1','The honoured archive']];
const SORT_TABS = [['newest','Newest first'], ['oldest','Oldest first'], ['kind','By kind'], ['timeline','Timeline']];
const KIND_ORDER = { statute:0, act:0, regulation:1, instrument:1, rule:2, order:3, judgment:3,
  decision:4, invariant:5, obligation:6, spec:7 };

let estate = 'all', klass = 'all', query = '', sortMode = 'newest';

function esc(t) {
  return String(t ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function statusChip(d) {
  // The honoured archive binds nothing in V2: its chip reads 'archived'. A canon
  // record shows its status (in force / void / draft). No assent chip - canon is
  // assented by rule.
  if (d.estate === 'v1') return `<span class="tl arch">archived</span>`;
  return d.status ? `<span class="tl ${statusKind(d.status)}">${esc(d.status.replace(/[_-]/g, ' '))}</span>` : '';
}
// court orders, judgments and acts show the citation before the name
function displayTitle(d) {
  const cite = d.citation || '';
  if (d.title.startsWith('[')) return d.title;
  if (cite && d.title.startsWith(cite)) return d.title;
  // acts read like statutes, not law reports: the year alone, no series number
  // (the unique machine citation stays on the record and in the meta line)
  if (d.kind === 'statute' || d.kind === 'act') {
    const y = (cite.match(/^\[(\d{4})\]/) || [null, (d.date || '').slice(0, 4)])[1];
    return y ? `[${y}] - ${d.title}` : d.title;
  }
  if (cite && d.kind === 'instrument') return `${cite} - ${d.title}`;
  // orders and judgments are named by their matter; the neutral citation sits
  // on the meta line below the title, not duplicated in the heading
  return d.title;
}
// the citation shown on the meta line / copy-citation: the official series
// (acts keep [YYYY] VJS-ACT n here, even though the title shows only the year)
function displayCite(d) {
  return d.citation || d.id;
}
function statusKind(s) {
  s = (s || '').toLowerCase();
  if (/(void|per.incuriam|superseded|revoked|stayed|not.law)/.test(s)) return 'bad';
  if (/(draft|pending|proposed)/.test(s)) return 'pend';
  if (/(in.force|good.law|binding|active|assented|enacted|made)/.test(s)) return 'live';
  return '';
}
function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${d} ${M[m - 1]} ${y}`;
}
const _ftCache = {};
function fullText(id) {
  if (id in _ftCache) return _ftCache[id];
  let out = '';
  const walk = v => {
    if (typeof v === 'string') out += ' ' + v;
    else if (Array.isArray(v)) v.forEach(walk);
    else if (v && typeof v === 'object') Object.values(v).forEach(walk);
  };
  walk((window.GAZETTE_TEXT || {})[id]);
  return _ftCache[id] = out.toLowerCase();
}
function matches(d) {
  if (estate !== 'all' && d.estate !== estate) return false;
  if (klass !== 'all' && tone(d) !== klass) return false;
  if (!query) return true;
  const hay = [d.id, d.title, d.citation, d.summary, d.status, ...(d.points || [])].join(' ').toLowerCase()
    + ' ' + fullText(d.id);
  return query.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
// a snippet of body text around the query, shown when the match is in the text
// rather than the title/summary (so the reader sees WHY a result matched)
function snippet(d) {
  if (!query) return '';
  const meta = [d.id, d.title, d.citation, d.summary, d.status].join(' ').toLowerCase();
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  if (words.every(w => meta.includes(w))) return '';
  const ft = fullText(d.id);
  const at = ft.indexOf(words[0]);
  if (at < 0) return '';
  const start = Math.max(0, at - 40);
  const raw = ft.slice(start, at + 80);
  return '<div class="snip">&hellip;' + esc(raw.trim()) + '&hellip;</div>';
}

function sorted(list) {
  // The order's sort rules: the canon leads under newest; the archive leads
  // under oldest (it is the older estate); timeline is estate-blind.
  const canonFirst = (a, b) => (a.estate === b.estate ? 0 : a.estate === 'v2' ? -1 : 1);
  const archiveFirst = (a, b) => (a.estate === b.estate ? 0 : a.estate === 'v1' ? -1 : 1);
  const byKind = (a, b) =>
    ((KIND_ORDER[a.kind] ?? 9) - (KIND_ORDER[b.kind] ?? 9)) ||
    a.id.localeCompare(b.id, undefined, { numeric: true });
  // sort on the full timestamp (ts) so same-day records keep true newest-first
  const tsOf = d => d.ts || ((d.date || '') + 'T00:00:00Z');
  const byDateDesc = (a, b) => tsOf(b).localeCompare(tsOf(a)) || byKind(a, b);
  const byDateAsc = (a, b) => tsOf(a).localeCompare(tsOf(b)) || byKind(a, b);
  if (sortMode === 'timeline') return [...list].sort(byDateDesc);
  if (sortMode === 'oldest') return [...list].sort((a, b) => archiveFirst(a, b) || byDateAsc(a, b));
  if (sortMode === 'kind') return [...list].sort((a, b) => byKind(a, b) || canonFirst(a, b) || byDateAsc(a, b));
  return [...list].sort((a, b) => canonFirst(a, b) || byDateDesc(a, b));
}
function partOf(d) {
  if (sortMode === 'timeline') return d.date || 'undated';
  if (sortMode === 'kind') return KIND_PART[d.kind] || 'Other records';
  return d.estate;
}
function partLabel(part, d) {
  if (sortMode === 'timeline') return fmtDate(part) || part;
  if (sortMode === 'kind') return part;
  return ESTATE_NAME[d.estate];
}

function card(d) {
  const t = tone(d);
  const sourceChip = d.court
    ? `<span class="chip tone-${t}" title="${esc(SOURCE_LABEL[d.court] || d.court)}">${esc(d.court.toUpperCase())}</span>`
    : '';
  const metaBits = [displayCite(d), fmtDate(d.date)].filter(Boolean).map(esc).join(' &middot; ');

  const el = document.createElement('div');
  el.className = `card tone-${t}`;
  el.id = d.id;
  el.tabIndex = 0;
  el.setAttribute('role', 'link');
  el.setAttribute('aria-label', `Open ${d.title}`);
  el.innerHTML = `
    <div class="chips"><span class="chip tone-${t}">${esc(KIND_LABEL[d.kind] || d.kind)}</span>${sourceChip}</div>
    <div class="titleline">${esc(displayTitle(d))}</div>
    ${(metaBits || statusChip(d)) ? `<div class="court">${metaBits}${statusChip(d) ? `<span class="metastatus">${statusChip(d)}</span>` : ''}</div>` : ''}
    <div class="ratio">${esc(d.summary)}</div>${snippet(d)}`;

  if ((d.points || []).length) {
    const det = document.createElement('details');
    det.innerHTML = `<summary>Main points</summary><ul class="points">${d.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>`;
    det.addEventListener('click', e => e.stopPropagation());
    el.appendChild(det);
  }

  // the lineage dropdown: what this rests on, and what rests on it
  const get = ids => (ids || []).map(c => byId.get(c)).filter(Boolean);
  const assoc = [
    ['Derives force from', [...get(d.lineage), ...get(d.cites)]],
    ['Same docket', [...get(d.thread), ...ITEMS.filter(x => (x.thread || []).includes(d.id))]],
    ['Relied on by', ITEMS.filter(x => (x.cites || []).includes(d.id) || (x.lineage || []).includes(d.id))],
  ].filter(([, l]) => l.length);
  if (assoc.length) {
    const det = document.createElement('details');
    det.innerHTML = `<summary>Lineage</summary>`;
    const body = document.createElement('div');
    body.className = 'linbody';
    for (const [label, list] of assoc) {
      const b = document.createElement('b');
      b.textContent = label;
      body.appendChild(b);
      const line = document.createElement('div');
      for (const other of list.slice(0, 10)) {
        const btn = document.createElement('button');
        btn.textContent = other.title.length > 38 ? other.title.slice(0, 36) + '…' : other.title;
        btn.addEventListener('click', e => { e.stopPropagation(); location.href = other.doc || `law.html#${encodeURIComponent(other.id)}`; });
        line.appendChild(btn);
      }
      body.appendChild(line);
    }
    det.appendChild(body);
    det.addEventListener('click', e => e.stopPropagation());
    el.appendChild(det);
  }

  const open = () => { location.href = d.doc || `law.html#${encodeURIComponent(d.id)}`; };
  el.addEventListener('click', open);
  el.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
  return el;
}

function tabBar(el, defs, current, counter, onpick) {
  if (!el.dataset.built) {
    el.dataset.built = '1';
    for (const [key, label] of defs) {
      const b = document.createElement('button');
      b.className = 'tab';
      b.dataset.key = key;
      if (key !== 'all') b.classList.add('tone-' + key);
      b.innerHTML = `${label}<span class="n"></span>`;
      b.onclick = () => onpick(key);
      el.appendChild(b);
    }
  }
  for (const b of el.children) {
    if (!b.dataset.key) continue;
    const key = b.dataset.key;
    b.classList.toggle('active', key === current);
    b.setAttribute('aria-pressed', String(key === current));
    b.querySelector('.n').textContent = counter(key);
  }
}

function render() {
  const shown = sorted(ITEMS.filter(matches));
  tabBar(document.getElementById('estate-tabs'), ESTATE_TABS, estate,
    k => k === 'all' ? '' : ` ${ITEMS.filter(d => d.estate === k).length}`,
    k => { estate = k; syncUrl(); render(); });
  tabBar(document.getElementById('class-tabs'), CLASS_TABS, klass,
    k => k === 'all' ? '' : ` ${ITEMS.filter(d => tone(d) === k && (estate === 'all' || d.estate === estate)).length}`,
    k => { klass = k; syncUrl(); render(); });
  tabBar(document.getElementById('sort-tabs'), SORT_TABS, sortMode, () => '', k => { sortMode = k; syncUrl(); render(); });
  document.getElementById('meta').textContent =
    `${shown.length} of ${ITEMS.length} items. Click any item to open the document. Colour and chips are orientation aids only; the committed law is the source.`;

  const list = document.getElementById('list');
  list.innerHTML = '';
  let lastPart = null;
  for (const d of shown) {
    const part = partOf(d);
    if (part !== lastPart) {
      const h = document.createElement('h2');
      h.className = 'part';
      const count = shown.filter(x => partOf(x) === part).length;
      h.innerHTML = `${esc(partLabel(part, d))} <span class="n">${count} items</span>`;
      list.appendChild(h);
      lastPart = part;
    }
    list.appendChild(card(d));
  }
}

document.getElementById('q').addEventListener('input', e => { query = e.target.value.trim(); syncUrl(); render(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== document.getElementById('q') && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
    document.getElementById('q').focus();
    document.getElementById('q').select();
  }
});
// a shared link reproduces the view: filters travel in the query string
function syncUrl() {
  const p = new URLSearchParams();
  if (estate !== 'all') p.set('estate', estate);
  if (klass !== 'all') p.set('class', klass);
  if (sortMode !== 'newest') p.set('sort', sortMode);
  if (query) p.set('q', query);
  const qs = p.toString();
  history.replaceState(null, '', (qs ? '?' + qs : location.pathname) + location.hash);
}
{
  const p = new URLSearchParams(location.search);
  if (p.get('estate')) estate = p.get('estate');
  if (p.get('class')) klass = p.get('class');
  if (p.get('sort')) sortMode = p.get('sort');
  if (p.get('q')) { query = p.get('q'); document.getElementById('q').value = query; }
}
window.addEventListener('beforeprint', () => document.querySelectorAll('details').forEach(d => d.setAttribute('open', '')));
window.addEventListener('afterprint', () => document.querySelectorAll('details').forEach(d => d.removeAttribute('open')));
render();

// Deep link: #id scrolls to the card (old links keep working; the card opens the document on click).
if (location.hash) {
  const el = document.getElementById(decodeURIComponent(location.hash.slice(1)).split(':')[0]);
  if (el) el.scrollIntoView({ block: 'center' });
}

// The provenance footer: bind the publication to the record. Inert, always.
{
  const m = window.GAZETTE.meta || {}, lp = m.lawpack || {};
  const dig = (lp.digest || '').replace('sha256:', '').slice(0, 12);
  const commit = (m.source_commit || '').slice(0, 7);
  document.getElementById('foot').innerHTML =
    `Publication is constitutively inert (REG-GAZETTE-CONTINUITY-001; [2026] REALM-SC 10):
     force comes from the lawpack and the Sovereign's assent, never from being listed here.<br>
     Generated ${esc((window.GAZETTE.generated_at || '').slice(0, 10))} from ${esc(lp.id || 'the lawpack')}` +
    (dig ? ` &middot; <span title="${esc(lp.digest)}">sha256:${esc(dig)}&hellip;</span>` : '') +
    (commit ? ` &middot; from commit ${esc(commit)}` : '') +
    ` &middot; <a href="gazette-data.json">machine-readable data</a> &middot; <a href="gazette.xml">Atom feed</a>`;
}
</script>
</body>
