id: DEC-ACMECO-READ-RLS-001
assent_source: sovereign_assent
citation: "[2026] VJS-DEC 22"
title: The frontend RLS read mechanic - transparent request-scoped single-tx injection, fail-closed (refines DEC-18)
status: active
scope:
  paths:
    - Executive/ministry-of-business-engineering-and-skills/engineering-department/projects/acmeco/**
  action_kinds:
    - implementation_decision
    - schema_change
    - refactor
decision: >
  First Instance (odd bench: authoring judge + 2 adversarial reviewers, both concur-with-qualification; all 12
  corrections adopted as binding conditions). Made on a FULL EMPIRICAL RECORD: a spike built + ran the candidate
  mechanic against the live iso-kernel (re-run + reproduced by the perf reviewer) + inspection of the live
  source. REFINES [2026] VJS-DEC 18 (affirm core / refine mechanic / overrule-in-part one per-incuriam reading).

  BINDING RATIO: the frontend reads kernel-owned data under ONE mandatory default mechanic - a TRANSPARENT,
  REQUEST-SCOPED, SINGLE-INTERACTIVE-TRANSACTION RLS injection. A Prisma $extends query hook intercepts every
  READ op (allowlist: findMany/findFirst/findFirstOrThrow/findUnique/findUniqueOrThrow/count/aggregate/groupBy)
  on a kernel-owned model (isKernelOwnedModel snake_case exact-match) and re-dispatches it onto a SINGLE
  interactive transaction opened once at the request boundary, on which SET LOCAL ROLE acmeco_app +
  set_config('app.workspace_id', <authorized-ws>, true) are bound. The authorized workspace comes from
  AsyncLocalStorage established at the request boundary from the session/ctx, NEVER client-supplied. A kernel
  read with no bound workspace context FAILS CLOSED (throws) and never falls through to the unscoped superuser
  connection. This honours DEC-18's "no per-site rewrite" objective for conforming model-delegate read paths
  while enforcing the non-derogable tenant-isolation floor. tx-PER-READ is PROHIBITED (empirically proven P2028
  pool-deadlock when a kernel read runs inside a caller's interactive tx - it opens a 2nd connection; fails
  DEC-18's "provably safe" precondition). Per-site readScoped() (mechanic A) survives ONLY as a narrowly-
  sanctioned commented fallback for enumerated non-request contexts and MUST NOT be nested inside another
  $transaction. The mechanic's safety is made out ONLY when the escape-hatch conditions below are cured (the
  live tree had a rogue new PrismaClient(), raw kernel-table SQL outside the hook, 110 files using
  prisma.$transaction, and no static coverage gate). OVERRULED-IN-PART (narrow): any reading of DEC-18 that
  permits a transparent UNBOUND direct read is overruled as per incuriam of the isolation floor - such a read
  MUST fail closed. D-team (already migrated under mechanic A) is GRANDFATHERED; verificationCheck keeps its
  own KYC court.
basis:
  - DEC-ACMECO-UNITARY-STACK-001
  - DEC-ACMECO-READ-MECHANIC-001
  - ACT-ASSENTED-RECORD-PROTECTION
reason: >
  DEC-18 under-weighted that direct reads on the acmeco superuser connection (rolbypassrls=t) BYPASS RLS and leak
  cross-tenant rows (spike-proven). This supplies the missing mechanic and corrects DEC-18's implicit cost model:
  the "zero per-site change" prize is restated as "single-export rewire + nested-tx reuse + non-request-path
  wrapping", not literally zero touches. tx-per-read (a candidate reading of "read direct") is rejected on the
  reproduced P2028 deadlock. The transparent mechanic's invisibility is a NET hazard WITHOUT the sole-singleton
  + base-read-guard + raw-SQL-coverage + rogue-client conditions, and SAFE (fails closed where a forgotten naked
  prisma.matter.findMany() would otherwise leak) WITH them - so the conditions are the difference between the
  ratio being sound and aspirational. The deadlock ranking (single-tx > tx-per-read) is ratified on evidence;
  the throughput-superiority claim is explicitly NOT ratified - a measured benchmark is a condition precedent.
consequences:
  must:
    - default_every_kernel_owned_read_to_the_transparent_request_scoped_single_tx_mechanic_fail_closed
    - make_the_extended_client_the_sole_prisma_singleton_and_add_a_base_read_guard_that_throws_on_an_unbound_kernel_read
    - run_raw_sql_against_kernel_tables_inside_a_bound_tx_or_ban_it_and_lint_ban_rogue_PrismaClient_instances
    - reuse_the_request_tx_in_nested_prisma_transaction_sites_never_open_a_second_connection
    - add_a_static_coverage_gate_flagging_unwrapped_kernel_reads_rogue_clients_and_raw_kernel_sql_wired_into_preci
    - validate_a_measured_benchmark_and_pool_saturation_budget_before_the_matters_domain_migrates
    - re_run_the_full_assertion_suite_against_the_shipped_topology_before_any_domain_cutover_and_again_on_prisma_7
  must_not:
    - use_tx_per_read_in_the_hot_path_or_nest_readScoped_inside_another_transaction
    - permit_a_transparent_unbound_kernel_read_or_any_env_flag_that_converts_unbound_context_to_fail_open
    - ship_a_kernel_read_path_rsc_cron_webhook_job_raw_sql_that_is_not_proven_wrapped_before_its_domain_un_ignores
review_triggers:
  - schema_changed
  - authority_basis_missing
