id: DEC-ACMECO-UNITARY-STACK-001
assent_source: sovereign_assent
citation: "[2026] VJS-DEC 15"
title: The Unitary Stack - one source of truth for Acmeco kernel-owned data
status: active
scope:
  paths:
    - Executive/ministry-of-business-engineering-and-skills/engineering-department/projects/acmeco/**
  action_kinds:
    - implementation_decision
    - refactor
    - schema_change
decision: >
  The Acmeco frontend (Next.js/Prisma) and the Rust kernel share ONE Postgres per
  tenant (the single-box-per-tenant deployment). On that fact, Acmeco adopts the
  UNITARY STACK: one source of truth for every kernel-owned table, with no
  projection copies and no sync process.

  THE THREE RULES:
  (1) READS GO DIRECT. The frontend reads kernel-owned data straight from the
      kernel's singular tables in the shared Postgres (via Prisma/SQL), never from
      a plural projection copy. The frontend keeps composing its own rich reads
      (joins, filters, pagination) - pointed at the real tables.
  (2) WRITES GO VIA VERBS, ALWAYS. The frontend mutates kernel-owned data only by
      dispatching kernel HTTP verbs; it never writes a kernel-owned table directly
      through Prisma. The kernel's per-verb transaction is the SOLE writer and is
      what enforces invariants, RLS, and the one-event-per-verb audit log.
  (3) RLS AT THE DATABASE. Tenant isolation for kernel-owned tables is enforced by
      Postgres row-level-security policies, not by application WHERE clauses, so a
      single missing filter cannot leak cross-tenant data.

  The ~262 genuinely frontend-owned tables (UI / presentation / config /
  integration) stay on Prisma, unchanged. The dual-system-of-record-with-sync is
  designated TRANSITIONAL DEBT to be removed domain by domain, NOT the target.
basis:
  - ACT-CONSOLIDATION-FRAMEWORK:s4
  - ACT-CONSOLIDATION-FRAMEWORK:s7
  - ACT-001:s4
reason: >
  Two stores for one fact is the defect. The dual store creates sync lag, silent
  sync failures, dual-schema maintenance, and the dual-write bug that let spawned
  matters vanish from the kernel. Because the frontend and kernel share one
  Postgres, adding HTTP read verbs would buy latency and a large rewrite for zero
  gain - the frontend already composes rich reads well, so it should query the
  real tables, not stale copies. One table, one write path, one place to look
  makes the spawn-class bug structurally impossible. This is the consolidation
  principle (ACT-9) applied to the Acmeco data plane: a single reconciled source of
  truth, never duplicated (and see the steering rule against fragmentation). The
  ruling is contingent on the shared-database deployment; if the frontend and
  kernel are ever separated onto different databases, this decision reopens and
  reads move to HTTP read-verbs or an event-projected read model (the kernel
  already emits one event per verb, so a CQRS read model is available then).
consequences:
  must:
    - read_kernel_owned_data_direct_from_kernel_tables
    - write_kernel_owned_data_only_via_kernel_verbs
    - enforce_tenant_isolation_via_postgres_rls
    - delete_projection_table_and_sync_per_domain_on_migration
    - keep_frontend_owned_tables_on_prisma
  must_not:
    - write_a_kernel_owned_table_directly_via_prisma
    - add_http_read_verbs_for_shared_db_reads
    - introduce_new_projection_or_sync_for_kernel_owned_data
    - scope_kernel_owned_reads_by_app_where_clause_alone
review_triggers:
  - schema_changed
  - authority_basis_missing
