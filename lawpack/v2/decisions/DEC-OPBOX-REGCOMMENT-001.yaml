id: DEC-OPBOX-REGCOMMENT-001
assent_source: sovereign_assent
citation: "[2026] VJS-DEC 17"
title: Regulator-comment store is consolidated and made subject-polymorphic (matter + submission)
status: active
scope:
  paths:
    - Executive/ministry-of-business-engineering-and-skills/engineering-department/projects/opbox/**
  action_kinds:
    - implementation_decision
    - schema_change
decision: >
  The regulator-correspondence fork is resolved by CONSOLIDATION onto the kernel store. The kernel's
  `regulator_comment` store + `regulator.comment.*` verbs are extended from submission-scoped to
  SUBJECT-POLYMORPHIC: a comment binds to a subject that is a MATTER or a SUBMISSION (a nullable
  `matter_id` / a `subject_type`+`subject_id` pair, with the existing `submission_id` preserved for the
  submission case). The kernel becomes the single source of truth for regulator correspondence in both
  shapes. The frontend's matter-scoped `RegulatorComment` (table `regulator_comments`) migrates to
  `regulator.comment.add/list/respond` with matter scoping; its projection is deleted; and the second reader
  (`src/lib/rag/rag-admin.ts`) repoints to the kernel store.
basis:
  - ACT-CONSOLIDATION-FRAMEWORK:s4
  - ACT-001:s4
reason: >
  Two stores named the same thing with different scopes is the exact fragmentation the consolidation
  principle forbids; the steering rule is one store, reconciled, not two. Submission-scope was too narrow -
  regulator correspondence genuinely attaches to matters too - so the kernel store is widened rather than a
  parallel matter-scoped store being created (which would re-fork it). Widening one store is cheaper and
  safer than maintaining two, and it lets the frontend fold onto the kernel as SoR under the Unitary Stack.
consequences:
  must:
    - extend_regulator_comment_store_to_subject_polymorphic
    - migrate_frontend_regulator_comment_to_kernel_verbs
    - repoint_rag_admin_reader_to_kernel_store
    - delete_regulator_comments_projection_after_migration
  must_not:
    - create_a_parallel_matter_scoped_regulator_store
review_triggers:
  - schema_changed
