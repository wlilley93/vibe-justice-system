id: DEC-OPBOX-OWNERSHIP-001
assent_source: sovereign_assent
citation: "[2026] VJS-DEC 19"
title: Kernel-ownership classification test (which columns/writes are kernel-owned vs frontend-owned)
status: active
scope:
  paths:
    - Executive/ministry-of-business-engineering-and-skills/engineering-department/projects/opbox/**
  action_kinds:
    - implementation_decision
    - schema_change
    - refactor
decision: >
  First Instance (authoring judge + 2 adversarial reviewers; 1 concur-with-qualification, 1 dissent - the
  dissent's signing correction and the qualification's workspace correction are ADOPTED below).

  BINDING TEST (ratio): a column/write is KERNEL-OWNED iff ALL of: (1) it models a REGULATED fact (PII,
  compliance/audit state, a value subject to an INV, or a primitive multiple independent business flows depend
  on); (2) a kernel verb writes it (atomic + INV-8 audited + RLS-enforced); (3) it shares the scope-root entity
  / carries similar regulated columns. Otherwise it is FRONTEND-OWNED (transient display state, UI preference,
  client-only config, export prefs). When a frontend model extends a kernel row with FRONTEND-OWNED data, the
  structure is a SEPARATE EXTENSION TABLE keyed by the kernel id (never a re-copy of kernel columns). The kernel
  stays PROVIDER-GENERIC (INV-14): provider/UI variation routes through a seam (extension table or a
  parameterised verb), never a denormalised column forest. Never invent a kernel column that does not exist to
  justify "kernel-owned" (the dissent's phantom-column guard).
  DISPOSITIONS (apply per domain):
  - signing provider-metadata (reminderCadence, consentText, sourceFileId/signedFileId/auditCertFileId,
    checksums): FRONTEND-OWNED (corrected per dissent - these columns are NOT in kernel signing_envelope + are
    provider/UI orchestration, not regulated facts; INV-14). File-ref/checksum metadata -> a frontend file-meta
    extension table; reminderCadence/consentText -> frontend-only.
  - workspace jurisdiction/taxInvoiceBaseCurrency/processingRole/dataController*: KERNEL-OWNED (corrected per
    qualification - the firm's regulatory/GDPR posture is a regulated fact; grow the kernel workspace table +
    workspace config verbs).
  - agentTask: SPLIT - kernel owns the durable work row (status/lease/checkpoint/idempotency/escalation);
    frontend owns runtime/UI state (title/prompt/sourceType/cost/claimToken/humanReview) in an extension table
    keyed by agent_task id (caches, not diverged copies).
  - generated_document: grow kernel with title/dueDate/generationMode (regulated/SLA/policy); tags/externalRef/
    returnDocx/Pdf -> frontend extension.
  - document_version: title/tableId -> FRONTEND extension (kernel owns the content/structural snapshot).
  - matter projection: assignedToId/dueDate -> KERNEL; priority/tags/UI-fold-state -> frontend extension;
    relational links (comments/followers/documents) are separate tables.
  - fileRecord folder + starred: FRONTEND-OWNED (UI org/preference; no kernel verb -> not kernel-owned, INV-11).
  - notification: SPLIT - the ~14 canonical kernel work-signals are kernel-owned; transient/display alerts +
    not-yet-wired kinds stay frontend until their producer wires notify.send (then grow the kernel enum).
  - equity stock_legend: frontend/import-time config (no CRUD verb) unless a user-facing need authorises verbs.
basis:
  - DEC-OPBOX-UNITARY-STACK-001
  - DEC-OPBOX-READ-MECHANIC-001
  - ACT-CONSOLIDATION-FRAMEWORK:s4
reason: >
  The Unitary Stack needs a deterministic rule for the recurring "frontend has columns the kernel lacks" fork.
  The 3-prong test (regulated + verb-written + scope-root) draws the moat boundary: regulated/audited domain
  facts belong to the kernel (grown + verb-written + RLS); UI/preference/transient/provider-orchestration data
  stays frontend (extension table, never a kernel-column re-copy). The adversarial dissent corrected two
  misapplications (signing phantom-columns = a moat-leak the test forbids; workspace GDPR attrs = regulated =
  kernel), proving the test by its edges. Keeps the kernel generic (INV-14) and prevents both moat-leak
  (frontend owning regulated data) and kernel-bloat (kernel owning UI chrome).
consequences:
  must:
    - classify_each_extra_column_by_the_3prong_test_before_migrating_a_domain
    - put_frontend_owned_extension_data_in_a_table_keyed_by_the_kernel_id_never_a_recopy
    - grow_the_kernel_only_for_columns_that_pass_the_test_and_have_or_get_a_verb
    - keep_the_kernel_provider_generic_route_variation_through_a_seam
  must_not:
    - claim_kernel_ownership_for_a_column_that_does_not_exist_in_the_kernel_schema
    - leave_a_regulated_fact_frontend_owned
    - bloat_the_kernel_with_ui_preference_or_provider_specific_columns
review_triggers:
  - schema_changed
  - authority_basis_missing
