id: DEC-KERNEL-001
title: vjs-core has no network capability
status: active
scope:
  paths:
    - crates/vjs-core/**
    - crates/vjs-lawpack/**
    - crates/vjs-store/**
decision: >
  vjs-core must not contain network clients or direct network calls.
  Network behaviour belongs in adapters or explicit external-act workflows.
basis:
  - ACT-AGENT-DUTIES:s4
  - ACT-AGENT-DUTIES:s8
  - INV-KERNEL-002
reason: >
  The kernel must be reproducible and deterministic. Network behaviour belongs
  in adapters or explicit external-act workflows.
consequences:
  must:
    - keep network crates outside vjs-core
  must_not:
    - add HTTP clients to vjs-core
review_triggers:
  - kernel_external_capability_required
