id: DEC-AGENT-001
title: Agent lifecycle is route-permit-proof-log-validate
status: active
scope:
  action_kinds:
    - implementation_decision
    - public_record_change
    - external_act
    - security_sensitive_act
decision: >
  The agent must call vjs.route before governed work, receive a permit,
  follow obligations, attach proof, write logs, and validate before commit.
basis:
  - ACT-AGENT-DUTIES:s3
  - ACT-AGENT-DUTIES:s4
  - AGENT-LOOKUP-001
  - AGENT-LOOKUP-002
reason: >
  The kernel carries the process. The agent instruction is short because
  the kernel carries the process.
consequences:
  must:
    - call vjs.route before governed work
    - attach proof before close
    - write decision log after material decisions
    - run vjs validate before commit
  must_not:
    - bypass the kernel route
    - commit without required proof
review_triggers:
  - permit_bypassed
  - proof_missing
