id: DEC-OPBOX-SCOPE-001
assent_source: sovereign_assent
citation: "[2026] VJS-DEC 20"
title: Scope reconciliation - generalize the one kernel store unless the genuine-two-concerns test is met
status: active
scope:
  paths:
    - Executive/ministry-of-business-engineering-and-skills/engineering-department/projects/opbox/**
  action_kinds:
    - implementation_decision
    - schema_change
decision: >
  First Instance (authoring judge + 2 reviewers, both concur-with-qualification). BINDING TEST (ratio): where a
  kernel store and a frontend store model the SAME concept at different scope/shape, CONSOLIDATE by GENERALIZING
  the one kernel store (polymorphic schema / text-or-extensible enum, NOT a parallel table) UNLESS BOTH prongs
  of the GENUINE-TWO-CONCERNS test hold: (i) materially different read/write patterns or governance models (not
  mere presentation), AND (ii) distinct governing authorities or trust boundaries. Scope/shape divergence alone
  fails the test; the BURDEN is on the proposer of a second store to prove both prongs. (Affirms + extends
  [2026] VJS-DEC 17.)
  DISPOSITIONS:
  - entityEdge: FOLD the frontend EntityEdge into the kernel entity_edge (already polymorphic:
    src/dst entity_node_type incl PARTY/GLOBAL_IDENTITY/TABLE_ROW/MATTER, edge_kind text). Generalize
    matter.attach into an edge.create/update/delete suite so all edge writes route through verbs. One store.
  - matterRelation: GENERALIZE the kernel matter_relation to carry SPAWNED lineage AND user RELATED relations
    (kind is already text - no migration needed for new kinds; make parent_step_id nullable for user relations)
    + build matter.relation.add/list/remove verbs. One store, not a parallel frontend graph.
  - Party vs GlobalIdentity: PARTY is the identity source-of-truth (INV-10 dedup, workspace-scoped). The
    frontend GlobalIdentity is RETIRED as a write store -> a read-only projection over party, or deleted.
  - money payment_request connection: CONVERGE toward bill_connection as the canonical rail-credential store,
    with scope-constrained reads; DEFER the full bill_connection vs pipeline_connection merge to a court
    determination on credential housing (interim: do not fork a third store; treat bill_connection as canonical
    for payment rails, pipeline_connection as the general connector registry, pending the merge ruling).
basis:
  - DEC-OPBOX-UNITARY-STACK-001
  - DEC-OPBOX-REGCOMMENT-001
  - ACT-CONSOLIDATION-FRAMEWORK:s4
  - ACT-001:s4
reason: >
  Consolidation-over-fragmentation is the realm's steering law; DEC-17 already ruled "generalize the kernel
  store, never fork." This generalizes that into a test with a burden of proof, so scope/shape divergence is
  resolved deterministically (fold into one generalized kernel store) and a second store is permitted only on a
  proven genuine-two-concerns showing. The kernel tables here are already built extensibly (polymorphic edge,
  text relation-kind), so folding is cheap and correct.
consequences:
  must:
    - generalize_the_one_kernel_store_for_same_concept_scope_forks
    - require_both_prongs_proven_before_permitting_a_second_store
    - route_all_writes_of_a_generalized_store_through_verbs
  must_not:
    - fork_a_parallel_frontend_store_for_a_concept_the_kernel_already_models
    - treat_scope_or_shape_divergence_alone_as_two_concerns
review_triggers:
  - schema_changed
  - authority_basis_missing
