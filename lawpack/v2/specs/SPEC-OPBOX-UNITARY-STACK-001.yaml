id: SPEC-ACMECO-UNITARY-STACK-001
citation: "[2026] VJS-SPEC 3"
title: Acmeco Unitary Stack architecture spec
purpose: >
  Define the target architecture for Acmeco kernel<->frontend integration on the
  shared-Postgres single-box deployment: one source of truth per kernel-owned
  table, reads-direct, writes-via-verbs, RLS at the database; and the migration
  order that removes the transitional sync/projection. The detailed engineering
  spec (per-domain table, migration order, where-impossible carve-outs) is kept in
  the Acmeco repo at kernel/docs/kernel-integration-outline.md, which gives effect
  to this decision.
scope:
