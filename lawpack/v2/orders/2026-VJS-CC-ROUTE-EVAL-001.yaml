id: "2026-VJS-CC-ROUTE-EVAL-001"
assent_source: standing_bounded_assent
citation: "[2026] VJS-CC 1"
title: Route-Eval Divergence; DEC-006 Substring Governs On-Point Authority
court: county
jurisdiction: agent-universe-v2
status: binding
issue: route_eval_divergence
holding: >
  Reading A prevails. DEC-006 forbids semantic authority matching: an authority
  is on-point only by a literal substring of the issue tag in its id, title, or
  summary. The two route eval cases used namespace-prefixed tags
  ("public_private.repo_facts", "release.push") that match no authority's literal
  text and are significant (medium risk or external target), so the kernel
  correctly routed them as first-impression (CourtRequired) under the settled
  rule. The eval, not the kernel, was out of step: a significant act WITH an
  on-point governing authority is conditioned, not first-impression. The safe
  direction for routing to drift is stricter and fail-closed, and it did.
directives:
  - id: D1
    actor: lexby
    must: correct_the_two_route_eval_cases_to_tag_each_input_with_a_governing_authority_substring_so_they_test_the_real_allowed_with_conditions_path
  - id: D2
    actor: lexby
    must: preserve_dec_006_no_semantic_matching_the_kernel_routing_is_not_amended
forbidden:
  - softening_dec_006_to_match_a_dotted_domain_tag_semantically_without_a_recorded_amendment
  - loosening_the_eval_expectation_to_allowed_with_conditions_for_a_tag_that_matches_no_authority
supersedes: []
created_at: "2026-06-10T19:30:00Z"
bench:
  - Ledgerward
vote: "1-0 (Ledgerward CCJ)"
convened_at: "2026-06-10T19:30:00Z"
case_file_digest: "sha256:a0d793dc9e7dfbab3718ecf972a8236c3a6a5c7b9b2b389d13be26576cb5aed1"
appeal_of: ""
appealable: true
runtime_summary: >
  Kernel routing is correct under DEC-006; the eval used tags matching no
  authority. Corrected the eval to governing-authority tags; the suite is green.
  No semantic matching; the kernel is not amended.
