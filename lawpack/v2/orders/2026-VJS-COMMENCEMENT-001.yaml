id: 2026-VJS-COMMENCEMENT-001
assent_source: sovereign_assent
court: supreme_court
jurisdiction: default
repo_code: VJS
status: binding
issue: vjs-v2-commencement
holding: >
  The Computer-First Realm Act 2026 ([2026] VJS-ACT 8) is enacted on Royal
  Assent (2026-06-09) and is STAYED. It incorporates the Supreme Court
  settlement [2026] REALM-SC 10 and the conditions of [2026] REALM-PC 24, and
  commences as live V2 runtime law only when all Schedule 1 conditions are
  satisfied and recorded. Royal Assent is the sole constitutive gate; the
  remaining conditions are recorded preconditions.
directives:
  - id: D1
    actor: agent
    must: treat_v2_as_enacted_but_not_commenced_until_schedule_1_recorded
    when: always
  - id: D2
    actor: agent
    must: complete_and_record_the_remaining_commencement_conditions
    when: before_commencement
  - id: D3
    actor: agent
    must: not_represent_the_founding_as_self_executing_or_inevitable
    when: always
forbidden:
  - mark_act_in_force_without_schedule_1_recorded
  - presume_or_automate_royal_assent
  - treat_v1_as_binding_gap_filler
exceptions: []
supersedes: []
source_opinion: null
runtime_summary: >
  V2 is founded but not yet commenced. ACT-COMPUTER-FIRST-REALM is stayed; it
  incorporates REALM-SC 10 and REALM-PC 24. Commencement awaits the Schedule 1
  conditions: assent recorded (done), handover order (this order), entrenchment
  invariant (INV-ENTRENCHED-GATE-001, to build), verified protective-floor
  carry-forward (to build), lawpack validation (live), real founding-lock digest
  (to build), and the recorded real alternative (done). On satisfaction a later
  order flips the Act to in_force.
