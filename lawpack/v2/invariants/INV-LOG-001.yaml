id: INV-LOG-001
title: Material implementation decisions require a log
scope:
  action_kinds:
    - implementation_decision
    - public_record_change
    - external_act
rule:
  requires:
    - decision_log
    - authority_basis
severity: error
failure_route: block_commit
remedy: Run vjs log decision with the controlling basis.

basis:
  - ACT-RECORDS-LOGS:s1
  - REG-LOG-001
