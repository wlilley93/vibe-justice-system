id: INV-KERNEL-002
title: Core kernel contains no network capability
scope:
  paths:
    - crates/vjs-core/**
rule:
  none_of:
    - dependency_added: "reqwest"
    - dependency_added: "hyper"
    - dependency_added: "ureq"
    - dependency_added: "curl"
severity: fatal
failure_route: blocked
remedy: Move network code to vjs-mcp or vjs-git.

basis:
  - ACT-AGENT-DUTIES:s8
  - DEC-KERNEL-001
