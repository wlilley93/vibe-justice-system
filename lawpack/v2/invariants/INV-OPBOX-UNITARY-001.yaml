id: INV-OPBOX-UNITARY-001
assent_source: sovereign_assent
title: Opbox kernel-owned data-plane changes require a decision log
severity: error
scope:
  paths:
    - Executive/ministry-of-business-engineering-and-skills/engineering-department/projects/opbox/**
rule:
  kind: if
  condition:
    kind: any
    items:
      - kind: path_changed
        glob: "Executive/ministry-of-business-engineering-and-skills/engineering-department/projects/opbox/kernel/**"
      - kind: path_changed
        glob: "Executive/ministry-of-business-engineering-and-skills/engineering-department/projects/opbox/frontend-v2/prisma/**"
  then:
    kind: decision_log_exists
basis:
  - DEC-OPBOX-UNITARY-STACK-001
  - SPEC-OPBOX-UNITARY-STACK-001
remedy: >
  Record a decision log for any change to the Opbox kernel-owned data plane
  (kernel verbs/schema or the frontend Prisma schema), confirming it conforms to
  the Unitary Stack ([2026] VJS-DEC 15): reads-direct from the kernel's singular
  tables, writes only via kernel verbs, RLS at the database, and no new
  projection/sync for kernel-owned data. A direct Prisma write to a kernel-owned
  table, or a new sync/projection, is a breach to be made good.
