id: REG-LOG-001
title: Mandatory Decision Log Regulation
authority: ACT-RECORDS-LOGS:s1
status: in_force
rule:
  when:
    any:
      - material_implementation_decision
      - public_record_change
      - external_act
      - security_sensitive_act
  must:
    - write_decision_log
  max_words: 150
