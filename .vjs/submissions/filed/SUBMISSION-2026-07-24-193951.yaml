question: 'What is the lawful locus of the opbox workflow/automation domain relative to boltrig: route execution through boltrig (X), mirror definitions+runs into boltrig for visibility (Y), or neither - keep it solely on its existing Rust-kernel system-of-record and do not duplicate into boltrig (Z)?'
facts: |
  # Symmetric case file: locus of the opbox workflow/automation domain relative to boltrig

  Issue: opbox_workflow_domain_locus

  The approved boltrig plan (Phase 2) directs promoting opbox automations into boltrig
  `workflow_definitions` to render + execute in boltrig, asserting "single execution engine =
  boltrig". A read-only two-repo investigation established facts the plan lacked.

  Findings of fact (cited; no preference):
  1. Opbox workflows are already owned by the Rust "unitary-stack" kernel, NOT boltrig. The opbox
     engine (`executor.ts`, `runWorkflow`) persists run state through the Rust kernel via verbs
     (`workflow-run-kernel-writes.ts`); `workflow_run_projection` is kernel-owned. The only
     opbox<->boltrig coupling anywhere is the chat/agent path, not workflows.
  2. Boltrig's interpreter (`workflows/interpreter.py`) executes ONLY control-flow + governed verbs:
     each step's action must resolve to a registered adapter/agent verb or it fails closed. It is not
     a runtime for arbitrary externally-authored typed step graphs.
  3. ~24 of opbox's ~45 step types are domain-bound (create_matter, generate_document, table rows,
     send_form, wait_for_submission, assign, update_status, run_integration, send_notification). Boltrig
     has no verbs for them.
  4. Boltrig CAN receive a mirror: `workflow_definitions` + `POST /v1/workflows` + `workflow_run_records`
     (observability-only) exist, but lack an `external_ref`/`opbox` source (small addition needed).
  5. Opbox workflow data already lives in opbox Prisma (companion) AND the Rust kernel (SoR); a boltrig
     copy is a THIRD store for one concern.

  Options:
  X (execution through boltrig): FOR one estate-wide engine, the plan's aim. AGAINST infeasible -
  boltrig fails closed on the ~24 domain steps; making it work needs ~24 opbox callback verbs, after
  which opbox STILL executes while losing its pause/matter-bridge/submission semantics, and it creates
  a second execution authority over a Rust-kernel-owned domain.

  Y (mirror for visibility): FOR unified workflow visibility inside the boltrig UI; the receiving
  surface exists. AGAINST duplicates an already-folded domain into a third store; any divergence
  reintroduces the split-brain the unitary stack removed.

  Z (neither; keep on existing SoR, do not duplicate): FOR the domain already has ONE system-of-record
  (the Rust kernel); cross-frontend visibility is served from that SoR's read models, readable by any
  frontend. AGAINST declines the plan's literal instruction to surface opbox automations inside the
  boltrig UI specifically.

  Governing material: the consolidation principle (Principal's standing steer; spirit of
  ACT-CONSOLIDATION-FRAMEWORK) - do not split one concern across systems; the opbox unitary-stack
  architecture (kernel owns regulated facts, workflows within it); and the plan's now-contradicted
  premise "single execution engine = boltrig".

  Reserved (not for this forum): whether the two kernels (Rust unitary-stack + boltrig) should
  ultimately be reconciled into one is foundational and is expressly NOT put here.
