id: SUBMISSION-2026-06-12-125753
court_requested: privy_council
jurisdiction: default
question: 'On appeal from [2026] VJS-CC 15 (permission granted): (1) Is enforcing ACT-COMPUTER-FIRST-REALM s.5''s exclusion of records with no kernel effect CONCORDANCE-MACHINERY, or a RESERVED constitutive act defining the boundary of the runtime authority graph? (2) Do the County''s route-for-correction conditions CURE the s.14/s.23 assent-floor risk, must they be ENTRENCHED against future hardening, or is the deterministic gate RESERVED with limb (a) left to the agent rung?'
facts: |
  Appeal from [2026] VJS-CC 15 (Marrowby CCJ), permission granted on two points. Symmetric file; the appellant's preference is not before the court. The Privy Council may AFFIRM, VARY, or REVERSE.

  COUNTY HELD: the s.5(a) gate is MACHINERY WITH CONDITIONS. It is a validity gate on its face (reserved side of the dividing line), saved because s.5 - primary law, already assented - itself excludes a record with no kernel effect; the kernel only gives that exclusion deterministic effect. The assent-floor objection is defused by s.5's own grammar: an unimplemented-operation record is a DISCREPANCY "routed for correction", never voided. Conditions D2-D5: route-for-correction never void; assented gap cured by registry extension not removal; structural only; registry editable.

  POINT 1 (dividing line). AFFIRM: enforcing s.5 is pure concordance; the Sovereign narrowed valid law in s.5 at assent, not the kernel; clerk gives effect, not court (s.11). RESERVE: to enforce "no kernel effect" the kernel must first DEFINE it; which operations "count" is the boundary of the runtime authority graph, arguably constitutive of what binding law IS, a question s.11 reserves from the clerk ("create force by computation"). The line between giving-effect and defining may be illusory.

  POINT 2 (assent floor s.14/s.23). CURED: the gate as built is a non-blocking Warning; an assented record with an inert kernel_effect validates OK, flagged not removed; zero false positives on the real lawpack; the operation set is editable so unimplemented verbs are cured by extension. NOT CURED: a Warning becomes a blocking Error by a one-line change; the cure rests on a contingent disposition, not an entrenched guarantee. s.14/s.23 are meant non-derogable BY CONSTRUCTION. The court should ENTRENCH the never-void/never-block-an-assented-record character (amendable only by Sovereign-assented primary law citing s.5), or hold the deterministic gate RESERVED and leave limb (a) to the agent rung beside limb (b).

  GATE AS BUILT: "inert" = a kernel_effect present but every recognized operation field empty (bare top-level force_source is inert; force_source inside a populated defines is real effect, not flagged); Warning routed for correction; 93 tests pass. The implemented "registry" is the KernelEffect operation schema, not the 37 PredicateExpr arms the submission named.

  ASKED: settle (1) concordance-machinery vs reserved constitutive act, and (2) whether the conditions cure the assent floor or must be entrenched (or the gate reserved). Limb (b) is not in issue (agent rung, s.11).
