question: Where two registers describe the same class of terms that must not enter canon, which governs, and may a gate read a register narrower than the harm it exists to prevent?
facts: |
  # Two registers of "a subscriber term", and the write gate reads the emptier one

  ## Agreed facts

  1. The D1 canon-write gate's prose limb (signal 4) blocks a canon record whose
     body names a subscriber, reading its codes from
     `lawpack/v2/federation/subscriber-registry.yaml`. That file lists exactly one
     code: `ACMECO`.
  2. The publication boundary reads a different register,
     `.vjs/publication-denylist.txt`, holding 14 hashed terms including `opbox`,
     `boltrig`, `beelink` and `CC-OPBOX`.
  3. So a term can be absent from register 1 and present in register 2. Measured,
     three canon records name such a term and were admitted:
     - `judgments/2026-VJS-CC-OPBOX-002-opinion.md` ("opbox")
     - `judgments/2026-VJS-CC-VJS-12-exhibit-full-case-file.md` ("boltrig")
     - `judgments/2026-VJS-CC-VJS-13-opinion.md` ("OPBOX")
  4. Not theoretical: `vjs gazette` now REFUSES, so canon cannot be published at
     all until this is disposed of. The refusal is correct; the admission was not.
  5. The third was authored and landed TODAY by the applicant, under a permit,
     past a green validate. The applicant SELF-FILES that as a breach of the duty
     of care: ACT-005:s1 requires canon to be generic, and the applicant wrote a
     subscriber's code into a judgment and did not check.
  6. CC-VJS 13 obiter (iv) recorded that a live subscriber is absent from the
     registry, so "every protection keyed on that list does not reach it". Nobody
     acted. This matter is that obiter arriving as a defect.

  ## Question

  Where two registers describe the same class (terms that must not enter canon),
  which governs, and may a gate read a register that is narrower than the harm it
  exists to prevent?

  ## Option A: one register, accessioning the denylist into the registry

  For: the write gate then refuses exactly what publication refuses, so canon
  cannot accumulate an unpublishable record. Two copies of a rule is one copy and
  a disagreement.
  Against: the denylist is HASHED deliberately, so merging means publishing the
  private terms in cleartext, which is the harm it exists to prevent.

  ## Option B: the write gate tests membership against the hashed denylist

  Keep both files; have signal 4 hash each candidate token and test it against the
  denylist, as the publication gate already does.
  For: no cleartext disclosure, one effective register, and the mechanism is
  already written and proven at the publication boundary.
  Against: a blocked author learns only that some denylisted term is present, not
  which. The publication gate already behaves that way.

  ## Option C: leave it; publication is the backstop

  For: no record escaped; the boundary held.
  Against: it holds by refusing to publish the whole estate, and stays so until
  every admitted record is cured. A backstop that stops everything is an outage.

  ## Relief

  Which register governs; whether the three admitted records must be cured and by
  whom; and whether the self-filed breach requires more than making the work good.
