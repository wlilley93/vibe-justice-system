id: SUBMISSION-2026-06-25-citation-grounding
court_requested: privy_council
jurisdiction: vibe-justice-system
question: >
  The bench-integrity gate ([2026] VJS-SC 2 / VJS-PC 14) verifies an order's COMPOSITION
  (bench size, opinions present, case-file digest) but NOT the STATUTORY ACCURACY of the
  authorities the order cites. So an order whose holding or directives cite an authority
  or section that resolves to NO defined in-force instrument (a hallucinated "s.99", a
  mis-cited Act) passes validate and enters canon, although a ruling "made in ignorance
  of binding law is per incuriam and void". The integrating writer caught exactly this by
  hand when recording [2026] VJS-PC 16 (manually verifying ACT-COMPUTER-FIRST-REALM s.23
  existed and said what the bench claimed) - a duty that should be deterministic. Per
  Q1-Q4: (Q1) should a deterministic CITATION-GROUNDING gate require every authority /
  section an order cites in its operative parts to resolve to a real, defined, in-force
  instrument, giving teeth to the per-incuriam doctrine; (Q2) is an unresolved citation a
  CONSTITUTIVE defect (the order is per incuriam / void ab initio, never softened by an
  assent claim, like bench-integrity) or a CORRECTABLE one (route-for-correction: fix the
  citation), and how does it interact with the entrenched assent floor (an order declaring
  standing_bounded_assent); (Q3) the SCOPE and granularity - operative parts (holding +
  directives) at section level, with carve-outs for a negated mention ("no DEC-X"), a
  citation to a genuinely superseded-but-historical instrument, and an order's own
  forward self-reference; (Q4) the SEVERITY for orders, given the existing lawpack-wide
  DANGLING_REFERENCE check is a non-blocking Warning.
facts: >
  F1. The bench gate (crates/vjs-core/src/bench.rs verify_bench) checks size + silent
  seats + opinion source; it never reads the cited law. The apex/tier gates check the
  court's authority. None verifies the order's citations resolve.
  F2. A lawpack-wide referential-integrity check EXISTS (LawpackValidator::
  check_referential_integrity) and emits DANGLING_REFERENCE, but only as a WARNING and
  over the whole lawpack, not fail-closed for an order's operative ratio, and it matches
  ids by a regex that also trips on partials (the REG-FEDERATION line-wrap this session).
  F3. The governing doctrine: SPEC-LAW / the Vibe Procedure Rules - only the RATIO binds;
  "a ruling made in ignorance of binding law is per incuriam and void". The kernel today
  relies on the bench reading the law correctly; nothing deterministic enforces it.
  F4. The entrenched assent floor (ACT-ASSENTED-RECORD-PROTECTION / VJS-ACT 10) routes a
  Sovereign-assented record's defects for correction, never voids/blocks - EXCEPT the
  constitutive-validity codes ([2026] VJS-PC 16) which go to whether the record IS a valid
  order and are never softened. The question is which side of that line a hallucinated
  citation falls on.
  F5. Section-level granularity is available: instruments define section ids (e.g.
  ACT-COMPUTER-FIRST-REALM:s23) and the parser already splits "ID:sN".
requested_order: >
  Determine Q1-Q4. If adopting: direct a deterministic, model-free citation-grounding
  gate over an order's operative parts, fail-closed for orders, with the disposition
  (constitutive vs correctable) the bench holds, the assent-floor interaction settled, and
  the carve-outs (negation / superseded-historical / self-reference) specified. Machinery
  under ACT-CONSOLIDATION-FRAMEWORK:s7 if it amends nothing.
private_boundary: >
  Public canon: VJS governance. No subscriber facts.
positions:
  - id: A
    summary: >
      BUILD IT, CONSTITUTIVE. A citation in an order's operative ratio that resolves to no
      defined in-force instrument makes the order per incuriam - a constitutive defect,
      Fatal, NEVER softened by an assent claim (it goes to whether the order is a valid
      statement of law at all), in the same family as bench-integrity. A citation to a
      genuinely-superseded historical instrument, a negated mention, or the order's own
      self-reference are carved out (not unresolved). Section-level granularity.
  - id: B
    summary: >
      BUILD IT, CORRECTABLE. Require resolution but treat an unresolved citation as a
      CORRECTABLE defect routed for correction (fix the citation and re-record); the
      per-incuriam VOIDNESS is a substantive ruling for a court on appeal, not a presumption
      the clerk-kernel may make. An assented order's citation defect routes for correction
      like any other; a non-assented order's is Fatal.
  - id: C
    summary: >
      DO NOT BUILD A NEW GATE. The existing lawpack-wide DANGLING_REFERENCE Warning plus the
      bench's duty to read the law suffice; a fail-closed citation gate risks blocking valid
      orders on parser edge-cases (partial-id matches, forward references) and over-reaches
      the kernel's clerk role into judging the merits of an order's reasoning.
word_count: 640
