id: SUBMISSION-2026-08-03-203825
court_requested: county
jurisdiction: default
question: Does Order 25 refuse registration for a frame resolving authority from its own children when evidence establishes exactly one candidate body?
facts: |
  # Order 25: single-body frame registrability

  ## Question

  Order 25 permits registration only when a frame resolves its authority from a recognised
  `CURRENT SOURCE` or `SOURCE AUTHORITY` label. Does that rule also refuse a frame whose authority
  resolver selects the frame's own children when competent evidence establishes that the frame has
  exactly one candidate body?

  ## Case for a narrow exception

  The mischief addressed by Order 25 is undecidable authority: where current and legacy bodies sit
  beside one another, a signature that does not identify which body governs signs nothing decidable.
  If there is exactly one candidate body, no competing body exists to disambiguate. A label then
  adds form without changing which content is signed. The Court could preserve the bright-line rule
  for multi-body and unexamined frames while admitting a single-body frame only after an instrument
  proves uniqueness at a Court-specified capture depth.

  ## Case for the existing bright line

  An authority label is deterministic and directly inspectable. A claim that a frame has one body
  depends on how candidate bodies are defined, the capture depth, and whether the instrument can
  distinguish absence from failure to inspect. An empty quarantine list is not itself proof that no
  other candidate exists. Replacing a label predicate with a content inference may recreate the
  uncertainty Order 25 removed. Compliance cost does not justify weakening a safeguard.

  ## Relief sought

  In order of preference:

  1. Declare whether Order 25 reaches the proven single-body case.
  2. If a narrow exception is lawful, specify the evidence and capture depth required, while keeping
     unlabelled, multi-body, and incompletely inspected frames refused.
  3. If the current bright line controls, confirm that the lawful remedy is to add a recognised
     authority layer through the normal design-system writer and obtain a fresh signature.

  No widening of accepted marker vocabulary and no registration before the ruling is sought.
