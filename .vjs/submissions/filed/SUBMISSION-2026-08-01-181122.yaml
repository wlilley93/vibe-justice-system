question: Must a verb that writes a governed artefact produce something the STRICTEST reader of that artefact accepts, or may lenient readers keep their own laxity; and where two verbs write one artefact under opposite completeness rules, which governs?
facts: |
  # Facts: `vjs invoke` writes two artefacts that other doors refuse

  Filed by Lexby on its own motion, 2026-08-01. CC-VJS 16 obiter (i) directed the first
  limb be filed today; I file it corrected by fresh measurement, with a second limb
  found beside it.

  Fixture: a fresh git repo, `vjs invoke --jurisdiction probe --principal Probe
  --lawpack <apex canon>`, no other flags.

  ## Limb 1: the config it writes, the pre-push door cannot read

  `PathsConfig` (`vjs-store/src/lib.rs:388`) requires nine keys with no
  `#[serde(default)]`. The template `invoke` writes supplies six: `specs`, `decisions`
  and `cache` are absent. Three readers, three strictnesses:

  | reader | behaviour on the config `invoke` wrote |
  |---|---|
  | `vjs-store` `Store::open` | hard error, `missing field 'specs'` |
  | `vjs-engine/src/lib.rs:248` | `read_to_string(..).ok()?`, tolerates it |
  | `vjs-lawpack/src/lib.rs:425` | `unwrap_or_default()`, fail-open to empty |

  Measured at HEAD:

      vjs validate           -> Validation: OK
      vjs validate --staged  -> FAILED, [Fatal] INSTALL_HOOKS_MISSING
      vjs local-ci           -> Error: missing field `specs`   (exit 1)

  **This corrects CC-VJS 16 obiter (i).** That obiter recorded BOTH `validate --staged`
  and `local-ci` dead. At HEAD only `local-ci` is dead. `validate --staged` parses the
  config and reaches its gates. So the pre-commit door works and the **pre-push** door -
  seven steps, including `permit_gate`, `citation_check`, `boundary_scan` - cannot run
  at all in any jurisdiction `invoke` created. That obiter also warned that fixing this
  un-masks CC-VJS 16's displacement, so CC-VJS 16 C1 to C6 must land first or together.

  ## Limb 2: the install lock it writes, `install-lock` refuses to write

      $ vjs invoke ...            # writes .vjs/install.lock
      $ grep hooks .vjs/install.lock
      hooks = []
      hook_digests = []
      adapters = []

      $ vjs install-lock
      Error: cannot lock an incomplete install: enforcement hooks not installed

  One artefact, two writers, opposite completeness rules. `invoke.rs:150` claims in its
  own comment that the lock "is deferred to a later `vjs install-lock`" when the surface
  is incomplete. It is not deferred: `build_manifest` returns `Some` with empty hook
  lists and the write happens unconditionally. `invoke` also writes a one-line header
  where `install-lock` writes a two-line one carrying the re-lock instruction, so
  whichever verb ran last decides whether the file explains itself. I observed this in
  the apex repo today: re-pinning the lawpack silently stripped that instruction.

  ## What is genuinely open

  Whether a verb that writes an artefact must satisfy the **strictest** reader of that
  artefact, or whether lenient readers are entitled to their own laxity. The answer
  decides both limbs, and decides whether `PathsConfig` gains defaults or the template
  gains three keys - which in turn decides whether existing jurisdictions self-heal or
  must be re-invoked.
