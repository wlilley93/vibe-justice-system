id: SUBMISSION-2026-08-01-234024
court_requested: county
jurisdiction: default
question: May persisted Codex tool output be projected back into a later turn's prompt to restore continuity, when the read-only lane's quarantine exists precisely to keep such content out of the model's context; and if so, in what form, and does a HITL-paused turn differ?
facts: |
  # Facts: restoring Codex turn continuity means replaying, into the prompt, the content the quarantine exists to exclude
  
  Filed by Lexby on its own motion while working the yc-software/qm harvest list
  (`opbox-prod/docs/HARVEST-2026-08-01-yc-qm.md`, open item 3).
  
  ## 1. What the harvest list asserts
  
  "Project persisted events back into the turn, per lane. A codex conversation currently
  forgets its own tool work between turns, and a HITL-paused turn is erased from
  continuity."
  
  I do not adopt that wording. Below is what I measured, and then what I could not settle.
  
  ## 2. Measured
  
  **A Codex thread is ephemeral and carries no prior context in.**
  `codex_app_server.py:120-150`, `thread_start`, sends `"ephemeral": True` and accepts only
  `cwd`, `model`, `sandbox`, `approvalPolicy`, `baseInstructions`, `developerInstructions`.
  There is no history parameter.
  
  **Codex is told not to persist history at all.** `codex_runtime_config_toml.py:139-140`
  writes `[history]` / `persistence = "none"` into the generated config.
  
  **A turn's only inbound channel is one string.** `codex_app_server.py:196-216`,
  `turn_start`, sends `input: [{type: "text", text: prompt}]` plus an optional output schema.
  Anything a later turn is to know about an earlier one has to be inside that string.
  
  **The lane is quarantined by construction.** The read-only preflight
  (`codex_runtime_preflight.py`) attests an EMPTY MCP inventory and zero hooks, and
  `codex_runtime_admission.py:199` refuses any admission that is not read-only.
  
  ## 3. What I could not settle, and did not guess
  
  Whether a cell and its thread survive BETWEEN user turns, or are torn down per turn. If a
  thread is reused within a live cell, Codex holds that thread's own tool work in memory and
  nothing is forgotten until the cell goes. The continuity loss is then a property of the
  cell lifecycle, not of the protocol. Settling it means reading the actor and provider
  lifecycle (`codex_runtime_actor.py`, `codex_trusted_proxy_provider.py`) properly, and I
  would rather file this with the question open than close it on a reading I did not do.
  
  The size of the defect therefore is not established. Its SHAPE is, and the shape is what
  the fork turns on.
  
  ## 4. The fork, and why it is not mine to take
  
  The only way to carry prior tool work into a Codex turn is to put it in the prompt string.
  That is not an implementation detail, it is the thing the lane was built to prevent.
  
  The read-only cell has no MCP servers, no hooks, an empty workspace projection and a
  read-only filesystem sandbox (which, since today, is PROVED to engage rather than
  configured to - `codex_sandbox_engagement.py`). The whole design keeps untrusted content
  away from the model's context. Replaying persisted tool OUTPUT into the next turn's prompt
  puts that content back, by hand, through the one door left open.
  
  Three questions I cannot answer by applying existing law:
  
  **(a) Is projected output a re-entry?** If prior tool output was already in a previous
  turn's context, replaying it may add no new exposure. If any of it originated outside the
  cell, replaying it is a fresh injection channel that no admission check sees, because
  admission looks at the cell's inventory and not at the prompt's provenance.
  
  **(b) What may be projected, and who decides?** A verbatim replay, a summary, or only the
  tool CALLS without their results are three different products with three different risk
  profiles. A summary is itself model output and cannot be attested.
  
  **(c) Does a HITL-paused turn differ?** A turn that paused for a human and resumed has an
  approval in the middle of it. Whether the resumed turn may see the pre-pause work is a
  question about what the human approved, not about continuity.
  
  ## 5. Why I am not disposing of it myself
  
  It is first-impression and it is not reversible in the low-blast sense: a projection seam,
  once built, is the thing every later lane reaches for, and narrowing it afterwards is a
  migration rather than an edit. It also cuts across a quarantine that exists because of an
  earlier ruling, so building it on my own reading would be deciding the ruling's scope
  without saying so.
  
  Nothing is changed meanwhile. The lane behaves exactly as it did.
