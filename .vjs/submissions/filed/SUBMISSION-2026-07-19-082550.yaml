question: 'Codex trusted-proxy bearer-delivery channel for the production multiplayer path: after SO_PEERCRED gates issuance ([2026] VJS-CC-VJS 1), does the attested bearer reach the cell by a 0600 file (A) or the authenticated socket connection (B)?'
facts: |
  # Case file: Codex trusted-proxy bearer-delivery channel (production/multiplayer)

  QUESTION: After SO_PEERCRED attestation of the auth-helper peer gates bearer ISSUANCE
  ([2026] VJS-CC-VJS 1), by what channel does the issued short-TTL bearer reach the Codex
  cell in the production multiplayer path - a 0600 file, or the authenticated socket
  connection itself?

  FACTS
  - Codex spawns an `auth.command` helper that must write the RAW bearer to stdout
    (verified openai/codex#16288). This Codex-facing contract is fixed.
  - [2026] VJS-CC-VJS 1 (Option C, binding): no bearer may be issued without a prior
    SO_PEERCRED unix-socket attestation of the helper peer; the loopback TCP proxy then
    authenticates each model call by that bearer alone. The RATIO fixes attestation-gates-
    issuance; it does not name the post-attestation delivery channel.
  - [2026] VJS-CC-VJS 2 (interim, binding): the current trusted stopgap delivers the bearer
    as a sibling 0600 file the helper `cat`s (single-uid). D5: build so it "maps onto the
    SO_PEERCRED swap without rework, identical auth.command and delivery contract, keep
    bearer file delivery to a single service uid, never widen file permissions to bridge
    distinct-uid cells." FORBIDDEN: "widening bearer file permissions to serve distinct-uid
    cells in place of the SO_PEERCRED socket."
  - The SO_PEERCRED stack (linux_peer_process_handle.py, model_proxy_peer_attestation.py) is
    built + unit-tested but unwired; on a connection it holds a pidfd and proves the
    connecting peer's process identity + liveness.

  OPTION A - file delivery preserved. SO_PEERCRED attests the connecting peer, but the
  bearer is still written to a sibling 0600 file the helper `exec cat`s. For: preserves the
  literal VJS-CC-VJS 2 D5 "identical bearer-file delivery contract" the trusted-path
  docstrings promise; minimal swap (only build_cell_scope -> attest changes); helper stays
  `/bin/sh cat`. Against: a 0600 file is readable by ANY same-uid process, so the bearer is
  bound only to the uid, not to the specific attested process the pidfd proves - a gap
  between "who was attested on the socket" and "who reads the file."

  OPTION B - socket delivery. The helper connects to the unix socket, is SO_PEERCRED+pidfd-
  attested, and receives the bearer ON that same connection (no file at rest). For: the
  bearer is bound to the exact attested process (no same-uid read gap); no credential at
  rest; consistent with VJS-CC-VJS 2's forbidden-item premise that distinct-uid cells are
  served "by the SO_PEERCRED socket," not files. Against: abandons the literal "file
  delivery" wording of D5; the helper becomes a small socket client rather than `cat`,
  changing the helper's internals (though not the Codex auth.command stdout contract).

  TENSION TO RESOLVE: A honours D5's "identical FILE delivery" phrasing; B honours the same
  directive's forbidden-item premise (socket serves distinct-uid cells) and closes the
  attest-vs-read process-binding gap. The two binding rulings pull apart on their face; the
  production delivery channel is unruled by either ratio and is load-bearing and hard to
  reverse once built.
