id: SUBMISSION-2026-06-16-210058
court_requested: supreme_court
jurisdiction: default
question: Where should Acmeco matter files physically live, and what user/storage identity model should govern them, given the kernel's encrypt-before-write (INV-7), workspace RLS, in-transaction audit (INV-8) and the assented-record floor - keep the kernel-Postgres-encrypted store as the system of record (A), make a real per-user Linux filesystem the system of record (B), or a hybrid where the kernel owns metadata/permissions/audit and bytes go to a pluggable backend with a per-matter folder view (C)?
facts: |
  Symmetric case file; the advocate's (Lexby's) preference is not before the court. Foundational
  Reference - engages a constitutional invariant (INV-7 encrypt-before-write).

  AGREED FACTS (verified 2026-06-16 on the dev box):
  - The kernel (Rust) is the data + identity authority. Matter files are rows in `file_record`: bytes are
    AES-256-GCM ciphertext in Postgres bytea, AAD-bound to (workspace_id, file_id) (relocation fails
    decryption) = INV-7. Access governed by Postgres RLS (FORCE; workspace boundary never weakened) +
    tier gates (OWNER/ADMIN/MEMBER/EXTERNAL) + ACL conjunction + sensitivity grades. Files attach to
    matters via entity_edge (matter.attach). One audit event per verb, in-transaction (INV-8).
  - Org tier and workspace membership are SEPARATE. There is NO per-user OS identity, NO filesystem
    layout, NO per-matter folder tree, and NO storage seam today; bytes live only as encrypted Postgres
    rows. The work is REGULATED (legal/estate) - encryption, isolation, audit are load-bearing.

  THE PRINCIPAL'S VISION: each user a real account on a dockerised Linux container with XDG dirs; shared
  per-matter folders that generated/signed docs and forms-as-JSON flow into and are stored against the
  matter; users amend the filesystem; the agent standardises the directory structure; local folders are
  swappable for SharePoint/Box.

  POSITION A (kernel-Postgres SoR + projected folder view).
  FOR: INV-7/RLS/audit/sensitivity preserved natively and unconditionally; consolidation honoured.
  AGAINST: the literal FS vision is met only as a projection; bytea has large-binary limits; SharePoint/Box
  becomes a mirror not a true backend; no real per-user login.

  POSITION B (real per-user Linux filesystem as SoR; kernel indexes over it).
  FOR: directly realises the vision - real amendable FS, OS accounts, SharePoint/Box mounts, files in
  .../matters/<id>/.
  AGAINST: INV-7, RLS, audit, the assented-record floor must be RE-DERIVED on fail-open POSIX; out-of-band
  edits emit no in-transaction audit; a bare rm silently voids an assented record; per-user OS accounts
  multiply attack surface. Per-incuriam risk vs INV-7/RLS/INV-8/the floor.

  POSITION C (hybrid: kernel owns metadata/permissions/audit; bytes in a pluggable backend
  local-FS/SharePoint/Box behind a seam; humans get a per-matter folder view).
  FOR: delivers the folders + amendability + SharePoint/Box-as-true-backend AND keeps RLS/encryption/audit
  as the kernel's responsibility; encryption applied before bytes reach the backend (INV-7 preserved);
  consolidation preserved at the authority layer.
  AGAINST: more moving parts; "user amends the FS directly" must be reconciled with writes flowing through
  the kernel (partially-trusted-edge); SharePoint/Box bring their own permission models to subordinate.

  BINDING LAW TO WEIGH: INV-7 (encrypt-before-write, AAD-bound); RLS (never weakened) + tier/ACL +
  sensitivity; INV-8 (one event per verb, in-transaction); the assented-record floor (ACT-ASSENTED-RECORD-
  PROTECTION [2026] VJS-ACT 10: records routed-for-correction, never voided by machinery); ADR-0040
  fail-closed; consolidation-over-fragmentation; the SPEC-LAW-3 split test (single-source / demonstrated-
  need / severability); proportionality / duty of reasonable skill and care.

  RELIEF: a ruling on the substrate (A/B/C or a variant) with a binding ratio future file/storage work must
  follow, the conditions the winning substrate must satisfy, and consequential directions on per-user OS
  identity and the SharePoint/Box backend.
requested_order: A binding ratio fixing the matter-file storage substrate and its conditions.
