question: Does WCAG 2.2 SC 1.4.11 bind the Opbox design system as real-world law under ACT-001:s3, border measuring 1.20:1 against a 3.0:1 floor as the sole boundary of real controls; and if so is the remedy A, B or C?
facts: |
  # `border`, the 1px hairline, and SC 1.4.11

  First impression; citator checked, nothing on all fours. Measurements:
  `internal-docs/design/CONTRAST_AUDIT.md`. No recommendation is carried.

  ## Facts

  `border` = `rgba(0,0,0,.08)`, compositing to **1.20:1** on both light planes against the
  **3.0:1** floor (SC 1.4.11, control boundaries). 2.5x under.

  It is the *sole* boundary of real controls, not only decoration: the unchecked checkbox
  has no fill, only a `border` stroke. Same for chip outlines, input outlines, panel edges.

  Corpus: 623 `bp(border)` strokes, 1276 `hair()` decorative rules, 28 `bp(borderStrong)`.

  The 1px hairline is a documented house rule and the system's visual thesis.
  Figma and production already diverge: production `--border` is `#cbd5e1` (~1.47:1) across
  five themes, consumed by 130 files. The house rule requires reporting such conflicts, not
  silently picking a side. No order has resolved it.

  Dark `border` has no value anywhere (26 of 52 dark variables unresolved); dark `surface`
  is darker than dark `bg` (1.06:1), inverting the system's own elevation rule.

  Verified candidates: `rgba(0,0,0,.42)` = 3.04/3.02; `#919191` = 3.15/3.02; `#949494`
  fails at 2.91 on `surface`.

  ## Threshold

  ACT-001:s3 puts real-world law above all. **For binding:** sold to firms; EN 301 549
  (WCAG 2.1 AA) is harmonised under the European Accessibility Act from June 2025; UK
  Equality Act adjustments; ADA Title III treats WCAG as the measure. **Against:** the
  artifact is a Figma file, not shipped software; no user has been served a pixel from it;
  the shipped app has a different `--border`. On that reading it is design preference
  dressed as compliance.

  ## Options

  **A - darken `border`.** *For:* cannot be got wrong at a call site; one variable, no
  migration, 1px weight preserved. *Against:* repaints 1276 decorative rules the criterion
  exempts, producing a heavy gridded surface at this density.

  **B - split the role.** `border` stays decorative; `borderStrong` becomes the
  control-boundary token; repoint controls. *For:* raises exactly what 1.4.11 governs,
  exempts what it does not, adds a semantic distinction the system lacks. *Against:*
  classification problem at 651 sites where misclassification is silent - the audit shows
  green while a control fails; cuts against recorded consolidation-over-fragmentation
  steering.

  **C - decline.** Meet the criterion by control *fill* rather than stroke, or record a
  time-bounded non-conformance against the shipped product. *For:* 1.4.11 requires the
  control be perceivable, not its stroke; refuses to fix a Figma file whose values already
  disagree with production. *Against:* leaves a measured failure in the system every future
  screen derives from; larger change than A or B; no answer for panel edges and chip
  outlines, which have no fill.

  ## Questions

  Q3 Is the Figma/production divergence in scope? Q4 Dark mode: in scope, reserved, or
  separate? Q5 Appealable or reserved to a higher forum?

  Nothing is changed by this reference.
