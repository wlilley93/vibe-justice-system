id: SUBMISSION-2026-06-25-mcp-single-front-door
court_requested: privy_council
jurisdiction: vibe-justice-system
question: >
  PC-13 D12 RESERVED the consolidating "single front door, no other entry"
  instrument to a follow-on grounded in the D11 conformance map and returned to
  this Council. The map now exists (264 kernel_effect duties; 22 wired; 242
  unwired). The Principal proposes the mechanism: host the kernel as a server the
  agent can only reach via MCP, so route -> court -> record is the sole governance
  interface. Per Q1-Q5: (Q1) is the matter ripe to ENACT the consolidating
  instrument now, or does it stay reserved; (Q2) is the mechanism the MCP
  server_of_law posture REG-KERNEL-001 already names, made the sole governed-record
  front door, adopted / narrowed / rejected; (Q3) what does the "wired-or-void"
  limb bite on, given 242 unwired duties are mostly declarative / one-time /
  agent-duties that must NOT be voided; (Q4) does the instrument honour the hard
  constraints (anti-Henry-VIII s7; ACT-ASSENTED-RECORD-PROTECTION; REG-KERNEL-001
  keep-hooks-thin / kernel-is-the-only-smart-point / no-logic-in-hooks); (Q5) the
  honest limit - MCP cannot fully cage the agent (it may write a file directly), so
  must the absolute-path commit hook remain the bypass-proof backstop and the
  instrument rest no guarantee on MCP.
facts: >
  F1. PC-13 ([2026] VJS-PC 13, 3-0) declared the unifying principle correct and
  "already latent in enacted law" (REG-KERNEL-001 single smart enforcement point;
  REG-SELF-CONVENE-001 fail-closed route gate; DEC-AGENT-001 lifecycle), and
  RESERVED enactment of the consolidating instrument to a grounded follow-on (D12).
  F2. The D11 map (docs/conformance-map.md, produced THROUGH the kernel by vjs
  audit): 264 kernel_effect duties across in-force statutes and regulations; 22
  wired to a deterministic gate; 242 unwired. The triage note records that UNWIRED
  does not mean must-be-gated: most unwired duties are declarative, one-time /
  transition acts, or agent-duties a deterministic gate cannot or need not enforce.
  F3. REG-KERNEL-001 already DEFINES two postures: server_of_law
  (realm_behind_the_gazette) and embedded_client (subscriber_with_digest_pinned_
  canon); only_smart_enforcement_point: true; must keep_hooks_thin_and_route_every_
  check_through_the_kernel; must_not place_kernel_checking_logic_inside_a_hook. The
  proposed MCP host IS the server_of_law posture, not a new posture.
  F4. The vjs-mcp crate exposes six tools - route, lookup, validate, log, file,
  status - but NOT convene / record / allocate-citation. So an agent can route, log
  and file through MCP today, but cannot constitute a court or record an order or
  mint a citation through it; those run via the CLI and file writes. There is a real
  gap between the present MCP surface and a "single front door".
  F5. The gates D1-D10 (this session) now bind the governed-record chokepoints:
  canon-write content, citation allocation/uniqueness, cross-repo reach, install
  completeness, bench-integrity, tier-floor, the hook surface. They fire at
  pre_write and at validate --staged (the commit gate). The absolute-path git hooks
  call the kernel by repo-root path and are bypass-proof of PATH (D6 backstop).
  F6. The breach this whole line prosecutes (eleven subscriber files self-asserting
  fake citations into canon) was a governed RECORD coming into being by a file write
  that never passed route -> court -> record. The disease is records minted outside
  the front door, not duties left ungated in the abstract.
requested_order: >
  Determine Q1-Q5. If enacting: a consolidating instrument, under s7 (amending no
  statute / bench / tier / jurisdiction / assent rule), whose wired-or-void limb
  bites at the WRITE/ROUTE chokepoint on GOVERNED-RECORD CREATION (law, ruling,
  citation, order, permit) pre-assent and degrades to route-for-correction (never
  void) for any record carrying a valid assent_source, with the MCP server_of_law
  posture as a front door and the absolute-path commit hook as the bypass-proof
  backstop on which no guarantee rests. If not ripe, say so and what remains.
private_boundary: >
  Public canon: this is VJS governance, no subscriber-scoped content. No private
  repo paths, client facts, or subscriber repo_codes appear or may appear.
positions:
  - id: A
    summary: >
      ENACT NOW (grounded). The map is in; the principle is declared correct and
      latent; the chokepoints are gated. Enact the consolidating instrument under
      s7: every GOVERNED RECORD may come into being only through the kernel's
      record-creation path (route->permit, convene->court, allocate->citation,
      record->order), reachable via the MCP server_of_law posture REG-KERNEL-001
      already names AND the CLI, with a wired-or-void limb biting at the write/route
      chokepoint on record CREATION pre-assent, degrading to route-for-correction
      for assented records. Close the MCP gap (gate convene/record/allocate as MCP
      verbs). The absolute-path commit hook stays the bypass-proof floor; no
      guarantee rests on MCP. The limb bites on record-creation, NOT on the 242
      unwired duties wholesale.
  - id: B
    summary: >
      ENACT NARROW. Declare the front-door principle binding and bind the existing
      record-creation chokepoints (D1-D10) as THE front door, but do NOT mandate the
      MCP server posture as sole interface nor a master wired-or-void limb; reserve
      the server posture and the void limb to a further order once the MCP
      convene/record/allocate gap is built and tested. Avoids resting a constitutional
      rule on an interface not yet complete.
  - id: C
    summary: >
      STILL RESERVE. 242 of 264 duties are unwired; a master wired-or-void rule, even
      bounded to record-creation, risks being read across the unwired surface and
      colliding with declarative / one-time / assented law. Keep building gate by
      gate; do not enact a master rule. (PC-13 already weighed and is owed deference;
      the question is whether the D11 map changes the calculus.)
