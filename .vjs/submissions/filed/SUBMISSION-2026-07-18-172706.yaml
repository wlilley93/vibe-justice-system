question: Sequencing to multiplayer-reliable Codex (trusted single-tenant read-only first then harden to SO_PEERCRED multi-tenant; vs full prod-safe SO_PEERCRED spine before Codex runs), and whether a trusted dev-mode bearer mint without SO_PEERCRED is lawful when hard-walled from production or whether [2026] VJS-CC-VJS 1 binds dev too
facts: |
  # Case file: sequencing to multiplayer Codex, and trusted dev-mode lawfulness

  ## Facts

  Boltrig must become safely multiplayer. A load-bearing brick is per-cell credential isolation for
  Codex model calls: a cell must never hold the real key, and no cell may impersonate another.
  [2026] VJS-CC-VJS 1 settled the PRODUCTION design: SO_PEERCRED attests the helper over a unix
  socket and gates bearer ISSUANCE; a loopback proxy authenticates each call by that short-TTL bearer
  and injects the kernel-only key server-side. Its forbidden list bars "issuing a bearer without a
  prior SO_PEERCRED attestation."

  Built + tested: the proxy, broker/store, issuance seam, runtime adapter, read-only provisioning.
  NOT built: the SO_PEERCRED ingress, helper, supervisor registration, and the bearer-delivery
  channel (the sealed AcceptedUnixPeer forecloses same-socket write-back; delivery is undesigned).
  Codex has never run once inside Boltrig. The operator runs a local Bifrost/GLM gateway on their own
  single-uid box.

  ## Q1 sequencing

  **A trusted-first:** build a trusted single-tenant read-only runtime now, minting a bearer from the
  child's real /proc identity WITHOUT the SO_PEERCRED cross-check, hard-walled from prod (dev-auth AND
  a trusted flag AND refuses under any production signal). Cell still holds no real key. Then harden
  into full SO_PEERCRED isolation.
   - For: each brick validated by real use before the next; proves the proxy path end-to-end early;
     maps 1:1 onto the future swap (only token source changes, file -> socket; auth.command contract
     identical) so not throwaway; unblocks use now.
   - Against: ships an identity check weaker than prod before the strong one exists; risks a later
     reader mistaking it for attested; adds a dev path that must be provably unreachable in prod.

  **B prod-safe-first:** build the full SO_PEERCRED spine + attestations + preflight before Codex runs.
   - For: one identity model ever; nothing weaker than prod runnable; no dev/prod wall to get wrong.
   - Against: Codex stays dark through the whole deep build; the undesigned delivery channel (separate
     fork) blocks everything; built against zero real-use feedback; partly owner-blocked.

  ## Q2 lawfulness of a trusted mint without SO_PEERCRED

  Does the forbidden item bind a trusted dev-mode path, or is [2026] VJS-CC-VJS 1 prod-scoped?
   - Prod-scoped: the ruling is framed for "production authentication" and "the read-only cutover";
     its risk analysis is co-located untrusted processes. A single-uid, dev-auth-gated,
     production-refusing path is outside that threat model; the key stays isolated in the proxy, so
     the enacted guarantee (no key in the cell) holds.
   - Binds-dev: the forbidden item is unqualified; any unattested mint risks normalising a bypass that
     leaks to prod; if permitted it must be fenced by hard, test-enforced conditions or refused.

  ## Relief

  A ruling on the correct sequence with its ratio, and on whether the trusted mint is lawful (and if
  so under what mandatory fencing), so the build proceeds strictly to the ruling.
