question: Are the two files that share an order id and citation across .vjs/orders and .vjs/court/orders one record in two projections or two records, and may check_citation_uniqueness widen to all governed-record roots before that is settled?
facts: |
  # Two files, one id, one citation

  First impression; citator checked, nothing on all fours. Verified by diff, by git log,
  and by scanning all three governed-record roots. No recommendation is carried.

  ## Facts

  Two orders exist twice. `.vjs/orders/` holds 55 lines each; `.vjs/court/orders/` holds
  73 and 78. Same `id`, same `citation`, `assent_source` present in both.

  Scanning `lawpack/v2`, `.vjs/orders` and `.vjs/court` for top-level `citation:` finds
  exactly two duplicates, and they are these two pairs. Nothing else in the estate collides.

  The key sets differ both ways. The orders copy carries `repo_code`, `exceptions` and
  `source_opinion`; the court copy carries `title` and `question`. All three extra keys hold
  `null`, so the orders copy carries no VALUE the court copy lacks. Its key order is exactly
  the field order of the `Order` struct, and `Store::write_order` serialises that struct into
  `.vjs/orders`. `title` and `question` are not named fields of that struct and were dropped
  on parse until the 2026-07-27 serde-flatten repair.

  Same-commit is established and does not exclude `order apply`. That command reads any path
  and writes through `Store::write_order`, so running it before committing yields both files
  in one commit. 9a6004c carries the ingress pair, b243f1a the sequencing pair; neither has
  been touched since.

  `overlay_filed_orders` reads `.vjs/orders` only, and no resolver path reads
  `.vjs/court/orders`. `check_citation_uniqueness` reads `lawpack/v2` only and sees neither
  copy. `governed_record_roots` names all three roots, and `is_governed_record` counts both.

  ## Readings

  **A one record, two projections.** *For:* the bytes of one file are a machine serialisation
  of the other, and a projection holding no independent content is not a second claim on the
  citation. *Against:* both were committed as records, both declare assent, and no field, path
  or comment marks either as derived - the realm has no concept of a projection.

  **B two records.** *For:* each is a governed record on the front door's own definition, each
  asserts its own citation, and ACT-004:s8 says collisions are fatal, on its face. *Against:*
  voiding or renumbering one of a pair whose operative parts are identical changes no law, and
  loses either the question or the citator entry.

  ## Consequences

  Under A the guard needs a projection rule before it widens. Under B widening reports two
  FATAL collisions on live County orders today. The guard cannot move until this is settled.

  ## Questions

  Q1 One record or two? Q2 If one, which is authoritative and what is the other? Q3 May the
  guard widen before that is answered? Q4 Does the [2026] VJS-PC 13 D2 uniqueness directive
  reach `.vjs`, or is it lawpack-only? Q5 County, or referred?

  Nothing is changed by this reference.
