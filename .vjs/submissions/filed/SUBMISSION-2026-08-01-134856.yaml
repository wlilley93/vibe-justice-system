id: SUBMISSION-2026-08-01-134856
court_requested: county
jurisdiction: default
question: Where a jurisdiction's lawpack resolves outside the repository tree, must the integrity gates run against the lawpack actually loaded, and what is the correct source of the directory they test?
facts: |
  # Integrity gates skipped where the lawpack resolves out of tree

  ## Agreed facts

  1. `validate()` (vjs-engine/src/lib.rs:313) computes
     `let lawpack_dir = repo.join("lawpack/v2")` and wraps three checks in
     `if lawpack_dir.exists()`: referential integrity, citation uniqueness
     (ACT-004:s8, Fatal on collision) and LAWPACK_LOCK_DRIFT (ACT-007:s7, Fatal).
  2. The kernel resolves the lawpack elsewhere, via `resolve_lawpack_dir`, which
     honours config `lawpack_path`. CC-VJS 12 held resolution "lives here, and
     nowhere else" after finding two copies.
  3. A jurisdiction resolving out of tree has no local `lawpack/v2`, so the guard
     is false and all three checks are skipped, with no finding of any severity.
  4. Live, not theoretical: `vibe-design-system` sets
     `lawpack_path = "../vibe-justice-system/lawpack/v2"`, pins `sha256:8f724ac0`,
     loads a canon now hashing to `sha256:f16a14c4`, and prints `Validation: OK`.
     It is a real jurisdiction: 7 orders, public remote, permit rules.
  5. CC-VJS 13 obiter (ii) named the identical hardcoded-path defect for the D1
     gate and expressly left it undecided.
  6. `compute_digest` already uses `resolve_lawpack_dir`, so only the enclosing
     guard is unresolved.

  ## Question

  Where a lawpack resolves outside the repository tree, must the integrity gates
  run against the lawpack actually loaded, and what is the correct source of the
  directory they test?

  ## Option A: derive the guard from `resolve_lawpack_dir`

  For: applies CC-VJS 12's ratio to the one line still hardcoding the path; the
  checks then mean the same thing everywhere; no new concept or config; the lock
  check stops comparing a resolved digest against an unresolved guard.
  Against: turns three checks on where they have never run, so a quietly drifted
  subscriber goes green to Fatal with no warning period, and validate comes to
  depend on a path outside the repo that may be absent on another machine.

  ## Option B: keep the guard, emit a finding when it is skipped

  For: no behaviour change; the silence, which is the real harm, ends at once;
  cheapest and safest.
  Against: records the hole rather than closing it. A stale or tampered
  out-of-tree lawpack still passes, and ACT-007:s7 is Fatal precisely because
  that is unacceptable. A warning nobody acts on is a defect this court has
  refused to bless before.

  ## Option C: refuse to validate an out-of-tree lawpack

  For: strongest guarantee, no partial enforcement.
  Against: `lawpack_path` is supported and documented, and CC-VJS 12 repaired it
  rather than removing it. Failing closed would brick a live jurisdiction to cure
  a check that never ran there.

  ## Relief

  A ruling on the correct source of the guard and, if A, whether the newly
  enabled Fatals take effect immediately or are staged for one release.
