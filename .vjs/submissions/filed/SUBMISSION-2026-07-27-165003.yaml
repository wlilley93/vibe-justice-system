id: SUBMISSION-2026-07-27-165003
court_requested: county
jurisdiction: default
question: Is the tool-ranking signal for progressive disclosure DECLARED by the adapter as a stored field on the verb row, or DERIVED at offer time from the verb row and the run token's skills?
facts: |
  # Where the ranking signal comes from

  First impression; citator checked, nothing on all fours. Detail: `boltrig/kernel/mcp.py`,
  `boltrig/kernel/dispatch.py`, `boltrig/adapters/mcp_consumer.py`. No recommendation is carried.

  ## Facts

  The `verbs` row is the chokepoint. `_invoke_inner` gates on it at every step - existence,
  `input_schema`, the grant check on the verb id, `idempotency_mode`, `consequence`, and
  `output_schema` after execution - so disclosure can only reduce what reaches a model context,
  never what reaches the table. (`binding` is a separate row on the same id.) The chosen
  primitive is to publish everything and rank the offer.

  `_list_tools` already derives the offer. It emits `id`, `description` and `input_schema` from
  the verb row, filtered by tenant grants intersected with the run token grants, which are the
  loaded skills tool_grants narrowed by those permissions. Nothing about the offer is stored.

  A DECLARED adapter field already exists. `_consequence_hint` reads a declared `consequence`,
  then an Opbox `riskClass`, then MCP `annotations`, then defaults low. A consumed MCP server is
  third-party data, so the value is clamped to the enum and silence resolves to low.

  A stored per-verb value already goes stale. `scripts/resync-builtin-verbs.py` records that a
  builtin registered into a tenant keeps its ORIGINAL verb rows forever, so a later code change
  never reaches it and the code can say HIGH while the kernel gates LOW.

  Opbox declares `VerbTier` (core, on-demand, vertical, admin-only) beside the verb in registry
  source, not in a column, and calls it presentation-layer only.

  The derive-don't-store ratio (county, 2026-07-17) is engaged - where a record holds every
  constituent of a value, it must not also carry the value.

  ## Readings

  **A DECLARED.** A field on `Verb`, a `schema.sql` column, a migration, migration parity.
  *For:* prominence is authorial intent no derivation can recover; the offer becomes a stable,
  attestable contract, which the Codex tool-ceiling attestation needs; `consequence` shows the
  shape is already accepted. *Against:* it trusts a third party to rank itself, and both failure
  modes are silent - a silent adapter takes a default, a lying one is believed inside the clamp;
  and it stores beside a row that already goes stale.

  **B DERIVED.** Ranked at offer time from the verb row and the run token's skills. *For:*
  nothing new is stored, so nothing can drift; the seam that would rank is the one that already
  filters; the standing ratio points here. *Against:* the row carries no prominence signal
  beyond description text, noun and consequence, so the rank is an inference the adapter cannot
  correct, and it changes silently as grants change, which is harder to attest and test.

  ## Questions

  Q1 Declared or derived? Q2 If declared, who may declare, and what does silence mean?
  Q3 If derived, from which fields exactly? Q4 Is this a boltrig protocol obligation or an
  Opbox local choice? Q5 County, or referred?

  Nothing is built by this reference.
