id: SUBMISSION-2026-08-01-184104
court_requested: county
jurisdiction: default
question: Where a published artefact cannot express its lawpack's path without publishing an absolute one, does the digest alone discharge the CC-VJS 15 C4 duty to record the tree it read, or must the path be recorded in some other publishable form?
facts: |
  # Facts: two rulings meet at the published artefact's lawpack path

  Filed by Lexby on its own motion, having disposed of the collision provisionally and
  recorded the reasoning rather than asserting it settled.

  ## 1. The collision

  [2026] VJS-CC-VJS 15 C4 requires the published Gazette artefact to record the resolution
  **source and path** - the tree it actually read.

  [2026] VJS-CC-VJS 17 C4 requires that the publication surface publish no absolute path.
  `render.rs` published `resolution.dir.display()`, the absolute checkout path, whose
  operator-account segment is itself a denylist entry, so the Gazette refused ITSELF and
  would have published a private repo path had it not (ACT-005:s1).

  An out-of-tree subscription has no repo-relative form to publish. That is not a corner
  case: `lawpack_path` in `.vjs/config.toml` is the live subscriber's actual configuration,
  and CC-VJS 12 created out-of-tree subscription deliberately.

  ## 2. What I did, and why I am reporting it rather than assuming it

  C17 C4's own words are "a repo-relative directory, **OR OMIT THE FIELD**", so omission is
  expressly authorised by the later ruling and I applied it. The field is now null for an
  out-of-tree resolution; `source` and `digest` are still published.

  I NARROWED the CC-VJS 15 test rather than deleting it. It still forbids an absolute path
  and still requires the source to be recorded. The comment in the test records both
  rulings, which of them narrowed it, and that the question is filed.

  Narrowing a court-ordered test is not something an implementer should do quietly, which
  is the whole reason this is on the record.

  ## 3. The question left open

  Does the DIGEST alone discharge "records the tree it read"?

  The argument that it does: a digest is the tree's IDENTITY, where a path is only its
  LOCATION. Two checkouts at different paths carrying identical bytes are the same law; one
  path carrying different bytes on two days is not. The digest is the stronger record of
  what was read, and it is already published.

  The argument that it does not: CC-VJS 15 C4 said source AND path, and a reader who wants
  to reproduce a publication needs to know where to look, not only what they should find
  when they get there. A digest tells you whether you have the right tree; it does not tell
  you where the publisher got it.

  I do not choose between these. Measured today: the artefact now carries
  `source: "vendored"`, `path: "lawpack/v2"`, and the current digest for the apex, and would
  carry a null path for the subscriber.
