id: SUBMISSION-2026-07-31-172302
court_requested: county
jurisdiction: default
question: Must the kernel refuse when it cannot resolve a lawpack, and must the lock pin the law or only the manifest?
facts: |
  FACTS (2026-07-31).

  F1. load_lawpack reads <repo>/lawpack/v2; if absent it silently returns an all-empty Lawpack. Comment: "Fallback: use empty lawpack".

  F2. invoke --lawpack is a LABEL: written to config.toml and lawpack.lock, never reaching load_lawpack. A correct path changes nothing.

  F3. Same binary/flags/minute, lookup --issue enforcement: vibe-justice-system (vendors lawpack/v2) returns ACT-001:s1-s4; vibe-design-system nothing. Eleven submissions there await a bench blind to ACT-001.

  F4. compute_digest hashes only manifest.toml (id, version, limits). Appending to statutes/01-authority.yaml left it at 14cdb3337039ffdb, vibe-justice-system's pinned digest since 2026-07-27.

  F5. vibe-design-system's lock pins e3b0c44298fc1c14, sha256 of the empty string.

  F6. The same defect one level down was fixed 2026-07-27. overlay_filed_orders, 20 lines below: "the check for existing law returns the same answer whether or not any exists", so "every issue presents as first-impression" and S-11(c) is honoured only from memory.

  F7. That function deliberately does NOT fail on a missing orders dir: "a fresh subscriber repo has no orders yet, and refusing to route would be worse than the defect being fixed."

  F8. An empty set does not fail open at the router: any_on_point returns false, so route answers CourtRequired. Lost are lookup, the citator, audit, and the authorities a route returns.

  FOR THE FALLBACK. (1) s5 has the kernel return bounded instructions; refusing returns none, and every command routes through build_kernel_context, so a missing dir is a total outage including the diagnostics. (2) F7 is the settled position on absence, and invoke builds a context BEFORE writing config, so the fallback is a bootstrap requirement and silence the only defect. (3) F8: the dangerous outcome cannot occur. (4) A lock records WHICH lawpack was subscribed to, and the manifest carries the limits binding every answer; hashing the tree moves the digest on any editorial change, training operators to re-lock unread.

  AGAINST. (1) s5's verb is "loads the lawpack and resolves authority deterministically": one question, four sections in one repo and none in another, neither marked. Determinate in form, arbitrary in substance. (2) F6 states this harm, is accepted here, and was acted on for the smaller half of the citator. (3) F7 does not transfer: a repo acquires orders by operating and never a lawpack, so missing orders is a stage and a missing lawpack a failure; F2 shows invoke is already told where it is. (4) F2 is a defect regardless: a flag with no effect records a subscription that never happened, so F5 is not incomplete but false. (5) Aggravated: status there prints "VJS installed: true" and names a lawpack - a silent failure that prints a reassurance. (6) A pin that cannot move when the law changes is not low-churn, it is not a pin.

  TO SETTLE. (a) May load_lawpack return empty, or must it error? (b) If error, how does invoke bootstrap? (c) Must --lawpack select, or go? (d) Manifest or tree? (e) What is owed on a lock recording a false subscription?
