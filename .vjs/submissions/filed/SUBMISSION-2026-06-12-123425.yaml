id: SUBMISSION-2026-06-12-123425
court_requested: county
jurisdiction: default
question: Is building a deterministic predicate that enforces ACT-COMPUTER-FIRST-REALM s.5 limb (a) - a runtime-force record whose declared kernel_effect binds to no evaluable predicate is excluded from the runtime authority graph - kernel MACHINERY within subordinate competence (giving s.5 the teeth it mandates), or does mechanically defining what 'has kernel effect' means TOUCH the runtime-authority-graph constitution, reserving it to primary law or a higher court?
facts: |
  Symmetric case file; the engineer's preference is not before the court.

  FACTS:
  (1) s.5 declares a record with no kernel effect is excluded from the runtime authority graph, and a text/effect discrepancy is a validation defect routed for correction ("the kernel must not silently choose"). Verified by execution 2026-06-12: NO predicate enforces either limb. IncludedInRuntimeAuthorityGraph checks only that an id resolves, never kernel effect; force_source: organ_constitutive_act is read by nothing. s.5 is the one diagnostic standard with no teeth.
  (2) Proposed limb-(a) gate: for each runtime-force record, parse its declared kernel_effect verbs and fail (severity TBD) if none binds to an evaluable arm of the 37-arm predicate registry. Allowlist of evaluable verbs, parses structure, fails closed - the same shape as the 2026-06-12 witness-soundness sweep.
  (3) Limb (b), detecting prose/effect divergence, needs reading meaning, which s.11 forbids the kernel; it stays at the agent rung. Only limb (a) is mechanizable.

  FOR MACHINERY: the gate gives deterministic effect to an enacted statute (s.5) and alters no bench, jurisdiction, tier, or assent rule. s.5's own "must not silently choose" is a standing instruction to build it. Same concordance competence as the sweep; existing records load unchanged.

  AGAINST (reserved): defining which kernel_effect verbs "count" sets the boundary of the runtime authority graph itself, arguably constitutive of what binding law IS. A 37-verb allowlist could exclude a record the Sovereign assented to (one using a not-yet-implemented verb), engaging the entrenched assent floor (s.14/s.23: assent is non-presumable; the legislature may not narrow valid law). If so it needs primary law or the apex (s.15).

  The court is asked to settle the machinery / runtime-graph-constitution line and, if machinery, authorize the build in allowlist-and-fail-closed shape (severity set so an assented record using an unimplemented verb is routed for correction, never silently voided), preserving limb (b) at the agent rung.
