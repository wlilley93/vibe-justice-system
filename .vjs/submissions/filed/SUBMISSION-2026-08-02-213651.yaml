question: Where a signed, registered Geist frame and the enacted UNIFORMITY-CONTRACT.md:82 colour-fill policy contradict each other, which instrument governs the fill of a control, given the contradiction runs in both directions and the frames disagree among themselves?
facts: |
  # Facts: a signed frame and an enacted colour policy contradict each other in both directions

  Full symmetric case file (sha256 3ec76815084e45b93ad7e7ace783be7cf7113c1fafbc09d2ce03a9624b92ca2c) at
  `.vjs/submissions/filed/2026-08-02-opbox-signed-frame-versus-enacted-colour-policy-casefile.md`.
  It carries every quotation, every citation and the counting method. This is the summary.

  ## 1. Citator, checked first

  `vjs lookup --issue opbox_design_control_boundary_contrast` returns [2026] VJS-CC-OPBOX 2. Not on
  all fours: its own `reserved` list defers "which of the Figma file or the repository is the source
  of truth ... the authority limb of the divergence is a separate matter". That is this matter. No
  order anywhere in `.vjs/orders`, `lawpack/v2/orders` or `lawpack/v2/judgments` touches colour
  fills. `vjs route` on this issue returns CourtRequired.

  ## 2. The collision

  `internal-docs/planning/UNIFORMITY-CONTRACT.md:82` enacts: primary and danger stay ink-black,
  `--accent` reserved for active/selection emphasis and focus rings. It is implemented at
  `app/globals.css:4894-4897` and `:4905-4908` and restated at `src/components/ui/button.tsx:92-121`.

  156 signed frames are registered under [2026] VJS-SC-OPBOX 1. They contradict it, both ways.
  `/portals/[portalId]/tasks` draws a blue primary button. `/matters` draws the active chip as a
  solid black fill where the shipped chip is accent-outlined, inverting the same line. About 10
  routes draw filled black CTAs; other frames draw pink destructive fills. `facet-strip.tsx:316-325`
  already records that the frames "genuinely disagree with each other, and one component cannot
  satisfy both". `app/(auth)/forgot-password/page.tsx:181` records the frame's blue as "refused, not
  overlooked".

  ## 3. Corrections to the referral

  - Order 16 reads that a MACHINE visual_review verdict creates no authority. It does not say only
    the Principal creates authority; the registry's prose says that about it.
  - The `/portals/[portalId]/tasks` colour was recorded by its reviewer as an observation only, not
    charged as a deviation.
  - 160 registry rows are 156 frames plus 4 directions, covering 156 of 199 routes.
  - 156 rows carry `bindingMode: report_only`; one direction carries `binding`. The same file's prose
    says order 24 has these routes blocking. Both statements are in `frame-registry.json`.
  - The referral's "64 POLICY_CONFLICT deltas": NOT FOUND. That string exists nowhere in the repo and
    the review schema's verdicts are closed at conform, deviate, no_authority.
  - Both of the contract's own evidence citations are dead: `globals.css:4525-4540` is now
    touch-target CSS, and `ActionButton.tsx` was deleted 2026-08-01.

  ## 4. Blast radius, measured

  Frame prevails: 3 CSS rules change; 132 of 199 routes repaint on their own source, 199 counting the
  shell; 205 route-owned files; 411 call sites in 250 files. Only 156 routes have a frame at all.

  Contract prevails: up to 156 frames redraw. Measured conflicts: 83 colour-on-control deltas over 60
  of 92 reviewed routes, 54 naming blue or accent over 43. 64 signed frames are unreviewed. The
  `/matters` limb reverses `LOG-2026-08-01-134100` across about 14 routes and 77 files.

  ## 5. Meanwhile

  Nothing in opbox was edited. No colour changed, no frame registered, no log written to dispose of
  the fork.
