id: SUBMISSION-2026-08-01-203211
court_requested: county
jurisdiction: default
question: 'Must vjs invoke seed the two registers a jurisdiction needs to write canon and publish, and with what: an empty registry fails C3''s own empty-is-an-error limb, the creating jurisdiction''s own code asserts an ungranted accession, and a synthetic denylist sentinel ships a decorative entry into every repository the estate creates?'
facts: |
  # Facts: a fresh jurisdiction is born unable to write canon or publish

  Filed by Lexby on its own motion while implementing CC-VJS 17 C3. Not a defect in the
  ruling: a consequence it did not reach, surfaced by landing it.

  ## 1. What C3 changed

  C3 holds that a gate must treat an unreadable register as an ERROR, never an empty one.
  Implemented: `scan_canon_writes` returns `Result` and refuses when either the federation
  subscriber registry or the publication denylist is missing, unparseable, or empty. The
  publication gate refuses on the same terms. That is what the court ordered.

  ## 2. The consequence, measured

  `vjs invoke` seeds NEITHER register. A jurisdiction it creates has no
  `.vjs/publication-denylist.txt` and no `lawpack/v2/federation/subscriber-registry.yaml`.

  So after C3, every jurisdiction `vjs invoke` has ever created, and every one it creates
  from now, cannot write canon and cannot publish a Gazette until a human hand-authors two
  files that nothing tells them about.

  Measured while landing C3: seven existing fixtures broke across three files, every one
  because it built a jurisdiction the way `invoke` builds one. Seeding them was the right fix
  for a fixture claiming to be a jurisdiction. A fixture can be edited; a subscriber in the
  field cannot.

  ## 3. Why this is not simply "fix invoke"

  Two candidate seeds and they are not equivalent.

  **The federation registry** lists accessioned subscriber codes. Seeding it EMPTY fails C3's
  own empty-is-an-error limb. Seeding it with the creating jurisdiction's own code asserts an
  accession that no one granted. There may be no correct default at all, in which case the
  right answer is that `invoke` refuses to complete without one, which is a bigger change
  than seeding a file.

  **The publication denylist** holds hashed private terms. Empty fails the same limb. The only
  lawful seed is a SYNTHETIC sentinel - exactly what the apex register carries at line 14, and
  what its header records that entry was introduced for. That suggests the sentinel is right,
  but it also means every jurisdiction ships a token whose only function is to make a gate
  non-vacuous, and whether that is honest instrumentation or a decorative entry that teaches
  people to ignore the register is a real question.

  ## 4. What I have not done

  I have not changed `invoke`. Seeding a register is seeding LAW-ADJACENT STATE into a new
  jurisdiction, and getting it wrong writes a false accession or a decorative gate into every
  repository the estate ever creates. The fixtures are cured because a fixture that claims to
  be a jurisdiction should carry what a jurisdiction carries; the field is not, and is
  recorded here as a live gap rather than closed by a guess.
