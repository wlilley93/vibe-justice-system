id: SUBMISSION-2026-07-26-184925
court_requested: county
jurisdiction: default
question: Is write-time audit pseudonymisation scoped by verb prefix or by payload key, and does 108 reach session.get and org.agent.list?
facts: |
  The kernel pseudonymises audit payloads at write time (the [2026] VJS-CC-OPBOX 108 condition
  precedent), but only for verbs matching one of four prefixes:

      const HIGH_PII_VERB_PREFIXES: [&str; 4] = ["party.", "actor.", "verification.", "person."];

  Migration 0023 REVOKEs UPDATE and DELETE on `event` and the rows are hash-chained, so anything
  written there is permanent. 108 expressly refused post-write redaction for that reason.

  Nothing had ever read `event.payload`. Scanned for the first time on 2026-07-26.

  jellytot-prod `opbox`, the live client ledger, 618,259 events, 85 rows of raw subject PII, none
  pseudonymised: `session.get` 18 displayName; `org.agent.list` 66 displayName; `actor.invite` 1
  displayName + email + inviteToken.

  beelink `opbox`, demo: 110 legacy rows, and THREE written AFTER the pseudonymiser was live, all
  `session.get`, all a raw displayName, on 2026-07-26.

  `actor.` is in scope, so that one row is genuine pre-fix history (and its inviteToken carried a
  7-day TTL, minted 2026-07-01, verified expired). `session.` and `org.` are not in scope, so the
  other 84 rows and the 3 new ones are what the CURRENT scope permits. They are not a backlog: they
  are the scope working as written, permitting a raw subject name into a table nobody can edit.

  `session.get` returns the authenticated user's own displayName. `org.agent.list` returns display
  names of agents. The kernel's own PII_KEYS list already names displayName as raw subject PII; the
  verb prefix and the key are two independent predicates and a payload must match both.

  THE QUESTION. Does 108 reach `session.get`? Does it reach `org.agent.list`? They may be answered
  differently. Three dispositions are argued at equal strength in the full case file:

  A, widen the prefix list. 108's purpose is minimisation of what the ledger ingests; the enumeration
  was written before anyone had read the column. The asymmetry of harm decides it: a wrong pseudonym
  costs a join, a wrong plaintext name is permanent.

  B, do not widen. 108 declined estate-wide application because over-redaction blinds the operational
  record. `session.get` is high-frequency and returns the caller their OWN name, which is not the
  third-party subject harm the order targets.

  C, drop the verb list entirely and scope by payload KEY. The verb list is a guess about where PII
  appears; the key list is a statement of what PII is. This is the second time the guess has been
  wrong: `person.` had to be added urgently before `person.access` could land.

  The filing party states no preference and the bench has no access to one. Where the bench finds an
  advocate straw, that is a defect in the filing and it should say so.

  The full symmetric case file, whose bytes the bench read, is
  sha256:7b4aa9497c0c2308a6495fd9c3000acd565baf864b664665c5804422011a362d
  and is retained at opbox-prod/docs/CASE-2026-07-26-pseudonymiser-verb-scope.md.
