question: Is a design kernel (one chokepoint, design in, tokens and code out) a legitimate system of record or a second authority CC-OPBOX 1 forbids; and is the remedy A, B or C?
facts: |
  # A design kernel: one chokepoint, design in, contract and code out

  First impression; three ratios NEAR, none on all fours. No recommendation carried.
  Detail: `internal-docs/design/GOAL.md`, `scripts/design-token-gate.py`.

  ## Facts

  Code Connect, the first-party parity mechanism, is unavailable: the account is Professional,
  not Organization. Every bridge below substitutes for it.

  Three layers. **Tokens**: gated now (fails under 3:1, and on drift against a snapshot).
  **Components**: transfer only via 173 hand-written per-route specs. **Verification**: absent.

  Divergence has already happened unnoticed. `border` sat at 1.20:1 in Figma and 1.48:1 in
  production for months. An audit then asserted 26 dark variables were unresolved; all 52 are,
  and dark `borderStrong` was failing at 2.06:1 while an order recorded that question reserved
  on the false premise.

  The drawing corpus is a THIRD artifact: JS that draws Figma, with failure modes producing
  nothing for production. Its 3,820 border sites bear no relation to the 130 files consuming
  `var(--border)` in code; the same accessibility fix was made twice.

  ## Near authority

  **CC-OPBOX 1**: a domain's locus follows its system-of-record kernel, and a domain folded onto
  one kernel must be "neither executed by nor mirrored into another". If tokens are a domain,
  which artifact is their SoR, and is a design kernel a legitimate SoR or a forbidden second
  authority?

  **CC-OPBOX 2**: an internal design instrument is not the artefact a user is served, but
  inherits obligations derivatively where its values determine shipped behaviour.

  **PC 13 / PC 14**: the front-door principle. Nothing comes into being except through the
  chokepoint; any other entry is structurally a breach. Same shape, other substrate.

  ## Options

  **A build the kernel.** *For:* makes drift structurally impossible rather than a discipline,
  which is why the front door exists; one artifact serves parity and deciding; substitutes for
  Code Connect. *Against:* a fourth artifact atop three that already disagree; CC-OPBOX 1 warns
  against a second authority; and generating a component from a frame has never worked well.

  **B harden the seam, no kernel.** *For:* the gate already works; the 173 specs carry file:line
  pointers and are the real transfer artifact; nothing new can drift because nothing new exists.
  *Against:* parity stays human-mediated and lossy, and specs go stale exactly as
  `component-map.json` did, found at 18 entries when it held 56.

  **C buy the plan.** *For:* the supported answer, maintained by Figma; every hand-built
  substitute is worse. *Against:* a spend reserved to the Principal, does not solve tokens
  (already solved), binds parity to a vendor.

  ## Questions

  Q1 Legitimate SoR, or a second authority CC-OPBOX 1 forbids? Q2 Does the PC-13/14 front door
  extend to a non-governed substrate, or is it confined to governed records? Q3 A, B or C, on
  what conditions? Q4 Is the code-generation limb severable from the contract limb?
  Q5 Appealable or reserved?

  Nothing is built by this reference.
