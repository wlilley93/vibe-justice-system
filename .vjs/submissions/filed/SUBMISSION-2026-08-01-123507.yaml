question: When the D1 canon-write gate runs in a jurisdiction whose lawpack/v2 is a subscribed read-only mirror of foreign canon, what is the correct source of canon_repo_code?
facts: |
  # Canon-write gate repo-code resolution in subscriber jurisdictions

  ## Agreed facts

  1. The D1 canon-write gate (PC-13 D1; ACT-005:s5, ACT-007:s4) blocks a lawpack/v2
     record whose repo_code differs from canon_repo_code, plus companion files
     carrying a blocked record's code.
  2. Both call sites (vjs-engine staged.rs, vjs-cli front.rs) derive
     canon_repo_code from the LOCAL jurisdiction config (repo_code, else
     jurisdiction_id, else "VJS").
  3. In the canonical repo this is correct. In a subscriber (OPBOX), a lawful
     read-only mirror pull via the established vendor route stages canon records
     carrying repo_code VJS, and each reads as "subscriber law filed into canon":
     13 Errors today, blocking the vendor commit that cures a Fatal
     LAWPACK_LOCK_DRIFT (ACT-007:s7).
  4. The identical tree validates OK at rest; only the staged path misfires. Every
     blocked record is enacted canon, none is subscriber-scoped.
  5. The lawpack manifest declares id/version/status/canonical/limits but not the
     canon's repo_code. CC-VJS 12 pins the law as a whole tree; the manifest is
     inside the hash.

  ## Question

  What is the correct source of canon_repo_code where lawpack/v2 is a subscribed
  mirror of foreign canon?

  ## Option A: the lawpack declares its own repo_code; the gate reads it

  Add repo_code = "VJS" to the manifest; both call sites read it from the resolved
  lawpack, falling back to the config chain when absent.
  For: the law's identity is a property of the LAW, not the mirroring repo; every
  jurisdiction asks the same question. Widens protection: today a subscriber
  filing its OWN code into its mirror is not caught; under A it is. Explicit
  declaration follows CC-VJS 12's preference for pinned declared law.
  Against: manifest edit moves the lawpack digest, so canon re-pins and every
  subscriber re-locks; a wrong future declaration silently changes gate semantics.

  ## Option B: keep config resolution; exempt subscriber mirror pulls

  Skip records whose repo_code matches the subscribed canon's code, inferred from
  subscription identity or a new per-subscriber config field.
  For: no digest movement, canon untouched.
  Against: subscription records a lawpack ID, not a repo_code, so B needs its own
  inference or N per-subscriber declarations; a vendor-path keyed exemption gates
  HOW not WHAT, the known defect class; and the gate stays blind to foreign-coded
  law filed locally.

  ## Option C: run the D1 gate only in the canonical repo

  For: the boundary is enforced where canon is written; a mirror is derived state.
  Against: the mirror is what the subscriber's kernel LOADS as law; local
  tampering (a fake VJS-coded order) would pass staged validation, leaving lock
  drift as the sole defense where today there are two.

  ## Relief

  Select the resolution source (A/B/C or variation); if A, whether the canon lock
  re-pin belongs in the same change.
