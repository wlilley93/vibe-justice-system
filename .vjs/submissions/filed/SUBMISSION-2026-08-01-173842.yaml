question: Must the file that dispatches the gates be entrenched alongside them, and what principle bounds the entrenched surface?
facts: |
  # Must the dispatcher of the gates be entrenched alongside the gates?

  ## Agreed facts

  1. `ENFORCEMENT_SURFACE` (vjs-core/src/enforcement.rs) pins eleven files by
     digest. A change to any of them is Fatal `ENFORCEMENT_SURFACE_DRIFT` until
     re-pinned, which PC-16 D4 calls the visible acknowledgment that a gate moved.
  2. The list includes the gates themselves: `staged.rs`, `assent.rs`,
     `vjs-redact/src/lib.rs` and its tests, `validator.rs`, `refs.rs`,
     `permit_gate.rs`, `front_door.rs`, `bench.rs`, `hook.rs`, `enforcement.rs`.
  3. It does NOT include `vjs-engine/src/lib.rs`, which holds `validate()`, the
     function deciding WHETHER each gate runs and dispatching to several pinned
     files; and, since CC-VJS 15, also `resolve_lawpack` (the sole resolver) and
     `unresolvable_lawpack_error` (the sole refusal every door now emits).
  4. CC-VJS 14, decided today, was a defect in exactly that file. One guard
     switched three checks off, one of them a Fatal that then could not fire in an
     out-of-tree jurisdiction. Because the file is unpinned, the change that
     introduced it moved no pinned digest and nothing announced it.
  5. The cure moved no lock either. And CC-VJS 15, landed today, re-pinned FIVE
     entries while substantially rewriting this same file: the one file whose
     change nothing announced is the one that arms everything else.
  6. So a gate can today be disarmed one level up, in a file no drift check
     watches, while every pinned digest stays green.

  ## Question

  Must the file that dispatches the gates be entrenched alongside them, and if so
  what is the boundary of the entrenched surface?

  ## Option A: add `vjs-engine/src/lib.rs` to the surface

  For: entrenchment protects gates from silent weakening, and a guard is part of a
  gate (CC-VJS 14). Pinning the gates while leaving their dispatcher open protects
  the lock and not the door. One line plus a re-pin.
  Against: the file also holds resolution and digesting, so ordinary work there
  demands a re-pin ceremony, and a ceremony paid often is paid without reading. It
  is large, so the digest says "something changed" with poor precision.

  ## Option B: split `validate()` into its own pinned module

  For: entrenches the dispatching logic and nothing else, so the re-pin carries
  information. Precedent: `status.rs` was split from `lifecycle.rs` on a ceiling,
  behaviour preserved verbatim.
  Against: costs more than the defect it prevents, and the boundary between
  dispatch and resolution is not obvious; a wrong cut entrenches the wrong half.

  ## Option C: leave it; the surface pins gates, not callers

  For: every caller would otherwise become a candidate and the list grows until
  re-pinning is noise.
  Against: it concedes a demonstrated hole. A Fatal was unreachable for an unknown
  period and no drift finding fired. "Caller" understates what `validate()` is: it
  is the only entry point through which the gates run at all.

  ## Relief

  Whether the dispatcher is entrenched and by which option; and, if the surface
  grows, what principle bounds it so the list does not become noise.
