id: ACT-PROCEEDINGS-DISCIPLINE
citation: "[2026] VJS-ACT 11"
assent_source: FIRST_DRAFT_PENDING_STANDING_COMMITTEE_ADOPTION
title: The Proceedings Discipline and Citation Integrity Act 2026
status: draft
enacted_by: >
  NOT ENACTED, and the route matters. Drafted by Lexby as CLERK-DRAFTER, which is the lawful role on
  the Framework Act precedent ("Drafted by Lexby as Clerk-Drafter on the principles digest, the
  drafting brief, and the rulings"). But this is AGENT-ORIGINATED TEXT, and
  ACT-COMPUTER-FIRST-REALM records that force comes from "the Committee's drafting and the Sovereign's
  Sovereign Assent ... never from the self-assertion of V2 or any agent", the agent-originated text
  there being "a void first draft cured by Assent". The lawful sequence is therefore: Clerk-Drafter
  first draft -> the four counsel's aye-conditions -> those conditions incorporated as a SECOND-DRAFT
  CURE -> Standing Committee adoption, which is CONSTITUTIVE ([2026] REALM-SC 8) -> Sovereign Assent
  pinned to the adopted text's digest. My first label on this file said
  DRAFT_PENDING_SOVEREIGN_ASSENT, which skipped the Committee entirely - the same shortcut as the void
  first draft, and corrected here on the Principal's suggestion that the committee look it over.
created_at: "2026-08-05"
purpose: >
  To reduce the cost of governance by removing its two measured causes: matters filed on facts nobody
  measured, which make the court sit twice on one question, and citations asserted rather than
  allocated, which is how eleven subscriber files put a fake decision series into canon. It also
  enacts the existence limb the kernel has been enforcing without statutory footing, and gives the
  cheap disposal routes the consolidation framework already contemplates.

drafting_note: >
  MEASURED, NOT ASSERTED. On 2026-08-04/05 the opbox jurisdiction recorded seven rulings in one day
  ([2026] VJS-CC-OPBOX 158 to 164). FOUR of the seven exist only to correct the previous one, and
  THREE of those four were needed because the engineer stated the behaviour of machinery he had not
  run and a bench relied on it: 159 corrected 158 (which limb of a fail-closed chain refused), 161
  read down 160 (an absolute prohibition written without checking the remedy reached all six failure
  causes), and 164 corrected 163 (the scope of the citation check, defined expressly four lines above
  the finding in the code it turned on). 163 and 164 carry the IDENTICAL issue tag: two sittings, one
  matter, and nothing detected it. Across the whole opbox corpus, 68 of 116 orders and 58,034 of
  93,759 words are about the governance machinery rather than about the product - 58% and 61%.

  Not all of that is waste and the draft does not treat it as such: CC-OPBOX 160 found 55 of 109
  order files unreadable and absent from the citator while `vjs route` answered confidently from the
  remainder, which is a defect worth many sittings. The waste is the CORRECTION RATE, not the
  subject matter, and s1 and s2 are aimed at the correction rate alone.

sections:
  - id: ACT-PROCEEDINGS-DISCIPLINE:s1
    title: Pleading standard - a claim about machinery must cite where it was read
    text: >
      Where a case file, submission or order asserts the behaviour of code, a gate, a check, a
      binary or any other runtime artefact, it must cite the address at which that behaviour was
      observed - file and line, or the command and its output - and state whether the artefact was
      EXECUTED or merely READ. A claim about machinery carrying no such address is not a finding of
      fact and no bench may rest a ratio on it. The kernel refuses to accept a filing that asserts
      machinery behaviour without an address, and says which assertion lacks one.

      An inference from the NAME of a field, a flag, a function or a directory is expressly not an
      observation. That is the precise error in three of the four corrective rulings this Act is
      drafted from: "operative surface" was taken to mean directives because the words suggest it,
      while [2026] VJS-PC 17 D1-D5 defines it as holding plus each directive's must plus each
      forbidden clause.
    kernel_effect:
      defines:
        - filing.machinery_claim
        - filing.machinery_claim.address
        - filing.machinery_claim.mode
      must:
        - refuse_filing_asserting_machinery_without_an_address
        - name_each_unaddressed_assertion
      must_not:
        - resting_a_ratio_on_an_unaddressed_machinery_claim

  - id: ACT-PROCEEDINGS-DISCIPLINE:s2
    title: One matter, one issue tag
    text: >
      No second binding order may be recorded against an issue tag already held by a live binding
      order unless the second EXPRESSLY names the first and declares itself one of: superseding,
      varying, or supplemental to it. The kernel refuses the write otherwise. A supplemental order
      must state, in its holding, what in the earlier order it leaves standing.

      This is mechanically checkable and was not checked: 163 and 164 both carry
      `dec15_dec19_recitation_and_order_completion`, and only the engineer's prose says which
      governs which limb.
    kernel_effect:
      defines:
        - order.issue_tag.exclusivity
        - order.relation.supersedes
        - order.relation.varies
        - order.relation.supplemental
      must:
        - refuse_a_second_live_order_on_one_issue_tag_without_a_declared_relation
        - require_a_supplemental_order_to_state_what_survives

  - id: ACT-PROCEEDINGS-DISCIPLINE:s3
    title: The existence limb, enacted
    text: >
      An order does not bind to the extent that it relies on an authority which does not exist. The
      record is ROUTED FOR CORRECTION and is never voided by the clerk; voidness on the ground of per
      incuriam is for a court on appeal (REG-KERNEL-001, clerk-not-court). An order that ADJUDICATES
      a citation does not rely on it, and is not caught by this section.

      WHY THIS SECTION IS NEEDED AT ALL. The kernel already enforces this limb: the fatal finding
      ORDER_CITATION_UNRESOLVED is raised at
      `governance/crates/vjs-engine/src/staged.rs:364-377`, and its message cites "per-incuriam
      existence limb; ACT-002:s7, REG-KERNEL-001". ACT-002:s7 is "Orders bind; opinions explain"
      and contains no existence limb, and the phrase "per incuriam" appears in NO STATUTE in the
      lawpack - it is judge-made, in [2026] VJS-SC 4, VJS-SC 6 and VJS-PC 17. So the teeth that
      blocked three binding orders for an afternoon cite a section for a proposition it does not
      hold. That is the defect the check itself exists to catch, one level up. This section gives it
      something true to cite.
    kernel_effect:
      defines:
        - order.reliance.existence_limb
        - order.reliance.adjudication_exemption
      must:
        - route_an_unresolved_operative_citation_for_correction
        - cite_this_section_and_not_act_002_s7
      must_not:
        - the_clerk_declaring_an_order_void_for_a_dangling_citation

  - id: ACT-PROCEEDINGS-DISCIPLINE:s4
    title: Citations are allocated, never asserted
    text: >
      A citation is valid only if allocated by the persisted citation registry required by [2026]
      VJS-PC 13 directive 2. A self-asserted citation is a fatal mismatch unless equal to the
      allocated value. Allocation runs BEFORE assent, so it can never block an assented record.

      Until that registry exists and is persisted, allocation is by MEASURED maximum-in-force across
      every store that can hold a citation in the jurisdiction, and the instrument must record on its
      face which stores were measured. An allocator that cannot be shown to have consulted every such
      store has not allocated anything.

      THE PRESENT STATE, measured 2026-08-04: no citation registry artefact exists in either the
      canonical repo or the opbox mirror, and `vjs next-citation VJS-CC-OPBOX 2026` returns
      "[2026] VJS-VJS-CC-OPBOX 1" - a doubled prefix and the number 1 - while
      [2026] VJS-CC-OPBOX 164 is in force. Citations are therefore hand-allocated today, which is
      exactly the mechanism by which eleven subscriber-scoped files self-asserted
      [2026] VJS-DEC 15-22 into canon (PC 13). PC 13 directive 2 is UNDISCHARGED and this section
      does not pretend otherwise; it states the duty and the interim rule.
    kernel_effect:
      defines:
        - citation.allocation.registry
        - citation.allocation.interim_measured_maximum
        - citation.allocation.stores_measured
      must:
        - allocate_before_assent
        - treat_a_self_asserted_citation_as_a_fatal_mismatch
        - record_the_stores_measured_when_allocating_without_a_registry
      must_not:
        - reporting_an_allocation_from_an_allocator_that_consulted_one_store

  - id: ACT-PROCEEDINGS-DISCIPLINE:s5
    title: Registrar track - machinery is directed by regulation, not by opinion
    text: >
      A matter that directs MACHINERY - wiring an existing duty to a gate, widening a reader,
      repairing a record's form - and that creates no new duty on the product, no new verb,
      permission model or trust boundary, is disposable by a REGULATION under
      ACT-CONSOLIDATION-FRAMEWORK:s7 without a full order and opinion. The regulation must still name
      the duty it gives teeth to.

      [2026] VJS-CC-OPBOX 160, 161 and 162 were three full opinions on one question: whether a filed
      record may be made parseable, and by what proof. On this section that is one regulation.
    kernel_effect:
      defines:
        - matter.class.machinery
        - disposal.registrar_track
      must:
        - name_the_duty_a_machinery_regulation_gives_teeth_to
      must_not:
        - the_registrar_track_for_a_matter_touching_a_trust_boundary

  - id: ACT-PROCEEDINGS-DISCIPLINE:s6
    title: Consolidation duty on a series
    text: >
      Where an order has been supplemented, varied or corrected TWICE, the next act in that series
      must be a single CONSOLIDATED instrument that restates the rule in force and supersedes the
      series. The superseded instruments are retained as record and cease to be separately routable.

      The cost this addresses is not the sittings, it is the READING: the rule on repairing an
      unreadable order currently requires chasing 160 to 161 to 162 to 163 to 164, and only the fifth
      states the position.
    kernel_effect:
      defines:
        - order.series.consolidation_threshold
        - order.series.consolidated_instrument
      must:
        - require_a_consolidated_instrument_after_the_second_supplement
        - retain_the_superseded_series_as_record

  - id: ACT-PROCEEDINGS-DISCIPLINE:s7
    title: The deliberation budget, made enforceable
    text: >
      A matter that is low-risk, reversible, and touches no trust boundary resolves by DECISION AND
      LOG. The route must not return CourtRequired for it, and a bench must decline to sit on it and
      say why. Reversibility is judged by blast radius and by whether the act can be undone by a
      later act of the same cost, not by whether the code can be edited back.

      Nothing in this section reaches a trust-boundary fork: [2026] VJS-CC-OPBOX 16, affirmed by 17
      and 18, holds that any verb rated SENSITIVE or above, any EXTERNAL auth tier, and any token,
      capability or permission-model change goes to court BEFORE implementation regardless of code
      reversibility, and that rule is untouched.
    kernel_effect:
      defines:
        - matter.class.decide_and_log
      must:
        - resolve_a_low_risk_reversible_non_boundary_matter_by_decision_and_log
      must_not:
        - returning_court_required_for_a_decide_and_log_matter
        - reading_this_section_as_reaching_a_trust_boundary_fork

  - id: ACT-PROCEEDINGS-DISCIPLINE:s8
    title: Opening and amendment of a filed order
    text: >
      A filed order may be OPENED and AMENDED, by order of the court that made it or of a superior
      court, on application or on the court's own motion. There are two tracks and they must not be
      conflated.

      THE SLIP TRACK, for a FORMAL defect that carries no meaning: quoting, indentation, a
      transcription error, a mis-numbered section, a dangling or misallocated citation label. The
      court that made the order may amend on its own motion. The amendment must be proved
      CONTENT-PRESERVING by a stated mechanical test, and the test must be recorded with its result.

      THE SUBSTANTIVE TRACK, for the holding, a directive, a reservation or a prohibition: the making
      court may amend only to correct an error of its own recorded on its face (as [2026]
      VJS-CC-OPBOX 159 and 164 did); anything else requires a superior court on appeal. Where the
      order carries the Principal's assent, its substance may not be amended without fresh assent
      (ACT-ASSENTED-RECORD-PROTECTION).

      IN BOTH TRACKS the amendment is recorded ON THE FACE OF THE ORDER, in an `amendments:` block
      stating what changed, the exact prior text, the authority for the change, and the date. It is
      never recorded only in a side file. The engineer may execute an amendment but may never author
      one.

      WHY THIS SECTION EXISTS, stated against the engineer's own conduct. On 2026-08-04 three binding
      orders (068, 080, 081) needed their citations amended and there was NO amendment power, so one
      was improvised: the text was deleted and the record of what had stood there was written into
      `.vjs/unreadable-orders.txt`, a file whose name gives no indication that it holds the amendment
      history of three binding orders. That is an amendment made without an amendment power and filed
      where nobody would look. Had this section existed, the court would have OPENED the three orders
      and amended them on the slip track, on their own faces, and neither
      [2026] VJS-CC-OPBOX 163 nor 164 would have been needed.
    kernel_effect:
      defines:
        - order.amendment.slip_track
        - order.amendment.substantive_track
        - order.amendment.record
      must:
        - record_an_amendment_on_the_face_of_the_order
        - state_the_prior_text_and_the_authority_for_the_change
        - prove_a_slip_track_amendment_content_preserving_by_a_stated_test
      must_not:
        - the_engineer_authoring_an_amendment
        - amending_the_substance_of_an_assented_order_without_fresh_assent
        - recording_an_amendment_only_in_a_side_file

  - id: ACT-PROCEEDINGS-DISCIPLINE:s9
    title: A citation may be amended, but only with a forwarding record
    text: >
      A citation is an IDENTIFIER and not a term of the order, so amending one is slip-track work.
      But a citation is also how the corpus is indexed, so a bare rename silently breaks every inbound
      reference and every document that cited the old value becomes wrong without changing a byte.

      A citation may therefore be amended only if a FORWARDING RECORD is created in the same act: the
      old citation must continue to resolve, to the new one, and be marked amended. The kernel must
      resolve a forwarded citation and say that it was forwarded. Amending a citation without a
      forwarding record is refused.

      A REDIRECT IS NOT A CORRECTION OF THE CITING DOCUMENTS. Where the number of citing documents is
      small enough to enumerate, the amending order must enumerate them and say whether each was
      updated, so the residue is visible rather than absorbed by the redirect.
    kernel_effect:
      defines:
        - citation.amendment
        - citation.forwarding_record
      must:
        - create_a_forwarding_record_in_the_same_act
        - resolve_a_forwarded_citation_and_report_that_it_was_forwarded
        - enumerate_the_citing_documents_and_state_whether_each_was_updated
      must_not:
        - amending_a_citation_without_a_forwarding_record

  - id: ACT-PROCEEDINGS-DISCIPLINE:s10
    title: A NOT FOUND must state the search that produced it
    text: >
      A report that an authority, record or store was NOT FOUND must enumerate the stores searched and
      the query form used. A bench may not treat an unenumerated NOT FOUND as a fact about the corpus,
      and must record the enumeration it relied on.

      A bounded search is a claim about where somebody looked; it is never a fact about what exists.
      On 2026-07-31 a bench recorded [2026] VJS-CC-OPBOX 2 as "NOT FOUND as a primary record ... in
      any store searched" and expressly declined to rely on it, while the order sat in
      `.vjs/orders/` marked binding, created six days earlier. The bench was following a documented
      route to the citator that had never existed. A judgment was decided around real law because the
      route to it was fiction.
    kernel_effect:
      defines:
        - report.not_found.stores_searched
        - report.not_found.query_form
      must:
        - enumerate_the_stores_searched_and_the_query_form
        - record_the_enumeration_a_ratio_rests_on
      must_not:
        - treating_an_unenumerated_not_found_as_a_fact_about_the_corpus

  - id: ACT-PROCEEDINGS-DISCIPLINE:s11
    title: An unreadable instrument is not in force
    text: >
      An instrument the kernel cannot load is NOT IN FORCE. It binds nothing, and every command that
      returns a binding instruction must report the count of unloadable instruments alongside its
      answer, not in warnings above it. The count must appear in the jurisdiction's own self-test, so
      that a corpus going half-blind is a failing check and not a silence.

      The cure for an unreadable instrument is to WIDEN THE READER, never to edit the record. Where no
      reader can reach it, the slip track in section 8 applies.

      This is the single most expensive defect measured to date: on 2026-08-04, 55 of 109 filed orders
      in the opbox jurisdiction did not parse and were absent from the citator, and nothing said so.
      An unreadable order is silent law - it binds nothing while reading, in a diff, exactly like law
      that binds.
    kernel_effect:
      defines:
        - instrument.unreadable.not_in_force
        - jurisdiction.self_test.unreadable_count
      must:
        - report_the_unloadable_count_where_the_answer_goes
        - carry_the_unloadable_count_in_the_jurisdiction_self_test
        - widen_the_reader_rather_than_edit_the_record
      must_not:
        - treating_an_unloadable_instrument_as_in_force

  - id: ACT-PROCEEDINGS-DISCIPLINE:s12
    title: A directive with no named actor binds nobody, and must say so
    text: >
      Every directive must name the actor it binds. A directive whose actor was never recorded binds
      NOBODY, and the reader must report it as unstated rather than supplying a bearer: choosing who
      is bound is a substantive act reserved to the court.

      About forty filed orders in the opbox jurisdiction omit `actor` on their directives. Defaulting
      them to `engineer` would have been the reader deciding who is bound; [2026] VJS-CC-OPBOX 160 O3
      made the default the literal string UNSTATED for that reason. This section puts the rule above
      the reader, and adds the duty the local order could not: an order may not be recorded with an
      unstated actor going forward.
    kernel_effect:
      defines:
        - directive.actor.unstated
      must:
        - report_an_unstated_actor_as_unstated
        - require_a_named_actor_on_a_newly_recorded_directive
      must_not:
        - the_reader_supplying_an_actor_for_a_directive_that_names_none

  - id: ACT-PROCEEDINGS-DISCIPLINE:s13
    title: A reserved question carries a review date
    text: >
      Where an order RESERVES a question to a fresh record, it must state a review date. On expiry the
      reservation is reported as OWED by the jurisdiction's self-test. It does not lapse and it does
      not become permission; it becomes visible.

      Reservations presently accumulate with no expiry, so the set of things expressly not decided
      grows monotonically and is never revisited. A locked decision can die by accretion, and so can
      an open one.
    kernel_effect:
      defines:
        - order.reservation.review_date
      must:
        - require_a_review_date_on_a_reservation
        - report_an_expired_reservation_as_owed
      must_not:
        - reading_an_expired_reservation_as_permission

  - id: ACT-PROCEEDINGS-DISCIPLINE:s14
    title: A duty whose gate has no negative control is UNENFORCED
    text: >
      An instrument that gives teeth to a duty must ship a NEGATIVE CONTROL: a seeded violation
      demonstrating that the gate fails, recorded with its result. A duty whose gate carries no
      negative control is reported as UNENFORCED, never as enforced, and the conformance audit must
      count it that way.

      A check that cannot fail is not a check, and the failure mode is always the same: it reports a
      pass, everyone believes it, and the belief outlives the thing it was about. Every material
      defect found in the opbox governance machinery this week was found either by seeding a violation
      or by running the instrument, and never by reading it.
    kernel_effect:
      defines:
        - duty.gate.negative_control
        - duty.status.unenforced
      must:
        - ship_a_negative_control_with_a_gate
        - count_a_duty_with_no_negative_control_as_unenforced
      must_not:
        - reporting_a_duty_as_enforced_on_a_gate_with_no_negative_control

  - id: ACT-PROCEEDINGS-DISCIPLINE:s15
    title: Extent, and what this Act does not touch
    text: >
      This Act binds the canonical jurisdiction and every subscribing jurisdiction on accession. It
      does not disturb: the trust-boundary rule (CC-OPBOX 16/17/18); the assented-record floor
      (ACT-ASSENTED-RECORD-PROTECTION); the real-world-law floor
      (ACT-CONSOLIDATION-FRAMEWORK:s21); the singularity of the Supreme Court (VJS-SC 4); or any
      order in force. Sections 1 and 2 are the operative sections for the failure rate this Act was
      drafted from; sections 5, 6 and 7 reduce the cost of matters that must proceed anyway.

      A subscribing jurisdiction may not amend this Act in its mirror. The opbox mirror was verified
      byte-identical to canon for all ten statutes on 2026-08-05, and that is the property this
      section preserves.
    kernel_effect:
      defines:
        - act.extent.canon_and_subscribers
      must:
        - preserve_the_mirror_as_byte_identical_to_canon
      must_not:
        - local_amendment_of_this_act_in_a_subscriber_mirror
