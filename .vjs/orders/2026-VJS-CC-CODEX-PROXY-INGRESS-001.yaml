id: 2026-VJS-CC-CODEX-PROXY-INGRESS-001
court: county
jurisdiction: vibe-justice-system
repo_code: null
status: binding
issue: codex_proxy_ingress_auth
holding: |
  Option C prevails. SO_PEERCRED peer attestation is required, but at bearer ISSUANCE rather than at each model call. The auth-helper (spawned by Codex's auth.command) connects to a Boltrig Unix-domain socket; the kernel attests that peer via AcceptedUnixPeer/SO_PEERCRED into a ModelProxyCellScope and issues a short-TTL, single-cell-and-model-bound bearer through find_active_for_trusted_observation at issuance. The loopback TCP model-call proxy then authenticates each /v1/responses request by that bearer alone (find_active_by_id), binds 127.0.0.1 only, injects the kernel-only upstream key server-side (never in the cell env), and forwards to the gateway. Option A (unix-socket ingress for model calls) is rejected as infeasible on the pinned config: the Codex App Server client is configured for a TCP base_url, and a unix-socket base_url cannot be assumed without patching upstream Codex; the court does not compel an upstream fork for the read-only cutover but grants liberty (D6) to adopt it if Codex ever supports it, as a strictly-stronger move. Option B (/proc/net/tcp peer resolution) is rejected: it is TOCTOU-racy and is exactly the caller-derived provenance the model-proxy contract forbids ("Caller JSON is never acceptable provenance"); substituting it for SO_PEERCRED would degrade the enacted security model. The residual risk under C - replay of a live bearer by a co-located local process within its TTL - is bounded and accepted for the read-only cutover by the four cumulative conditions made mandatory below, and does not reach the write/effects phase (PR8), which remains separately gated.
