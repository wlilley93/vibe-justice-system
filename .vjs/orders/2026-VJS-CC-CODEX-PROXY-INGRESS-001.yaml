- issuing_a_bearer_without_a_prior_so_peercred_unix_socket_attestation_of_the_helper_peer
- a_bearer_not_bound_to_a_single_cell_model_budget_or_without_a_bounded_server_side_ttl
- placing_the_upstream_model_key_in_the_cell_environment
- binding_the_model_call_proxy_to_any_interface_other_than_127_0_0_1
- extending_this_read_only_auth_to_the_write_effects_phase_without_the_pr8_gate
