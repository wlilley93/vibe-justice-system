runtime_summary: |
  Codex per-cell proxy: SO_PEERCRED attests the auth-helper over a unix socket and gates bearer ISSUANCE; the loopback TCP proxy authenticates model calls by a short-TTL, single-cell bearer (find_active_by_id), binds 127.0.0.1, and injects the kernel-only key. Option A infeasible on the pinned TCP config (liberty to adopt if Codex supports it); Option B rejected as racy caller-provenance the contract forbids. Read-only only; PR8 gated.
