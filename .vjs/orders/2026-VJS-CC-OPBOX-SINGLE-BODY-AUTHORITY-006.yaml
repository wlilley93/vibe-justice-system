runtime_summary: |
  Single-body is not an Order 25 exception. One body proves structure, not Principal
  adoption. `frame_own_children` is an extraction locus and `unlabelled` remains
  no-authority. Keep the fail-closed refusal. Cure through the normal design writer,
  recapture, digest and fresh signature, or use an already-authorised verified hash-bound
  Principal label-resolution act. Do not widen markers or infer authority from quarantine.
