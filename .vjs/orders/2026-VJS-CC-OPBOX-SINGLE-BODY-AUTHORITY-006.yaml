id: 2026-VJS-CC-OPBOX-SINGLE-BODY-AUTHORITY-006
court: county
jurisdiction: opbox
repo_code: null
status: binding
issue: opbox_order_25_single_body_authority
holding: |
  The proposed single-body exception to Order 25 is refused. Evidence that a frame has
  exactly one candidate body establishes structure, not the Principal's adoption of that
  body as present authority. `frame_own_children` and `unlabelled` describe extraction or
  declaration state; neither is an authority class. Registration continues to require a
  recognised current-source declaration on the selected locus or an express, verified,
  hash-bound Principal act resolving that label first. Existing valid direction-backed
  registrations are unaffected.

  The RATIO: Order 25 makes an affirmative declaration of present authority a condition
  precedent to frame registration. Because a machine verdict creates no authority, body
  count, extraction locus, region naming and quarantine output cannot substitute for a
  recognised current-source declaration or an express hash-bound Principal
  label-resolution act.
