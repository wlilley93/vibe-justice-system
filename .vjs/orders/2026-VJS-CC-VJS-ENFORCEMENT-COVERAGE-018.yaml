id: 2026-VJS-CC-VJS-ENFORCEMENT-COVERAGE-018
court: county
jurisdiction: vibe-justice-system
repo_code: VJS
status: binding
issue: enforcement-surface-coverage
question: >
  Must the file that dispatches the gates be entrenched alongside them, and what principle
  bounds the entrenched surface?
holding: |
  APPLICATION GRANTED. Option A adopted, varied: the file is entrenched WHOLE, without a prior
  split.

  THE RATIO. A file belongs on the entrenched enforcement surface if, and only if, an edit
  confined to that file can by itself change whether a bright-line finding is emitted, what
  severity it carries, or whether the check that produces it runs at all. CALL POSITION IS NOT
  THE TEST; DISPOSITIVE POWER IS. The surface is bounded not by category but by PROOF: no file
  joins on the theory that it is upstream of a gate, and a file joins only when a committed
  counterexample shows a confined edit to it flipping a bright-line outcome while the lock
  stays green.

  THE BOUNDING PRINCIPLE ANSWERS THE RELIEF. The fear that the surface grows until re-pinning
  is noise is met by the proof requirement rather than by a category rule: every candidate must
  arrive with a seeded counterexample, so the list cannot grow by argument. That is the same
  discipline the estate already applies to gates themselves, turned on the membership question.

  WHY WHOLE AND NOT SPLIT FIRST. A split moves enforcement code out of a pinned file and would
  require editing a second pinned file for a reason unrelated to the ruling. The file is
  entrenched as it stands; when the machine-checked line ceiling forces the split, the disarm
  sites carry their entrenchment with them in the SAME change, on the pattern already used for
  the redact crate's tests.

  THE EVIDENCE THIS RULING RESTS ON IS THAT THREE DEFECTS IN THIS UNPINNED FILE WERE CURED BY
  COURT ORDER IN ONE DAY AND NONE MOVED A PINNED DIGEST. A surface that pins the gates but not
  their dispatcher protects the lock and not the door.
directives:
  - id: D1
    actor: agent
    must: entrench_the_file_whose_confined_edit_can_flip_a_bright_line_outcome
    when: deciding_membership_of_the_enforcement_surface
  - id: D2
    actor: agent
    must: never_admit_a_file_on_the_theory_that_it_is_upstream_of_a_gate
    when: proposing_an_addition_to_the_surface
  - id: D3
    actor: agent
    must: arrive_with_a_committed_counterexample_flipping_an_outcome_while_the_lock_stays_green
    when: adding_a_file_to_the_surface
  - id: D4
    actor: agent
    must: carry_entrenchment_with_the_disarm_sites_in_the_same_change
    when: a_line_ceiling_forces_a_pinned_file_to_split
  - id: D5
    actor: agent
    must: prove_the_gate_at_the_governed_boundary_and_not_at_a_proxy
    when: asserting_that_a_drift_check_runs
forbidden:
  - offer_a_membership_spelling_check_as_proof_that_a_gate_fires
  - grow_the_surface_by_argument_rather_than_by_counterexample
exceptions:
  - a_file_with_no_dispositive_power_over_a_bright_line_does_not_join_however_close_it_sits
