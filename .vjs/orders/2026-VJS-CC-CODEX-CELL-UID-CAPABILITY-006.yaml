summary: |
  Application for CAP_SETUID/CAP_SETGID REFUSED on the record, liberty to re-apply. The merge defect
  in -c overrides only bites where an attacker holds a writable file in the config load path; the
  applicant tested neutralising a hostile config.toml, never abolishing it. The claim that config.toml
  must live in a cell-owned CODEX_HOME is Boltrig's own rule in validate_cell_layout, not the
  runtime's, and every per-cell value in the rendered document is an argv-pinnable leaf. An untested
  no-capability route therefore exists: one root-owned read-only CODEX_HOME shared by all cells, all
  per-cell values on argv, the same boundary already accepted for G2. The pinned binary tolerates an
  unwritable CODEX_HOME far enough to load config. Separately, the s.6 objection is good: setuid
  between two non-zero uids does not clear capabilities and no-new-privileges does not help, so
  Option A as pleaded is cosmetic; and the pleaded grant is incomplete, since chown-ing per-cell trees
  needs CAP_CHOWN too. Pinning and detection are ordered anyway as free defence in depth.
  production_ready stays False.
