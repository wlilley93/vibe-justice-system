issue: codex_cell_uid_capability_grant_for_config_toml_protection
holding: |
  Application REFUSED on the current record, with liberty to re-apply. A Linux capability is a last
  resort and this applicant has not reached the last resort. The court accepts the s.4 evidence that
  table-valued -c overrides MERGE rather than REPLACE, and that the root-owned managed layer at
  /etc/codex/managed_config.toml merges the same way, so an attacker who can write a config.toml
  defeats argv pinning by ADDING keys. That disposes of the applicant's first no-capability theory
  and no more. The merge defect bites only where a hostile party holds a WRITABLE FILE IN THE CONFIG
  LOAD PATH. The applicant tested whether a hostile config.toml could be NEUTRALISED; it did not
  test whether a hostile config.toml could be made IMPOSSIBLE.
  FACT FOUND (material, and it decides the case): the assertion that config.toml "must" live in a
  cell-uid-owned CODEX_HOME is Boltrig's own constraint, not the runtime's. codex_cell_policy
  validate_cell_layout REQUIRES CODEX_HOME to be a 0700 directory owned by this account inside the
  cell root; the applicant imposed that rule and can lift it. On the rendered document in
  codex_runtime_config_toml the ONLY per-cell varying values are cell_id and socket_name (inside
  auth.args), proxy_port (inside base_url), model_id, reasoning_effort and skills.config, and
  codex_cell_provisioning ships selected_skills empty on this lane. Every one of those is a LEAF,
  and s.4 findings 1 to 3 prove on the applicant's own evidence that leaves are argv-pinnable and
  that argv wins. There is therefore an untested Option E: ONE root-owned mode-0555 CODEX_HOME on
  the read-only image mount, shared by all cells, holding no config.toml or a constant one, with
  every per-cell value on argv. Under it no cell can write any file any cell loads, so there is
  nothing to add keys to, and the boundary is the SAME boundary this court already accepted for G2.
  It costs no capability. The court verified that the pinned 0.144.3 binary tolerates an unwritable
  CODEX_HOME far enough to report config.load ok, warning only that it could not create PATH
  aliases. Whether app-server survives a full session that way is an open question of FACT, cheaply
  answered by experiment, and unanswered.
  HELD FURTHER, and part of the ratio: the s.6 CAP_SETUID objection is GOOD and CONDITIONS rather
  than defeats Option A. Capabilities are cleared on setuid only across a transition out of uid 0;
  a non-root process holding CAP_SETUID that moves from one non-zero uid to another RETAINS it and
  can setuid back, or sideways into a sibling cell's uid. no-new-privileges does not answer this:
  PR_SET_NO_NEW_PRIVS constrains what execve may GRANT and does nothing about capabilities already
  held. The case file's premise that the two interact so as to make dropping one-way is WRONG.
  HELD FURTHER: the pleaded grant is not the minimum sufficient grant, it is an insufficient one.
  The cell tmpfs is mode 0700 uid 10001 and an unprivileged uid cannot give a file away, so per-cell
  uid ownership additionally requires CAP_CHOWN or a layout redesign. The applicant's "MINIMUM
  grant" submission is wrong on its own facts.
  HELD FURTHER: Option D does not discharge G3, for the TOCTOU reason pleaded, but the applicant is
  wrong to deploy the VJS-CC-VJS 5 G6 prohibition against it. That prohibition forbids ARGUMENT as a
  substitute for the adversarial test; it is not a prohibition on layered detection that is itself
  tested. Free hardening is to be taken whether or not it discharges a directive.
  The refusal is EVIDENTIAL, not doctrinal. The court does not hold that CAP_SETUID may never be
  granted on this lane.
