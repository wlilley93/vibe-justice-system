reserved:
- whether real-world law reaches internal instruments generally, as opposed to this token on these facts; a boundary question for the Privy Council under ACT-002:s3
- which of the Figma file or the repository is the source of truth for --border; the authority limb of the divergence is a separate matter
- whether the European Accessibility Act and EN 301 549 apply to Opbox as a business-to-business service
- the dark border value itself, which is unresolved and unmeasurable on this record; only the floor is decided
- the dark surface and bg elevation inversion (finding F2), which is a separate reference
- audit findings F3 to F13 and the 46 unresolved token values, none of which was referred
