runtime_summary: |
  SC 1.4.11 binds through the shipped product, not the Figma file as such: the live app
  paints the unchecked checkbox and text input boundary at 1.47:1 light and 1.21:1 dark, so
  this is a real failure, not a design preference. Adopt option B narrowed: set light
  borderStrong to rgba(0,0,0,.42) (3.04 bg / 3.02 surface), repoint only genuine control
  boundaries to it, leave border decorative. Do not use solid #949494 (2.91 on surface), and
  do not assume production --border-strong #94a3b8 is safe: it measures 2.56:1 on white.
  Re-derive the corpus counts first, since the filed figures do not reproduce, and publish a
  checked-in ledger giving a role verdict per site so a misclassification is visible rather
  than silent. Panel edges, row rules and dividers are exempt unless they are the sole
  identifier of an operable control.
