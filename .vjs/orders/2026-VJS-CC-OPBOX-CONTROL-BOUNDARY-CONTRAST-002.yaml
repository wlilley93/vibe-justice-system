id: 2026-VJS-CC-OPBOX-CONTROL-BOUNDARY-CONTRAST-002
court: county
jurisdiction: opbox
repo_code: null
status: binding
issue: opbox_design_control_boundary_contrast
holding: |
  SC 1.4.11 binds, but derivatively. Real-world law under ACT-001:s3 attaches to the
  artefact a user is actually served, not to an internal design instrument as such, and
  the argument that a Figma file is outside it is strong. What defeats it is the record.
  The shipped application already paints the unchecked checkbox
  (src/components/ui/checkbox.tsx:16) and the text input (src/components/ui/input.tsx:14)
  with var(--border): #cbd5e1 at 1.47:1 in light, #2a2a2a on #1a1a1a at 1.21:1 in dark.
  The failure is live, on real controls. Because the Geist Edition file is the declared
  migration target for that code, its border value is the upstream determinant of the same
  boundary, so the obligation reaches the token derivatively and only to the width of the
  criterion.

  Option B prevails, narrowed and conditioned: borderStrong becomes the control-boundary
  token, border stays decorative. Option A is refused: on corrected counts it would repaint
  roughly 2,300 boundaries the criterion expressly exempts, and it destroys the information
  about which line is load-bearing, leaving the system permanently unauditable against the
  criterion it was changed to satisfy. A conceals the classification work rather than
  avoiding it. Option C is refused: its premise that production differs is true but
  produces a second failure rather than an escape, and control fill has no answer for the
  checkbox stroke at a plane delta of 1.04:1.

  The consolidation steering does not bar B: craft-retrofit.js:68, :69 and :108 already
  define border and borderStrong as a two-token boundary vocabulary.

  The RATIO: real-world law attaches to the artefact a user is served, not to an internal
  design instrument as such; but where an internal instrument's token values are the sole
  determinant of whether a shipped control has a perceivable boundary, the instrument
  inherits the obligation derivatively and to the exact width of the criterion, so the
  remedy must raise what the criterion governs, being the boundary of an operable control
  and its state, and must not repaint what the criterion exempts.
