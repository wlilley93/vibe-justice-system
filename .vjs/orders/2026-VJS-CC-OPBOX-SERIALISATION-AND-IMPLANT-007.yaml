runtime_summary: |
  The IMPLANTED marker layer registers a frame, not the demotion: stripping all 44 LEGACY
  UNDERLAY markers leaves named_layer unchanged at 19; removing the implanted layers drops it
  to 8. Restoration is therefore inert on the register and destructive to the signatures, and
  is refused. The live ledger IS reproducible from the preserved capture (167/167 digests, the
  exact header digest the 19 sign-offs bind) but only via a recipe nobody had recorded, so the
  recipe must now be written and committed. CURRENT CODE is retired in opbox's own config
  only; no order reaches vibe-design-system. A sign-off on a frame with quarantined or hidden
  direct children must enumerate them on its face. Never assert a registration count without
  naming the vds build: 19 are readable under the build that wrote them and 0 under the main
  line, and both are facts about readers rather than about the record.
