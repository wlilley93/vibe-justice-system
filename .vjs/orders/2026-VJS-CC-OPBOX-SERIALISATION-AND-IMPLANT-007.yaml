issue: opbox_contaminated_authority_and_marker_vocabulary
holding: |
  GRANT_IN_PART. The freeze is granted in an enforceable form; CURRENT CODE is retired from
  this jurisdiction's own record only; the audit is granted, narrowed and part-performed.
  Restoration of the demoted layers, dip-free sequenced re-signature, the clean-hands
  condition as framed, re-derivation with the corrected puller, and the confirmation sought
  for the 122 are all REFUSED.

  THE RATIO, in five parts.

  R1. A digest that moves when the capture is re-serialised is not bound to the content it
  names. Where authority holds only while a frame's current content digest equals its signed
  digest, the recipe that produced the digested input is part of the record and not an
  implementation detail. A register whose inputs cannot be reproduced from the preserved
  evidence is authority the estate cannot re-establish, and a bare regeneration of the ledger
  is a vacatur of every signature bound to it.

  R2. Relief goes to the element that does the work, and a measured-inert cause is not
  reversed by court order. Where the counterfactual shows that undoing the impugned act leaves
  the register node-for-node unchanged, and a different, unpleaded act is what converted the
  frames from refusable to registrable, the pleaded relief fails.

  R3. A prohibition whose predicate no instrument in the estate can compute is not ordered.
  Where a pleaded condition turns on who authored a layer name, and no artefact records
  authorship, the condition is refused expressly on that ground. A computable duty may be
  substituted; an uncomputable one may not be dressed as a control.

  R4. A measurement of a record is a measurement of a reader. Where a register's readability
  depends on which build of the instrument is on the operator's PATH, "this estate holds N
  registrations" is not a fact until the instrument and its commit are named. A refusal, a
  parse failure or a NOT FOUND is a claim about the reader and never a fact about the record.

  R5. A hash-bound attestation over a ledger is not a label-resolution act on a locus. Signing
  an aggregate digest of a record which itself classifies 122 loci as carrying no declaration
  does not supply the declaration. Cure (b) under CC-OPBOX 6 requires an act that is express,
  verified, hash-bound, Principal AND label-resolving on a named locus. The conjunction is the
  whole point of it.

  NO RATIO is carried on: whether an agent-authored marker layer can constitute the
  Principal's Order 25 declaration; the status of SOURCE AUTHORITY as a configured marker; the
  sufficiency of depth-limited frame hashes.
