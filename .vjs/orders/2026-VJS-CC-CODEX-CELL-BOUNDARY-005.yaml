id: 2026-VJS-CC-CODEX-CELL-BOUNDARY-005
court: county
jurisdiction: vibe-justice-system
repo_code: null
status: binding
issue: codex_per_cell_isolation_boundary_and_uid_separation
holding: |
  Declaration granted. Kernel peer attestation proves the PROVENANCE of a connection, not the
  INTEGRITY of the program that makes it. Where every input to an attestation decision (the helper
  executable, its configuration carrying auth.command, the attested ancestor's process image) is
  writable by a party the attestation is meant to exclude, the attestation is TRANSITIVELY
  COMPROMISED and confers no isolation, however correct its own logic. SO_PEERCRED ancestry
  attestation is therefore sufficient for a multi-cell production claim ONLY IF each cell's
  attestation inputs are protected from every other cell by a kernel-enforced boundary. Distinct
  uids are one such boundary and are NOT mandatory; a shared uid is lawful only where an equivalent
  boundary is enacted, asserted at startup, and proved by an adversarial test in which a hostile
  cell holds full write access to everything its own uid can reach.
  COROLLARY: eliminating a credential at rest removes the same-uid mischief for THAT CREDENTIAL
  only. It does not remove the same-uid mischief for anything upstream of the credential that
  remains at rest.
  FACT FOUND (material, and it decides the case): under the present single uid, hostile cell A can
  rewrite cell B's model_auth_helper (mode 0700 INSIDE the mutable cell root) or B's config.toml
  auth.command. Cell B's App Server then executes attacker-supplied code as its own direct child,
  which passes ancestry attestation on the merits - correct ancestor, cgroup, pid namespace, uid
  and gid - and is handed cell B's bearer. No race, no ptrace, no defect in the attestation logic.
  Since the scope carries tenant_id, cross-cell is cross-tenant. VJS-CC-VJS 2 D5 does NOT settle
  this: its uid clause is expressly about bearer FILE delivery, is spent once VJS-CC-VJS 3 E4
  removes file delivery, and its "in place of the SO_PEERCRED socket" forbidden item contemplates
  distinct-uid cells being served BY the socket. The per-cell socket is NOT the source of cross-cell
  isolation: the attestor snapshots the whole shared registry and matches the peer's OWN ancestor
  chain, so connecting to another cell's socket is a no-op.
