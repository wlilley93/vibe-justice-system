summary: |
  Attestation proves provenance, not integrity. Under one uid a hostile cell rewrites a sibling's
  auth helper inside its mutable cell root; the sibling executes it as its own child, passes ancestry
  attestation legitimately, and hands over the sibling's (cross-tenant) bearer. Fix requires a
  kernel-enforced per-cell boundary over attestation inputs, asserted at startup and proved
  adversarially. Distinct uids are sufficient but not mandatory. production_ready stays False.
