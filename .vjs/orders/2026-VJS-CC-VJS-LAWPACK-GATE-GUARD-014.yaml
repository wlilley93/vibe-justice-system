id: 2026-VJS-CC-VJS-LAWPACK-GATE-GUARD-014
court: county
jurisdiction: vibe-justice-system
repo_code: VJS
status: binding
issue: lawpack-gate-skipped-out-of-tree
question: >
  Where a jurisdiction's lawpack resolves outside the repository tree, must the integrity
  gates run against the lawpack actually loaded, and what is the correct source of the
  directory they test?
holding: |
  APPLICATION GRANTED, Option A varied (sitting alone at first instance).

  THE RATIO. A gate's guard must be keyed to the same referent as the gate. Where a check's
  referent is the lawpack, resolve_lawpack_dir is the sole source both of the directory it
  tests and of whether it runs; where a check's referent is something else, the existence of
  a local lawpack/v2 is not a lawful condition on it at all and must be REMOVED rather than
  re-sourced.

  THIS IS CC-VJS 13 APPLIED ONE LAYER OUT. That case held a gate must test the thing actually
  governed rather than a locally convenient proxy. A guard is part of the gate. A gate aimed
  correctly and switched on by a proxy is switched on wrongly, which in this repository meant
  switched off exactly where the law is remote.

  THE THREE CHECKS DO NOT SHARE A REFERENT, which is why A is varied rather than adopted
  whole. Referential integrity answers to the lawpack tree and takes the resolver. Citation
  uniqueness answers to the LOCAL governed roots and takes no condition at all; re-sourcing it
  to the resolver would keep an irrelevant condition and invite a guard wider than the
  allocator, which CC-VJS 9 D1 bars. Lock drift answers to the pinned lock and is conditioned
  on a lock existing.

  THE DEFECT WAS NOT DORMANT, IT WAS UNREACHABLE. Measured on the day: a live subscriber
  printed Validation OK, exit 0, while pinning one digest and loading a canon that hashed to
  another. A negative control went further, showing that a DELIBERATELY FALSIFIED pin also
  reported OK at exit 0. ACT-007:s7's Fatal could not fire in that configuration.

  AND THE TEST WRITTEN TO PROTECT THE RULE WAS VACUOUS. It asserted the ABSENCE of the drift
  finding in a fixture where the guard was false, so it passed whatever the lock said, in the
  exact configuration where a falsified pin goes green.

  THE OBJECTION, AT ITS STRONGEST, FAILS. The real objection is not novelty of dependency but
  that a subscriber can go red over bytes a stranger changed elsewhere. It is spent, because
  load_lawpack already refuses on an unresolvable path before the guard is reached; it
  misdescribes a subscription, which is by definition being bound by law one does not hold,
  with the pin as the instrument that makes it safe; and the statutes condition neither must
  on a directory layout.

  THE FATALS TAKE EFFECT IMMEDIATELY, NO STAGE. A Fatal held at Warning for a release is the
  refused option wearing a calendar, and worse than silence in one way: the record would then
  say the lock was checked and passed, which a later reader can cite as assurance. A grace
  period is right where the blast radius cannot be enumerated; here it was enumerated by
  measurement, and it is one repository with a one-command cure.
directives:
  - id: D1
    actor: kernel
    must: key_a_gates_guard_to_the_same_referent_as_the_gate
    when: a_check_is_conditioned_before_it_runs
  - id: D2
    actor: kernel
    must: resolve_the_lawpack_directory_through_the_resolver_and_scan_that_same_path
    when: a_check_answers_to_the_lawpack_tree
  - id: D3
    actor: kernel
    must: run_a_local_record_check_unconditionally_on_the_governed_roots
    when: a_check_answers_to_the_repositorys_own_records
  - id: D4
    actor: kernel
    must: condition_the_lock_check_on_a_lock_existing_and_nothing_else
    when: comparing_a_pinned_digest_to_the_resolved_one
  - id: D5
    actor: kernel
    must: name_the_failing_half_rather_than_deleting_the_finding
    when: a_lock_is_unreadable_or_a_digest_uncomputable
  - id: D6
    actor: agent
    must: make_an_absence_assertion_reachable_or_pair_it_with_one_that_can_fail
    when: a_test_asserts_that_a_finding_is_absent
  - id: D7
    actor: agent
    must: enumerate_the_affected_jurisdictions_by_measurement_before_landing
    when: a_dormant_gate_is_turned_on
  - id: D8
    actor: agent
    must: land_the_judgment_then_repin_canon_then_repin_the_subscriber_last
    when: a_canon_change_restales_a_subscribers_pin
  - id: D9
    actor: agent
    must: prove_the_cure_in_the_repository_that_had_the_defect
    when: a_fix_has_been_verified_only_in_a_fixture
forbidden:
  - condition_a_statutory_must_on_a_filesystem_convention_the_statute_never_names
  - hold_a_fatal_at_warning_for_a_transition_whose_blast_radius_has_been_enumerated
  - re_point_the_citation_guard_at_the_resolved_lawpack_instead_of_the_local_roots
  - repin_a_subscriber_before_the_judgment_that_restales_it_has_landed
exceptions:
  - a_repository_that_is_not_a_jurisdiction_has_no_governed_root_and_the_scan_is_empty_by_construction
  - an_unresolvable_lawpack_remains_a_refusal_under_cc_vjs_12_d1_and_is_not_reopened
supersedes: []
source_opinion: 2026-VJS-CC-VJS-14-opinion.md
runtime_summary: >
  A gate's guard must answer to the same referent as the gate. Lawpack checks resolve through
  resolve_lawpack_dir and scan that path; local-record checks run unconditionally on the
  governed roots; the lock check is conditioned only on a lock existing, and an unreadable lock
  or uncomputable digest names its failing half rather than deleting the finding. An absence
  assertion must be reachable. Turn a dormant Fatal on immediately once its blast radius is
  measured, land the judgment before re-pinning canon, re-pin the subscriber last, and prove
  the cure in the repository that had the defect.
