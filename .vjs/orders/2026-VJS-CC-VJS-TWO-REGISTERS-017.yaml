runtime_summary: >
  Two registers serving two different harms do not merge, and a hashed private register is never
  accessioned into a cleartext public one. A gate consults every register whose harm it exists to
  prevent, over every artefact in its class, and an unreadable register is an error, never an
  empty one. Records already admitted are cured before the gate is called sound.
