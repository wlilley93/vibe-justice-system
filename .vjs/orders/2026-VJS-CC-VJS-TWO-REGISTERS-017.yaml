id: 2026-VJS-CC-VJS-TWO-REGISTERS-017
court: county
jurisdiction: vibe-justice-system
repo_code: VJS
status: binding
issue: two-registers-one-class
question: >
  Where two registers describe the same class of terms that must not enter canon, which
  governs, and may a gate read a register narrower than the harm it exists to prevent?
holding: |
  APPLICATION GRANTED IN PART. Option B adopted, varied and extended; A and C refused.

  THE RATIO. Two registers of terms that must not enter canon do not merge merely because both
  can block a canon write: each answers to the harm it was made for (federation authority under
  ACT-007:s4; confidentiality under ACT-005:s1), and a register whose entries are hashed
  BECAUSE THE TERMS ARE PRIVATE may never be accessioned into a register whose entries are
  published in cleartext. A gate must consult every register whose harm it exists to prevent,
  over every artefact in the class it governs, and must treat an unreadable register as an
  error and never as an empty one; so widening the register is no answer at all while the gate
  cannot reach the file.

  A IS REFUSED ON A GROUND STRONGER THAN PLEADED, AND THE GROUND IS IN THE DENYLIST'S OWN
  HEADER. The original seeds were the accessioned public pseudonym and its citation prefix, and
  they were REMOVED on 2026-06-23 because they fail-closed the Gazette against a subscriber's
  own public law and "protected nothing private". The two registers are deliberately disjoint
  and were made so by a recorded cure. A is not consolidation; it is the reinstatement of a
  cured defect. "Two copies of a rule is one copy and a disagreement" is a sound maxim that does
  not apply, because these are not two copies of one rule.

  THE UNPLEADED OBJECTION TO B, AND ITS ANSWER. The real objection is that a hashed limb on a
  canon-write gate is unauditable by construction and invites false confidence: nobody can
  review a hash list for completeness, and the 2026-06-23 entry proves the register has been
  wrong before and that the error was discoverable only by someone who happened to know.

  C IS REFUSED BECAUSE THE BACKSTOP HELD BY STOPPING EVERYTHING. The estate's canon is
  unpublishable today and stays so until every admitted record is cured. A backstop that stops
  the whole estate is an outage, not a control.

  THE SELF-FILED BREACH. The applicant wrote a subscriber's code into a canon judgment and did
  not check, and self-filed it. The duty of care is restorative and not punitive: the remedy is
  to make the work good, which is the cure of the three admitted records and the widening of
  the gate that let them in. No further consequence attaches.
