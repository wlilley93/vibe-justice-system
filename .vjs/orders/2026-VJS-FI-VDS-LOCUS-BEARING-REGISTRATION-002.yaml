issue: vds_locus_bearing_registration
holding: |
  GRANT_IN_PART. None of Constructions A, B, C or D prevails. CONSTRUCTION E, of the court's own
  framing: the 127 need no locus field and no new row kind, because on all 127 the locus IS the
  frame node and SignOff.node_id already names it. What the register lacks is limb (b) of
  CC-OPBOX 6's disjunctive test at the front door. A and B are refused; C and D are refused as
  unnecessary on these facts and reserved for the case they actually fit. Relief the advocate did
  not seek is granted of the court's own motion: ten live register rows are REVOKED.

  THE RATIO, in four parts.

  R1. Where a register refuses a Principal act for want of a field, the court measures the act
  before it amends the schema. A locus that is the subject's own node is already named by the
  row's subject identifier, and a register that records the subject records that locus. The
  remedy for an unregistrable act is then neither a new field nor a new row kind, but the missing
  limb of the test the register already had to apply.

  R2. Where binding law makes registration conditional on A OR B and the instrument implements A
  alone, the instrument does not merely under-enforce, it INVERTS the law. Limb A is satisfied by
  precisely the artefacts limb B exists to displace: a door that admits only labelled subjects
  admits only the labels, and where the labels were machine-implanted the door admits the implant
  and refuses every subject the Principal cleaned. The cure is to read the disjunction in.

  R3. The evidence a limb-B row carries must be PER-SUBJECT and never an aggregate over the
  population. An aggregate attesting to a record which itself CLASSIFIES its subjects is no act
  upon any one of them.

  R4. A later Principal refusal of a subject, at the very digest a live row binds, REVOKES that
  row. A pleading that refusals "create no register row on any construction" is true of the row
  they do not create and false of the row they destroy. A register that still reports those
  subjects CURRENT is asserting authority the Principal has withdrawn.

  NO RATIO is carried on: whether a Principal may adopt a locus that is not the frame's own node
  and what row shape that would require; whether the register should be wholly derived from the
  decision ledger; the general sufficiency of depth-limited frame hashes.
