runtime_summary: |
  VOCABULARY NOTE, recorded because it cost time and will cost it again. This matter was filed and
  convened at `first_instance` (both `vjs file --court` and `vjs court record --court` accept it),
  but the ORDER schema admits only county | appeal | court_of_appeal | privy | privy_council |
  supreme_court, so no order can be recorded at the tier the matter was filed at. `county` is the
  one-judge tier in the order vocabulary and is used here; the citation follows the VDS lane's own
  existing record, `[2026] VJS-FI-VDS 1`. Note also that `vjs next-citation FI-VDS 2026` returns 1,
  because that ruling lives in the SUBSCRIBING repo and the citator cannot see it - a NOT FOUND
  about the reader, not the corpus.

  The 127 sign decisions enter the register through the ORDINARY SignOff row with no schema change
  to carry a locus, because on all 127 the locus the Principal chose IS the frame's own node
  (locus_id equals node_id, depth 0), so node_id already names it. What must change is the front
  door: it implements only limb (a) of CC-OPBOX 6's disjunctive test, so it refuses 118 of the 127
  outright and admits the other 9 on the strength of the machine-implanted layer the Principal
  expressly overrode. Limb (b) is opened with a PER-FRAME binding to each decision's own digest;
  the ledger-wide aggregate is not a sufficient basis and the door must refuse it as one.

  Ten of the 19 live rows are REVOKED because the Principal has since refused those frames at the
  digest the rows bind: SGN-0001, 0005, 0006, 0007, 0014, 0015, 0016, 0017, 0018, 0019. They are
  repealed as authority and preserved as record. Nine are confirmed and re-based onto limb (b).
  Verified independently before acting: 10 contradicted, 9 confirmed, 0 undecided.

  D10 is a precondition on D4/D5/D7: two different SignOff shapes exist in this estate and the
  register on disk parses under one branch and not the other, so every count over it is a
  statement about which branch was built.
