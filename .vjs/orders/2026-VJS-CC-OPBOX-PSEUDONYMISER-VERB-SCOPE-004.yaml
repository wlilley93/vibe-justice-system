reserved:
- whether crypto-shred is required rather than pseudonymisation; that is 108's own pending appeal and is
  untouched, this order being deliberately appeal-proof on either outcome
- the idempotency fence's membership, and whether it should be derived (never cache a body the scrubber
  would change) rather than enumerated; deriving it changes claim-and-release behaviour under concurrent
  durable retries and nobody argued it
- whether mfa.enroll, file.share_link.create and integration.webhook.create should return a live
  credential through the audited path AT ALL; O3 makes the ledger safe today, it does not make those verb
  designs right, and this is the most urgent referred item
- whether the reserved `personal-` agent id prefix is a re-identification vector; agent ids are not
  scrubbed and were not ordered scrubbed
- whether event.actor_id, a live FK into a table person.erase nullifies, is itself sufficient for Art.17
- whether 108 section C(3)'s access restriction on legacy payloads is in fact implemented; not checked,
  no finding either way, and worth someone checking given that nothing read the payload column until
  2026-07-26
fact_corrections:
- 'FC-1: the orders named in the filing do not exist where it says. .vjs/orders/ runs 001-084 then
  122-133; 108 and 120 are opinions under .justice/ with no order file, which puts two binding rulings
  outside vjs validate. Cured by O6.'
- 'FC-2: the trust-boundary citation is wrong. The filing cites the V2 CC-OPBOX 16/17/18 (form.ingest,
  durable flow-waking, agent-in-flow). The correct authority is the V1 [2026] CC-OPBOX 16 (Sumberly J,
  2026-06-07). Two live series share those numbers with unrelated subject matter: a citator hazard.'
- 'FC-3: neither A nor B is quoting 108. Every phrase attributed to it is from the doc comment at
  pseudonymise.rs. B''s central submission that 108 declined estate-wide application "in terms" is false.
  This is the most important correction in the case.'
- 'FC-4: 108 names three prefixes, not four. person. was added by the implementer citing 120 Order 7,
  which orders the condition precedent sequenced first and does not order that addition.'
- 'FC-5: org.agent.list does not return people. role IS NOT NULL, only org.agent.create populates role,
  and it hard-codes kind AGENT. A''s affirmative case is wrong and B conceded the one limb where its own
  principle applied.'
- 'FC-6: the session.get frequency gloss is incoherent. One event per successful call, displayName
  emitted unconditionally, so 18 rows IS 18 calls: 0.003 per cent of the ledger.'
- 'FC-7: the fact table is a sample, not a census. Six further verbs outside scope return third-party
  natural-person PII today.'
- 'FC-8: the filing omits a second consumer of the constant it proposes to delete (the idempotency
  fence). Option C as pleaded would remove its predicate.'
- 'FC-9: the gate''s key pattern and the kernel''s had already diverged in both directions: eleven of
  twenty-nine keys plus the whole _enc rule missing, and inviteToken flagged though the kernel never
  scrubbed it.'
- 'FC-10: not disclosed anywhere in the filing, mfa.enroll writes a plaintext TOTP shared secret and an
  otpauth:// URI containing it into event.payload on every enrolment.'
rows_already_written: |
  Nothing happens to them, and the court ordered nothing because it could order nothing. Migration 0023
  REVOKEs UPDATE and DELETE on event and the chain hash covers the payload, so an in-place edit is
  detectable by audit.chain.verify; 108 considered and expressly REFUSED post-write redaction on that
  ground. The 85 jellytot-prod rows, the 110 beelink legacy rows and the 3 beelink rows written after the
  pseudonymiser went live are all permanent and unreachable by any Art.17 request. The 3 were NOT a
  defect when written: they were what the then-lawful scope permitted. After this order they would be.
  They are retained under Art.17(3)(b) and (e).

  The one place permanence bites differently is a TOTP secret, which is not spent and never will be. The
  court's operational instruction was to re-enrol every actor who enrolled while mfa.enroll returned a
  plaintext secret. MEASURED AFTERWARDS, and recorded here so the instruction is not carried out on a
  false premise: zero rows carrying `secret` or `otpauthUri` exist on beelink opbox, beelink opbox_cv, or
  jellytot-prod (which has no mfa events at all). No re-enrolment is required. The defect was real and
  had not yet fired.
