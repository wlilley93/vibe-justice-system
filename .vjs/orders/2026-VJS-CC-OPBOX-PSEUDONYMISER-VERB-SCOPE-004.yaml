runtime_summary: |
  Scrub the audit payload by KEY, on every verb. There is no verb scope any more. 108's ratio states a
  purpose and illustrates it with three prefixes; the purpose binds and the illustration does not, and
  the sentences everyone quoted as the court's reasoning were the constant's own doc comment. session.get
  and org.agent.list are both in, for different reasons: the first because actor.get already scrubs the
  identical value out of the identical column, the second because a key-based rule cannot tell an agent's
  name from a person's and the cost of scrubbing it is one join. Six more verbs nobody had looked at are
  returning a third party's PII today, csp.individual.create returning a UBO's full name among them.
  Keep the verb list for the idempotency-cache fence, which must decide before a body exists, and let the
  two diverge. Add the credential keys: mfa.enroll is publishing a plaintext TOTP seed into a table
  nothing can edit, which is an authentication bypass with no expiry, not a privacy harm. The rows
  already written are permanent and nothing can reach them; say so rather than implying a cleanup. The
  gate's cutoff means "when this order started running on THIS box", is per-deployment, and may be
  advanced only by a deploy.
