id: 2026-VJS-CC-OPBOX-PSEUDONYMISER-VERB-SCOPE-004
court: county
jurisdiction: opbox
repo_code: null
status: binding
issue: pseudonymiser_verb_scope
title: 'Write-time audit pseudonymisation is scoped by payload KEY, not by verb: the enumeration in 108
  is illustrative, its purpose is the ratio'
question: 'The kernel pseudonymises an audit payload only when the verb name starts with one of four
  prefixes (party., actor., verification., person.). Verbs outside that list are writing raw subject
  names into an append-only ledger today. Is the scope to be widened, and if so by what rule?'
holding: |
  Advocate C wins on the rule, corrected in two places and extended in a third. Advocate A wins on the
  outcome for session.get but on none of the reasons it gave. Advocate B fails on every limb, including
  the one it conceded.

  The verb-prefix predicate is removed from the pseudonymiser. A payload is scrubbed on the strength of
  its keys alone, on every verb, with no carve-out. The verb list is not deleted from the codebase,
  because it has a second consumer nobody in the filing knew about and that consumer genuinely needs a
  verb predicate: it survives, renamed, and stops claiming the authority of 108.

  Two further defects found on the record and cured by order: the key list is under-inclusive of live
  credentials, and mfa.enroll is today writing a plaintext TOTP shared secret into a table that REVOKEs
  UPDATE and DELETE.

  The filing's fact base is defective in six places. Two of the three advocates argued from a source-file
  comment they had both mistaken for the words of the court.

  H1 (RATIO). The enumeration in 108 is not binding; its ratio is purposive. The strings "estate-wide",
  "blind", "operational record", "merely reference", "carry subject identity" and "minimisation, not
  erasure" appear NOWHERE in 108. Every one is from the doc comment above the constant in
  pseudonymise.rs, the implementer's self-justification for the list they wrote. 108's ratio contains no
  enumeration at all: "the kernel must additionally pseudonymise audit payloads at write time going
  forward so the immutable ledger stops accumulating raw subject PII it does not need." The enumeration
  appears three times, always in disposition material, always as a parenthetical gloss on the defining
  phrase "the high-PII verbs". The defining term is the class; the parenthesis is that court's
  then-current belief about its membership, formed before anyone had read the payload column. Where a
  court states a minimisation duty by its purpose and illustrates it with a list, the purpose binds and
  the list does not. Corroborated by practice: the shipped list had four prefixes and 108 names three;
  person. was added by the implementer on their own authority to serve the purpose, and nobody suggested
  that was ultra vires. A list an engineer may lawfully extend to serve the purpose is not a closed
  enumeration; it is a cache of the purpose, and this is the second time the cache was found stale.

  H2 (RATIO). session.get is in scope. B fails on all three grounds, each on a fact it did not check.
  Frequency: dispatch appends exactly one event per successful call and session.get emits displayName
  unconditionally, so rows-carrying-the-key IS the call count, and 18 of 618,259 events is 0.003 per
  cent. "Own name": actor.get and actor.list project the SAME column, actor.display_name, and actor. is
  in scope, so the identical value about the identical person out of the identical column is scrubbed on
  one route and left plaintext on another. That is an artefact of the route, not a considered
  distinction, and arbitrariness is the defect 108 exists to remove. Operational record: event carries a
  first-class actor_id FK, so "who was this" is answered by the row; the payload copy is a redundant
  plaintext duplicate and scrubbing it costs one join. The only case where the join returns no name is
  the case where the subject exercised erasure, which is the point rather than a cost.

  H3 (RATIO). org.agent.list is in scope, and both advocates had it backwards. The filing states, and A
  argues, that it returns names that "may be people". False on the schema: the verb selects WHERE role
  IS NOT NULL, only org.agent.create populates role, and that verb hard-codes kind AGENT. Every
  displayName it can return belongs to a software agent. B, which held the only principle that bit here,
  conceded the limb. It still earns no carve-out: under key-only scoping the payload retains agentId,
  role, reportsTo, grant and the rest, so the org chart is fully reconstructible and only a cosmetic
  label goes. A name-keyed rule cannot distinguish a software agent's display_name from a human's
  because they are the same column of the same table; where the cost of over-scrubbing is one join and
  the cost of the carve-out is a new list to keep in step by hand, the rule takes no carve-out.

  H4 (RATIO). The rule is key-only. A is refused: it proposes the same defect with a longer list and
  does not say what the list would be. C is adopted but mis-states its own case in both directions. C
  over-claims in calling this derive-don't-store: PII_KEYS is also an enumerated list and has also
  already failed once (five of eight KYC facets, over a test asserting two keys). It is consolidation,
  not derivation. C badly under-sells its benefit: a census found six further verbs outside the old
  scope returning a THIRD PARTY's PII today, csp.individual.create returning a UBO's full name being the
  sharpest, none of it in the filing. The gate found three verbs because those are what two boxes
  happened to exercise; a sample was presented as a census.

  H5 (RATIO). The verb list is not deleted; it has a second consumer with an opposite cost function.
  is_high_pii_verb also fences the idempotency cache, where a hit returns BEFORE dispatch, skipping every
  gate and append_event, so a PII-bearing body would sit in a plaintext jsonb column with no RLS, no TTL
  and no reach from person.erase. Delete the list and the fence loses its predicate; make the predicate
  universally true and the cache is disabled estate-wide, which makes a durable retry MORE likely to
  double-execute. One predicate may serve two policies only while both ask the same question. The
  pseudonymiser asks "does this payload contain subject PII" and holds the payload, so it derives.
  The fence asks "could this verb's response carry subject PII" and must answer before a body exists, so
  it needs a verb predicate. They separate; the constant is reassigned, not deleted.

  H6 (RATIO). The key list is under-inclusive of live credentials, and one is an authentication bypass.
  mfa.enroll AEAD-seals the TOTP secret into actor.mfa_secret_encrypted and then returns
  {"secret": <base32>, "otpauthUri": "otpauth://...?secret=<the same>"}, which dispatch clones into
  event. So the kernel seals the shared secret at rest and publishes the plaintext twice into a table
  migration 0023 REVOKEs UPDATE and DELETE on. Anyone with read access to event can mint that actor's
  second factor, permanently, and unlike the expired inviteToken it never expires. Same class:
  file.share_link.create returns token, integration.webhook.create returns secret, actor.invite returns
  inviteToken. Taken within jurisdiction because it is the identical defect (an under-inclusive
  enumerated list guarding the same immutable table), because it is unavoidable if the gate is to be
  ruled on at all, and because a live security defect found on the record is fixed on discovery.

  H7 (OBITER). It needed a court, on [2026] CC-OPBOX 16 (V1): reversibility of the implementation does
  not determine whether a question requires judicial determination. The order is appeal-proof against
  108's pending appeal, which asks whether pseudonymisation is ENOUGH and never whether it is too much.
