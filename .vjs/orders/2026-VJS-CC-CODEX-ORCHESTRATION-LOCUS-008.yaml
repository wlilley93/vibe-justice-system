id: 2026-VJS-CC-CODEX-ORCHESTRATION-LOCUS-008
court: county
jurisdiction: vibe-justice-system
repo_code: null
status: binding
issue: locus_of_multi_agent_orchestration_boltrig_kernel_vs_codex_native_subagents
holding: |
  DECLARED. Boltrig is an ORCHESTRATION KERNEL in which Codex is one governed leaf runtime, NOT a
  thin wrapper that delegates multi-agent orchestration to Codex's own native subagent facility. The
  locus of cross-cell orchestration - subagents-as-cells, phases, teams of subagents, dynamic
  workflows and automations - is the kernel's chokepoint, and it stays there.

  The question came to the court as a Principal's honest mental model: "I thought the subagents come
  with Codex, since Codex has subagents and we are just providing a wrapper." The court takes that
  seriously because it names a real design fork with two coherent readings, and disposes of it on the
  law already built rather than on preference.

  POSITION A (thin wrapper, Codex-native orchestration). Codex 0.144.3 can already decompose a task
  and run its own sub-tasks. On this reading Boltrig governs a single Codex process and Codex performs
  the multi-agent work internally; less code, one vendor, a battle-tested decomposition engine, and it
  matches the plain meaning of "wrapper".

  POSITION B (orchestration kernel, Codex as leaf). Boltrig already owns a full fleet layer - an org
  of Chief-of-Staff to heads to workers, phases, spawn rules, dynamic workflows and Hatchet automations
  - which predates Codex and today runs on the Pi runtime, with the manifest routing distinct
  capabilities to Pi, Codex, opencode, rivet and http. On this reading Codex is one governed leaf
  among several and the kernel drives the org.

  The court finds for POSITION B, and the reason is not aesthetic, it is that Position A is
  INCOMPATIBLE WITH THE LAW THIS VERY LANE WAS BUILT UNDER. The entire VJS-CC-VJS 1 through 7 program
  rests on one load-bearing premise: THE KERNEL CREATES, ATTESTS, UID-ISOLATES AND AUDITS EVERY CELL.
  VJS-CC-VJS 5 found as fact that two cells sharing one uid leak a cross-tenant bearer; VJS-CC-VJS 7
  granted CAP_SETUID/SETGID precisely so the kernel can spawn each cell under a distinct uid in a
  per-slot tmpfs it owns, and conditioned the grant on the kernel forking every cell through a
  privilege-separated spawner. A Codex-native subagent is a process the kernel did not fork: it
  carries no kernel-assigned distinct uid, sits in no per-slot tmpfs, is not asserted unprivileged
  from /proc before it is trusted (J5), is invisible to the audit chain and to the per-cell model-proxy
  grant broker, and is unreachable by the SO_PEERCRED/peer-uid attestation (J8). Position A would
  therefore reintroduce, by the side door, exactly the shared-blast-radius the court spent seven
  judgments closing. It cannot be adopted without silently overruling VJS-CC-VJS 5 and 7, which no
  party has asked and which the facts do not support.

  FACT FOUND (material, and it dissolves the apparent conflict with the Principal's intuition): the
  wrapper intuition captures something TRUE, but at the wrong altitude. Codex decomposing and reasoning
  WITHIN a single governed cell - one uid, one audit context, one grant envelope - is not orchestration
  the kernel must own; it is the very read-only reasoning the lane already provides, and it is welcome.
  The line the court draws is between INTRA-CELL reasoning, which Codex may do freely inside its cell,
  and CROSS-CELL spawning, which is the kernel's exclusive function. "Teams of subagents" and "phases"
  are cross-cell by nature: they are multiple governed cells, and each must be a cell the kernel forked,
  uid-isolated and can audit. So the honest answer to the Principal's question is: the subagents you
  can rely on come from the KERNEL; Codex brings the reasoning inside each one.

  HELD FURTHER, and part of the ratio: any Codex capability to SPAWN a sibling process, or to run an
  effectful tool that forks work outside its cell, is a write/effect and is PR8, which remains
  court-gated (VJS-CC-VJS 7 J14). Enabling Codex-native subagent spawning is not a configuration of
  this read-only lane; it is the write phase, and it does not open on the strength of this judgment.

  HELD FURTHER: nothing here disturbs the manifest's runtime-agnosticism. Codex is added as one
  ephemeral leaf runtime routed by a scoped spawn_rule; the org's default_runtime stays pi; and a
  console turn to a codex-routed capability is a kernel-orchestrated turn that happens to resolve its
  leaf to Codex, not a handover of orchestration to Codex.

  This is a DECLARATION on a first-impression question, made on a symmetric record with the strongest
  form of Position A put and answered. It binds by its ratio: the locus of cross-cell orchestration is
  the kernel; Codex is a governed leaf; intra-cell Codex reasoning is permitted; Codex-native sibling
  spawning is PR8. It is appealable by permission to the Court of Appeal, and a party may seek to move
  it if a future Codex version offers kernel-mediated cell spawning that preserves the J1-J11 boundary.
