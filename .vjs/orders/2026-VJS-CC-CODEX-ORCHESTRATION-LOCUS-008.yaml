summary: |
  First-impression DECLARATION on where multi-agent orchestration lives. The Principal's honest model
  - "subagents come with Codex, we are just a wrapper" - is answered on the law already built, not on
  preference. Boltrig is an orchestration KERNEL; Codex is one governed leaf runtime. Cross-cell
  orchestration (subagents-as-cells, phases, teams, workflows, automations) is the kernel's chokepoint
  and stays there, because a Codex-native subagent is a process the kernel never forked: no
  kernel-assigned uid, no per-slot tmpfs, no /proc attestation, invisible to the audit chain and the
  peer-uid check - it would reintroduce by the side door the shared blast-radius VJS-CC-VJS 5 and 7
  spent seven judgments closing, and adopting it would silently overrule them. The wrapper intuition is
  true at the wrong altitude: Codex decomposing and reasoning WITHIN one governed cell is welcome and is
  exactly the read-only lane; spawning a sibling across cells is the kernel's exclusive function and, for
  Codex, is PR8 write/effects and stays court-gated. Runtime-agnosticism is undisturbed: default_runtime
  stays pi, Codex is a scoped leaf. Appealable by permission.
