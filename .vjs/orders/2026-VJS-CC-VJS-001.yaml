runtime_summary: |
  A deterministic allocator must read the union of every store within its reach that evidences an allocation, and must never issue an identifier it can see is taken. An ungoverned prose store may be read only as a one-directional floor: able to raise the next value, never to lower it, never to establish that a value is free. Where the allocator's reach over a series is definitionally partial (a subscriber asked for a canon series), it must refuse to mint rather than allocate from what it can see.
