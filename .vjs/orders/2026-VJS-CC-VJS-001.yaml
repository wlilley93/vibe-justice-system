issue: citation_allocator_fail_open_collision
holding: |
  NOT first-impression. ACT-004:s8 ("Citations are deterministic and unique. Collisions are fatal") and [2026] VJS-PC 13 D2 (allocate from the live persisted register, collisions fatal) already bind and dispose of the core; [2026] VJS-PC 19 ("capability is not authority; an under-inclusive gate is a gap to close, not a jurisdiction to occupy") disposes of the subscriber/canon limb. The stated convening trigger was false on both limbs: the permits were active, not expired, and the kernel found no court obligation. Venue corrected: the patch is to canon crates with federation-wide effect, so the matter is canon's and this court sits at canon in the CC-VJS line. The defect was noticed at that seat; that confers no jurisdiction on the subscriber.
  (a) The `CorrectedToReferral` variant: GRANT, on corrected reasoning. The fix's own account of itself was false: the allocator never deserialises an Order (`live_citation_max` is a line-prefix text scan), so AuthorityStatus is not in its call graph and the enum could not have caused the fail-open. They are two independent defects found in one session. The variant lands on an independent ground: a status the correction mechanism WRITES must be a status the kernel can REPRESENT, since retaining a record that bricks the store it is retained in is retention in form and destruction in effect. The store is NOT certified readable: `vjs status` still fails with `missing field 'holding'`. Necessary, not sufficient.
  (b) Reading the order store: GRANT. Governed, schema-shaped, machine-checkable YAML is the paradigm of a persisted register.
  (c) Reading the markdown citator: GRANT, as a ONE-DIRECTIONAL FLOOR ONLY. The respondent is right about what the file is (prose, hand-maintained, schema-checked by nothing, carrying at least three incompatible row formats). But the respondent's remedy would cause the very collision the statute calls fatal: a structured parse of that file misses row 121 and allocates 104, into occupied good-law. The unanchored scrape is safe BECAUSE it over-matches: over-matching raises max, raising max skips numbers, and skipping is not fatal while colliding is. The kernel is not taking prose as LAW; it is taking prose as EVIDENCE OF OCCUPANCY, in the one direction where misreading is harmless. The entrenchment objection fails on its facts: the divergence between the stores is bidirectional, neither dominates, and a sunset ordered today would mandate a collision. Declared a floor, not a register, which preserves the pressure without commanding the harm.
  (d) The legacy-grammar skip: REFUSED as drafted, on a premise found false by the court and made by neither party. The two grammars are ONE sequence re-spelled, not two sequences: ruling 23 exists exactly once. The safety direction was backwards. COUNTING legacy can only raise max (safe); SKIPPING it can under-allocate into occupied ground (fatal). This is canon code running at every subscriber, so the skip is a realm-wide latent collision generator.
  (e) A canon series at a subscriber seat: ORDERED as a condition. Both parties mischaracterised it; the fix neither causes nor cures it, so it could not ground a refusal. But it is real, live and fatal: the subscriber mints `[2026] VJS-SC 6`, which canon holds as good law, in a string indistinguishable from canon's own. PC-19 is on all fours and following binding law is within First Instance competence.
