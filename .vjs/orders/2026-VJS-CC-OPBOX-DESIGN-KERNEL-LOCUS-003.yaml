runtime_summary: |
  Do not build a design kernel that holds token values: name the record instead.
  app/globals.css is the system of record for what ships, the Geist Figma file for what is
  decided, and the committed snapshot is a derived one-way pin between them. The seam is not
  as sound as the filing claimed, so harden it for real: the drift check cannot currently fail
  (32 of 34 tokens are migrating, 2 floor, none aligned, and both branches skip), the gate is
  invoked by no build or hook, the contrast check covers one token across five selectors while
  .sign-layout at globals.css:7259 is an unparsed sixth scope, and the CC-OPBOX 2 D3 ledger
  classifies 3,820 drawing sites and zero production sites. Wire the gate so a non-zero exit
  blocks, report enforced rows rather than a bare PASS, extend it to every selector defining
  --border-control, and extend the ledger to src/ and app/. Sever code generation and reserve
  it; put Code Connect to the Principal as a priced option, never as a precondition.
