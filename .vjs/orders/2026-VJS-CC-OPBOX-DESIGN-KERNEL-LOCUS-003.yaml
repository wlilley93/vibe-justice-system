issue: opbox_design_kernel_locus
holding: |
  None of the three near authorities is on all fours. CC-OPBOX 1's prohibition bites only on
  a domain "already folded onto one kernel"; no kernel owns design tokens, so the precondition
  is unmet and the prohibition does not fire. But the first limb of that same ratio decides
  the remedy: the question is not whether to add a fourth artifact, it is which artifact IS
  the record. CC-OPBOX 2 expressly reserved "which of the Figma file or the repository is the
  source of truth for --border" as a separate matter; this is that matter, so a County Court
  is competent and CC-OPBOX 2's directives stand undisturbed. PC-13 and PC-14 do not reach
  this substrate on their own express words: PC-14 Q3 cuts the wired-or-void limb to
  governed-record creation, "a law, ruling, citation, order, or permit", and NOWHERE ELSE. A
  design token is none of those.

  Q1: a design kernel is not per se the second authority CC-OPBOX 1 forbids, because there is
  no first. The governing distinction is between an artifact that STORES token values and one
  that DERIVES and enforces over a named record. The first is an authority and here would be
  the fourth; the second is a gate and is no authority at all. Only the second form is lawful.

  Q3: A, B and C are all declined as filed, and I say plainly that I craft a different
  disposition, because each option's own factual premise failed on inspection. B rests on "the
  gate already works" and on the 173 specs carrying file:line pointers. Neither holds. The
  gate's drift limb CANNOT FAIL today: of 34 mapped tokens 32 are `migrating` and 2 are
  `floor`, both of which the checker skips, and none is `aligned`, so the printed "figma
  drift: PASS" is vacuous. The gate is invoked by nothing: no workflow, no package.json
  script, neither githook. Only 16 of 173 specs carry a file:line pointer and 45 name no
  source file at all. Separately the CC-OPBOX 2 D3 ledger is derived solely from the drawing
  corpus and holds ZERO rows for src/ or app/, so 3,820 drawing sites are classified and no
  shipped paint site is: a live shortfall against a binding order. A is refused in its storing
  form, and its generation limb is unproven on the filer's own concession. C is not mine to
  order: a spend is reserved to the Principal under ACT-001:s2.

  The strongest case against me is A's: a gate is a discipline and disciplines fail, whereas
  one artifact owning the values makes drift structurally impossible. I accept the premise and
  reject the inference. This record is not of a gate that failed but of a gate nobody switched
  on, over a contract in which no row is in an enforceable state. A fourth store inherits that
  defect and adds one. Consolidation is right; it is achieved by naming the record and wiring
  the derivation, not by adding a store.

  Q4: severable, and severed. The contract limb enforces duties that already exist over values
  already in the repo; the generation limb is speculative and needs the very verification layer
  that does not exist.

  The RATIO: where a domain has no system of record the prohibition on a second authority does
  not fire, and the remedy is to name the artifact that already is the record and derive over
  it, never to add a further artifact storing the same values; a governed-record front-door
  instrument whose operative limb is expressly cut to an enumerated list of record kinds does
  not reach a non-governed substrate by its own force; and a gate that no build invokes, over a
  contract in which no row is in an enforceable state, is not enforcement and cannot be relied
  on as the reason not to consolidate.
