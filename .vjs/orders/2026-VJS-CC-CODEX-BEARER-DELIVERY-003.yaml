runtime_summary: |
  Codex production bearer delivery: deliver the issued bearer to the auth-helper ON the same
  SO_PEERCRED-attested unix-socket connection; no bearer file on disk in the production path.
  Option A (0600 file) is the lawful pre-swap interim only - it binds to the uid, not the
  attested process, and leaves a credential at rest. Option B binds delivery to the exact
  attested peer, leaves nothing on disk, and re-attests on each Codex refresh; the auth.command
  stdout contract is unchanged (only the helper's acquisition moves from cat-file to socket-read).
  On wiring the ingress, remove the file path (never parallel). Read-only; PR8-gated; this settles
  delivery only and does not authorize the production_ready flip.
