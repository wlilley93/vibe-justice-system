id: 2026-VJS-CC-CODEX-BEARER-DELIVERY-003
court: county
jurisdiction: vibe-justice-system
repo_code: null
status: binding
issue: codex_bearer_delivery_channel
holding: |
  Option B prevails for the production multiplayer path: the attested bearer is delivered to
  the auth-helper ON the same SO_PEERCRED-attested unix-socket connection, and no bearer is
  written to the cell filesystem in that path. The question left open by [2026] VJS-CC-VJS 1
  (whose ratio fixes only that SO_PEERCRED attestation of the helper peer must gate ISSUANCE,
  not the post-attestation delivery channel) is now settled. The purpose of the enacted
  attestation machinery is to bind the credential to the exact process proven by SO_PEERCRED
  and the held pidfd. A 0600 file (Option A) binds the bearer only to the uid: any same-uid
  process can read it, opening a gap between the peer that was attested on the socket and the
  process that obtains the bearer, and leaving a credential at rest for the TTL window. Socket
  delivery closes that gap - the connection whose peer was attested is the sole recipient - and
  leaves nothing on disk. This reading is consistent with [2026] VJS-CC-VJS 2, whose own
  forbidden item contemplates distinct-uid cells being served "in place of the SO_PEERCRED
  socket," i.e. by the socket, not by files; its D5 "identical delivery contract" is correctly
  read as the Codex-facing auth.command contract (the helper writes the raw bearer to stdout),
  which Option B preserves unchanged - only the helper's ACQUISITION moves from `cat`-a-file to
  a socket read. The court acknowledges Option A is the lawful interim (VJS-CC-VJS 2) and that,
  in the single-uid-per-cell model, the residual same-uid exposure of A is close to the same-uid
  exposure of any in-memory credential; but for the production path the stronger posture (no
  credential at rest, delivery bound to the attested connection, and natural re-attestation on
  each Codex auth.command refresh) is the one that best serves the enacted security model and is
  chosen. This authority is scoped to the read-only reasoning cutover; write/effects remain
  PR8-gated. This ruling settles the delivery channel only; it does not authorize flipping
  production_ready, which stays gated on the full ingress + supervisor registration + attestations.
