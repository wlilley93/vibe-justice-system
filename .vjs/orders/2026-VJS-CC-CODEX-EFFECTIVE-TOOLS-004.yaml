- treating_this_judgment_as_holding_that_the_tool_ceiling_as_it_stands_today_discharges_the_effective_tools_limb_it_holds_the_opposite_on_the_current_record
- removing_effective_tools_from_the_production_blockers_on_the_strength_of_design_documentation_a_docstring_or_a_unit_test_of_enforce_tool_ceiling_alone
- relying_on_the_key_is_injected_server_side_as_proof_that_the_proxy_is_the_cells_only_path_to_a_capability_that_premise_is_expressly_held_unproven
- weakening_enforce_tool_ceiling_fail_closed_behaviour_as_a_step_towards_satisfying_any_limb
summary: |
  Kernel determination CAN discharge a capability limb the vendor protocol cannot express, but only
  on four proofs: exclusivity, derivation, fail-closed, live re-proof. On this record exclusivity is
  asserted not shown and the ceiling wiring is untested, so effective_tools stays a blocker. Separately,
  the lane is still behind the trusted wall, so the flip is void regardless. Liberty to re-apply on the
  evidence at F3 to F6.
