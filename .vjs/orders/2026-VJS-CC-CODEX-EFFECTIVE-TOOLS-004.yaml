id: 2026-VJS-CC-CODEX-EFFECTIVE-TOOLS-004
court: county
jurisdiction: vibe-justice-system
repo_code: null
status: binding
issue: codex_effective_tools_production_limb
holding: |
  Claim REFUSED on the current record, but the principle is decided for the party. Determination
  at a kernel-owned chokepoint DISCHARGES a capability limb: a limb the vendor protocol cannot
  express is not thereby waived, and must be discharged by an equivalent-or-stronger kernel-side
  control. A self-report from the component under constraint is the weakest admissible evidence of
  its own bounds; the kernel's own vantage is preferred, exactly as [2026] VJS-CC-VJS 1 D1 preferred
  SO_PEERCRED over caller-supplied identity. Reading the limb to require a vendored protocol method
  would convert a security requirement into a vendor-feature requirement, which is rejected.
  BUT determination counts as attestation only where four things are proven BY TEST and not merely
  designed: (1) EXCLUSIVITY, the chokepoint is the only path by which the capability can be conferred
  on the actor, proven by a negative test that the capability is unobtainable off that path;
  (2) DERIVATION, the bound applied is computed from the compiled policy the claim cites, not from a
  constant or a default; (3) FAIL-CLOSED, anything the chokepoint cannot verify is refused rather than
  forwarded; (4) LIVE RE-PROOF, an end-to-end observation on the pinned artifact showing the bound
  holding on the real wire, re-run as a gate. Absent any one, the limb is UNSATISFIED, and a design
  description of the chokepoint is not evidence of the property. On this record exclusivity is asserted
  rather than shown, and the composition-root wiring of the ceiling is untested, so the limb fails.
  COROLLARY, equally part of the ratio: a readiness flag may not be flipped on a lane structurally
  barred from the posture the flag asserts. Where a lane fails closed under a production signal,
  production_ready = True on that lane is VOID whatever the merits of its individual limbs. The court
  finds as fact that the Boltrig Codex lane remains behind require_codex_trusted_posture: the
  SO_PEERCRED ingress was wired INSIDE the trusted wall, not in place of it, so VJS-CC-VJS 2 D4
  applies squarely and the applied question is settled against the flip.
