runtime_summary: >
  A verb records to the local record store, never into the canon tree, and no write path may
  create the directory the resolver reads canon from. The vendored branch requires a directory
  that DECLARES itself a lawpack, not one that merely exists. Where the recorded subscription
  and the resolved source disagree the kernel reports DISPLACEMENT, not drift, because a re-pin
  ratifies displacement rather than curing it.
