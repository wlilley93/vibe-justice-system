runtime_summary: |
  DERIVED. Not primarily on derive-don't-store (which reading A answers), but because prominence is RUN-RELATIVE: two of the three signals (loaded skills, grant specificity) are properties of the run, not the verb, so a run-invariant column cannot express the value. Confirmed by two facts: a builtin keeps its ORIGINAL verb rows forever, so a declared rank is born stale and unreachable for existing tenants; and a consumed MCP server declaring its own prominence is self-dealing. Attestability comes from a DETERMINISTIC derivation, not from a column. Derive at offer time (D1); order skill affinity, then grant specificity, then consequence, with a stable tie-break (D2); WIRE it, and prove call-time authority is unchanged so disclosure only reduces (D3); the declared slot is reserved on three conditions (D4); build it at the boltrig MCP face, not as an Opbox special case (D5).
