id: 2026-VJS-CC-RANKING-SIGNAL-010
court: county
jurisdiction: vibe-justice-system
repo_code: null
status: binding
issue: ranking_signal_declared_or_derived
holding: |
  DERIVED, and the reference's own framing understates why. The county derive-from-the-record ratio (2026-07-17) is engaged but is NOT what decides this, and the court declines to rest on it alone, because reading A answers it squarely: the verb row does NOT hold every constituent of a prominence value, so on that ratio the question would still be open. What decides it is that the value being ranked is RUN-RELATIVE. Prominence is not a property of a verb; it is a property of a verb IN THIS RUN. Of the three signals actually available, two are properties of the run and not of the verb at all: what skills the run loaded, and how narrowly the run token names the verb. A stored field on the verb row is run-invariant by construction and therefore cannot express the quantity at issue. Declaring it would store a run-invariant proxy for a run-relative value, which is a category error, and it is the exact mechanism by which "the code says HIGH while the kernel gates LOW". Two facts in the reference confirm it rather than merely support it. First, a builtin registered into a tenant keeps its ORIGINAL verb rows forever, so a declared rank is not just redundant, it is BORN STALE for every tenant already provisioned and unreachable by any later code change. A signal that cannot be corrected after provisioning is not a contract, it is a fossil. Second, a consumed MCP server is third-party data. To let it declare its own prominence is to let a stranger rank itself at the top of the model's context, which is self-dealing; the existing `_consequence_hint` clamp shows the realm already distrusts that surface even for a value it does accept, and prominence is a more attractive thing to lie about than consequence. The court records what is NOT at stake, because it disposes of reading A's strongest argument. Disclosure can only reduce what reaches a MODEL CONTEXT; it can never change what reaches the table. `_invoke_inner` gates on the verb row at every step and is independent of the offer. So the attestability that reading A seeks is not bought by declaring the signal; it is bought by making the DERIVATION deterministic. A pure function of (verbs, grants, skills) with a stable tie-break is exactly as attestable as a stored column and cannot go stale. On Q4 this is a BOLTRIG PROTOCOL obligation, not an Opbox local choice. The ranking happens at `_list_tools`, the kernel's own MCP face, which is the seam that already filters by tenant grants intersected with run-token grants. Building it as an Opbox special case would put one concern in two systems, against the consolidation steer and against the locus ratio that domain lives on its system-of-record kernel. Opbox's `VerbTier` is presentation-layer and stays presentation-layer. The declared slot is RESERVED, not refused, on the conditions in D4.
