question: |
  Is the tool-ranking signal for progressive disclosure DECLARED by the adapter as a stored field on the verb row, or DERIVED at offer time from the verb row and the run token's skills?
title: The tool-ranking signal is DERIVED, because prominence is run-relative and a verb row cannot hold a run-relative value
