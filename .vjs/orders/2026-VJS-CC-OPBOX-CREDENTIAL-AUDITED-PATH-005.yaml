runtime_summary: |
  A minted credential leaves on the reserved `_secret` envelope, which dispatch strips by position
  before the payload is audited. Do not rely on SECRET_KEYS to catch it: a name list is one refactor
  away from silently not applying, and silence is exactly what makes it unacceptable here. The ledger
  keeps the credential's ID and never its value; a pseudonym is worse than nothing, because it records
  that something was minted while destroying which. webhook_endpoints.secret is sealed at rest like the
  TOTP seed. And before any of that: whatever is already in event.payload and still authenticates gets
  revoked, on every box.
