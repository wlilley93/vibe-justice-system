id: 2026-VJS-CC-OPBOX-CREDENTIAL-AUDITED-PATH-005
court: county
jurisdiction: opbox
repo_code: null
status: binding
issue: credential_return_through_audited_path
title: 'A minted credential leaves by a reserved structural envelope, not by a scrubbed key: position,
  not name, is what dispatch may rely on'
question: 'Three verbs mint a live credential and return it in their output, which dispatch clones into
  an append-only, hash-chained event.payload. [2026] VJS-CC-OPBOX 4 O3 added those key names to
  SECRET_KEYS, so the audited copy is now pseudonymised at write time. Is that sufficient, or must a
  verb that mints a live credential be forbidden from returning it through the audited path at all?'
holding: |
  Advocate B wins on the rule. Advocate A wins the narrow point that the caller must still receive the
  credential, which B never disputed and which shapes the remedy. Advocate C is right on the facts and
  wrong on the disposition: the storage asymmetry it found is real and is brought into this order rather
  than deferred, but a referred question is not answered by fixing something adjacent to it.

  The write-time scrub is NOT sufficient for a credential. It was designed for subject PII and the two
  have different failure modes: a name in the ledger is a privacy harm that pseudonymisation genuinely
  cures, whereas a live credential is an authentication bypass that pseudonymisation only conceals. The
  scrub is correct and stays; it is a second line, and it was being asked to be the only one.

  A credential leaves the kernel through a RESERVED STRUCTURAL ENVELOPE. The verb returns it under the
  reserved top-level key `_secret`, and dispatch removes that key by POSITION before the payload is
  cloned into the ledger. The distinction from O3 is the whole holding: SECRET_KEYS is a list of names
  that must be kept in step with every verb that ever mints anything, and this repo has now had a key
  list found stale three times; `_secret` is a structural contract that a renamed field cannot escape,
  because the envelope is the thing dispatch looks for and the field name inside it is irrelevant.

  H1 (RATIO). A defence that depends on a string literal matching is not a trust boundary. Where a
  value must never reach a store, the mechanism that keeps it out must be positional or typed, never
  nominal. A nominal defence fails silently under refactor, and silence is the property that makes it
  unacceptable for a credential: nothing goes red, no test fails, and the next reader sees a list that
  looks complete.

  H2. `[redacted:unkeyed]` on a credential DEFEATS the audit obligation rather than satisfying it.
  pseudonym() falls back to that marker when the identity HMAC key is unresolvable, so the ledger would
  record that a secret was minted while losing the ability to say which one. For subject PII that
  fallback is correct and conservative. For a credential the record must name the credential by its ID,
  which is not secret, and must never carry the secret in any form. The envelope gives that for free:
  the ledger keeps `tokenId` and loses `_secret` entirely, which is the correct audit record.

  H3. `webhook_endpoints.secret` is PLAINTEXT AT REST and is IN SCOPE, not a separate matter. Advocate C
  found it and proposed deferring the referred question to fix it; the reverse is ordered. A webhook
  signing secret must be readable to HMAC with, so it cannot be hashed, but it can be sealed exactly as
  the TOTP seed already is by aead_seal. Three credentials arrived at three different storage postures
  and no one chose that. The code comment saying "COURT-GATED ... DEFERRED" is a note that a question
  was parked, not an answer, and it is answered here.

  H4 (FOUND ON THE RECORD, not pleaded). The filing states that none of the three verbs has ever been
  called and that there is therefore no legacy exposure. That is true of those three verbs and false of
  the ledger. Credentials minted by OTHER verbs are already in event.payload on both live boxes. This is
  a live security defect, not a design question, and it is dealt with first.
