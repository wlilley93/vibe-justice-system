reserved:
- whether the caller-facing delivery of a credential should additionally be one-shot and bound to the
  minting session, rather than simply returned outside the audited payload; B argued it in the
  alternative and the envelope alone disposes of the referred question
- whether agent roster keys need a rotation path at all; see execution_findings EF-4, which found there
  is none and that this order's O1 cannot be complied with non-destructively for an AGENT seat
- whether status ACTIVE on an expired token is itself a defect worth curing in the token model, or
  merely untidy given that consume_token enforces expiry independently
fact_corrections:
- 'FC-1: the filing states there is no legacy exposure to remediate. There is. On 2026-07-27 event.payload
  held credential plaintexts that still authenticated on BOTH live boxes. The filing reasoned from the
  three verbs it was about; the ledger does not care which verb wrote a row.'
- 'FC-2: this corrects a recital in [2026] VJS-CC-OPBOX 4 itself, which proceeded on the basis that the
  credential keys it was adding to SECRET_KEYS had no live instances behind them.'
- 'FC-3: the filing''s claim that all three verbs store their credential safely is right on mfa.enroll
  (aead_seal) and file.share_link.create (sha256) and WRONG on integration.webhook.create, whose secret
  column is plaintext text NOT NULL. Advocate C found this; neither A nor B addressed it.'
execution_findings: |
  Recorded because the order was executed the same sitting and execution corrected the order's own
  scope. This is annotation, not ratio.

  EF-1. O1 named three credentials. The true figure was 137 live across two boxes: 131 on beelink and 6
  on jellytot-prod, the latter including an 845-verb agent key and an 898-verb Chief-of-Staff key. All
  137 are now REVOKED, and the three the court named were each presented to the kernel front door
  afterwards and refused with 401.

  EF-2. The count was reached wrongly twice first. Matching payloads against token.id reported 683 rows,
  because the ID is not the secret and appears in payloads legitimately; every figure above is instead
  confirmed by hashing the candidate against token.token_hash. And searching only the `opbox_key_`
  prefix missed two strings, because token.mint emits `opbox_tok_` and actor.invite emits
  `opbox_invite_`. Nine prefixes are now read out of kernel/src rather than recalled.

  EF-3. 128 of the beelink rows were expired lease tokens from agenttask.claimNext, a verb family named
  in neither the filing nor this order. consume_token enforces expiry deterministically, so they could
  not have authenticated; they were revoked regardless, because "no credential in the ledger is ACTIVE"
  is an invariant a gate can check and "none of the ACTIVE ones happens to be usable" is not.

  EF-4. O1 cannot be complied with non-destructively for an AGENT seat. There is no verb or host act to
  re-mint a roster key for an existing agent: rotate-cos-key covers the Chief-of-Staff alone, token.mint
  sets neither capability_scope nor autonomy_ceiling, and secret.rotate and credential.rotate address
  different objects entirely. The one live consumer found (boltrig-shadow, held as OPBOX_MCP_TOKEN in
  two containers) was revoked without a replacement being available. Reserved above.

  EF-5. The sweep is now a standing command, scripts/verify-no-live-credentials-in-ledger.sh, wired into
  the fleet tier for both boxes, with 16 seeded cases and proven able to fail under mutation. An
  unreachable box SKIPs rather than reporting a ledger it never opened, and the gate plants a known
  credential in a nested payload before believing any count, so a broken extractor reports METHOD BROKEN
  instead of a clean bill of health.
rows_already_written: |
  Nothing happens to them, and this court orders nothing, for the same reason [2026] VJS-CC-OPBOX 108
  gave and [2026] VJS-CC-OPBOX 4 repeated. Migration 0023 REVOKEs UPDATE and DELETE on event and the
  chain hash covers the payload, so an in-place edit would be both unlawful and detectable by
  audit.chain.verify. 108 considered post-write redaction expressly and REFUSED it.

  The consequence is worth stating plainly rather than leaving implicit, because it is the reason O1 is
  immediate: a credential written to that table is disclosed permanently and cannot be unwritten. The
  only remedy available is to remove what the disclosure is worth. Revocation leaves the plaintext
  sitting in the ledger forever and makes it open nothing, and that is the whole of the cure.
