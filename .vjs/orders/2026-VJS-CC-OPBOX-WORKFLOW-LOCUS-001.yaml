id: 2026-VJS-CC-OPBOX-WORKFLOW-LOCUS-001
court: county
jurisdiction: opbox
repo_code: null
status: binding
issue: opbox_workflow_domain_locus
holding: |
  Option Z prevails; X and Y are both refused. On the symmetric case file the court finds three facts decisive. First, the opbox workflow domain is already OWNED by the Rust unitary-stack kernel: the opbox engine persists run state through that kernel via verbs and workflow_run_projection is kernel-owned; the only opbox-boltrig coupling anywhere is the chat/agent path. Second, boltrig's interpreter executes only control-flow plus governed adapter/agent verbs and fails closed on anything else, so it cannot run opbox's ~24 domain-bound step types (create_matter, generate_document, table rows, send_form, wait_for_submission, assign, update_status, run_integration, send_notification, ...). Third, opbox workflow data already exists in the opbox companion store AND the Rust kernel SoR, so a boltrig copy is a THIRD store for one concern. Option X (execution through boltrig) is therefore infeasible and value-negative: the only way to run the domain steps is to register ~24 opbox callback verbs, after which opbox STILL executes the work while shedding its durable resume-token pause model, the matter-step bridge, waiting_for_child chaining and human-form (wait_for_submission) blocking, and it stands up a second execution authority over a Rust-kernel-owned domain. Option Y (mirror for visibility) is refused as fragmenting: duplicating an already-folded domain into the boltrig kernel is a redundant third store, and any divergence (definition edits, run-status races) reintroduces exactly the split-brain the unitary stack was built to remove, contrary to the consolidation principle. The RATIO: a domain's locus follows its system-of-record kernel, not the frontend and not a second kernel; where a domain is already folded onto one kernel it must be neither executed by nor mirrored into another, and cross-frontend visibility is served from that domain's own SoR read models (which any frontend may read), never by copying the domain into a second kernel. Boltrig's remit under opbox is the agent/chat/tool-run/cost domain it OWNS (the chat cutover and authoritative-cost feedback already built are correct and undisturbed); it is not the home of regulated domain facts - matters, workflows, signing, money - that the unitary-stack kernel already owns. The plan's Phase-2 premise "single execution engine = boltrig" is factually wrong for opbox workflows and is set aside.
