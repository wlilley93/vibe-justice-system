runtime_summary: |
  opbox workflows are Rust-unitary-stack-kernel-owned; boltrig can only run governed verbs and fails closed on opbox's ~24 domain steps. Refuse execution-through-boltrig (X, infeasible + second authority) and mirror-for-visibility (Y, a fragmenting third store). Z prevails: the workflow domain stays solely on its Rust-kernel SoR and is not duplicated into boltrig; cross-frontend visibility, if wanted, comes from that SoR's read models. Boltrig's remit under opbox is the chat/agent/cost domain it owns (cutover + authoritative cost, already built). Reserved and NOT decided here: whether the two kernels (Rust unitary-stack + boltrig) should ultimately be reconciled into one - that is foundational and belongs to a higher forum.
