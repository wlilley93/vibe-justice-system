id: 2026-VJS-CC-VJS-LAWPACK-RESOLUTION-012
court: county
jurisdiction: vibe-justice-system
repo_code: VJS
status: binding
issue: lawpack-resolution
question: >
  When the kernel cannot resolve a lawpack for a jurisdiction, must it refuse rather than
  silently load an empty one; and is the lawpack lock computed over the manifest alone or
  over the lawpack tree?
holding: |
  APPLICATION GRANTED IN PART (Marbury J, sitting alone at first instance). The submission
  is upheld on (a), (c), (d) and (e), and the respondent's availability objection succeeds
  on (b), which changes HOW (a) is implemented without changing that it must be.

  THE DISTINCTION THAT DECIDES THIS CASE IS ALREADY IN THE CODEBASE, AND IT IS NOT THE ONE
  THE RESPONDENT DREW. The case for the fallback rests on F7: `overlay_filed_orders` refuses
  to fail on a missing orders directory because "a fresh subscriber repo has no orders yet,
  and refusing to route in that state would be worse than the defect being fixed." That
  reasoning is sound and this court affirms it. It does not reach the lawpack, and the
  applicant's answer at AGAINST(3) is correct: a repository ACQUIRES orders by operating and
  never acquires a lawpack by operating. A missing orders directory is a STAGE. A missing
  lawpack is a FAILURE. The two absences look alike on disk and are opposite in law.

  (a) A KERNEL THAT SUBSTITUTES A CANON DOES NOT SATISFY ACT-001:s5. The clause is "the
  kernel loads the lawpack and resolves authority deterministically". A resolver that answers
  one question with four constitutional sections in one repository and with silence in
  another (F3), marking neither, is determinate in form and arbitrary in substance. This
  court holds that `load_lawpack` MUST return an error when it cannot resolve a lawpack for
  a repository that has been INVOKED as a jurisdiction, that is, one carrying `.vjs/config.toml`.
  It MAY continue to operate over an empty canon in a repository that is not a jurisdiction,
  because there is nothing there to be wrong about.

  (b) THE BOOTSTRAP OBJECTION SUCCEEDS AND IS ANSWERED WITHOUT PRESERVING THE FALLBACK. The
  respondent is right that `vjs invoke` builds a kernel context on line 20, before it has
  written the config that would say where the lawpack is, so a rule keyed on the config alone
  would make invocation impossible. The remedy is not to keep the silent fallback but to stop
  `invoke` asking a question it already knows the answer to: it must resolve the lawpack from
  its OWN argument and digest THAT, never by way of `build_kernel_context`. The gate in (a)
  is keyed on the presence of `.vjs/config.toml`, which at invoke time does not yet exist,
  so the two rules do not collide.

  (c) A FLAG THAT LABELS WITHOUT SELECTING MUST BE MADE TO SELECT OR BE REMOVED. `--lawpack`
  is accepted, printed, and written into two artefacts while having no effect on what is
  loaded (F2). The resulting record is not incomplete but FALSE: `.vjs/lawpack.lock` in
  vibe-design-system names `vjs-v2@0.1.0` and pins the sha256 of the empty string (F5). A
  false record of a subscription is worse than an absent one, because it is the artefact a
  later court would rely on. The flag must resolve a path or a registered id, and must refuse
  when it cannot.

  (d) A DIGEST THAT CANNOT MOVE WHEN THE LAW MOVES IS NOT A PIN. `compute_digest` hashes
  `manifest.toml` alone, so any statute in the canon may be rewritten and every subscriber's
  lock still verifies (F4). The respondent's churn objection is real but is an argument about
  CADENCE, not about SCOPE, and it is answered by making a re-lock a recorded act rather than
  by narrowing what is hashed. The digest must be computed over the lawpack tree,
  deterministically, and a re-lock must carry a reason a reader can answer.

  (e) A JURISDICTION HOLDING A FALSE LOCK MUST CORRECT THE RECORD, NOT ONLY THE CODE.
  vibe-design-system must re-invoke against a resolved lawpack once (a)-(d) are in force, and
  the superseded lock must be recorded rather than overwritten in silence.

  ON THE ABSENCE OF HARM. Neither side's harm argument was needed. It is enough that the
  identical defect one level down was found, reasoned about, and fixed on 2026-07-27 (F6),
  and that the larger half of the same citator was left in place in the same edit. This court
  does not find that omission blameworthy; the duty under ACT-001 is to make the work good,
  and this order is that remedy.
directives:
  - id: D1
    actor: kernel
    must: refuse_when_lawpack_unresolvable_for_an_invoked_jurisdiction
    when: vjs_config_present
  - id: D2
    actor: kernel
    must: resolve_lawpack_from_the_invoke_argument_not_the_kernel_context
    when: invoking_a_jurisdiction
  - id: D3
    actor: kernel
    must: make_the_lawpack_flag_select_what_is_loaded
    when: a_lawpack_is_named
  - id: D4
    actor: kernel
    must: compute_the_lawpack_digest_over_the_lawpack_tree
    when: pinning_a_lawpack
  - id: D5
    actor: agent
    must: correct_a_lock_recording_a_false_subscription
    when: a_lock_pins_an_unresolved_lawpack
  - id: D6
    actor: kernel
    must: distinguish_a_jurisdiction_with_a_canon_from_one_without_in_status
    when: reporting_installation_state
forbidden:
  - substitute_an_empty_lawpack_for_an_unresolvable_one_in_an_invoked_jurisdiction
  - record_a_subscription_that_did_not_resolve
  - pin_a_lawpack_digest_that_cannot_move_when_a_statute_moves
exceptions:
  - a_repository_that_is_not_a_jurisdiction_has_no_canon_to_be_wrong_about
  - a_missing_orders_directory_remains_a_stage_and_not_a_failure
supersedes: []
source_opinion: 2026-VJS-CC-VJS-12-opinion.md
runtime_summary: >
  An invoked jurisdiction whose lawpack cannot be resolved is an error, never an empty canon.
  invoke digests the lawpack it was told about. --lawpack selects or refuses. The lock is
  computed over the lawpack tree, not the manifest. A false lock is corrected on the record.
