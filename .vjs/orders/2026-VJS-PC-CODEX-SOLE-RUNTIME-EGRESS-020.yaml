summary: |
  Appeal of [2026] VJS-CC-VJS 8 ALLOWED IN PART, ON CONDITIONS, UNANIMOUS 3-0 (Redvers, Calderhew,
  Ashcombe presiding). Codex MAY be the sole wired governed leaf runtime (retire opencode, herdr, mastra,
  pi from the roster); "submit to Codex's subagent/profile/skill model" is lawful; and model egress is
  governed. The bench holds the load-bearing ratio of VJS-CC-VJS 8 is LOCUS not CARDINALITY (the kernel
  forks/attests/uid-isolates/audits every cell), so retiring runtimes moves only the incidental K2
  holding by variation under ACT-002:s9, within the Privy Council's remit, not an overruling. Doctrine
  affirmed: an executive re-direction triggers the court but is not itself the ground; the holding moves
  because the court finds it incidental on consolidation grounds, and the wrapper intuition rejected in
  VJS-CC-VJS 8 stays rejected. Conditions: (1) the multi-runtime routing seam stays live and one non-Codex
  leaf stays re-wirable as a quarantine fallback until production_ready unblocks; (2) submit-to-Codex is
  interface-not-executor, with Codex's native spawn facility suppressed at the model-proxy chokepoint
  (as exec_command is stripped), every request fulfilled by a kernel-forked cell; (3) provider-side search
  only where the kernel can see and audit query and results on the wire, per-cell fail-closed; opaque
  provider-side search is forbidden as unaudited egress; a local browser-CLI is PR8. production_ready stays
  False; PR8 stays shut; the read-only lane (VJS-CC-VJS 2) is unaffected and deployable.
