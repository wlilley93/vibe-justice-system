issue: appeal_of_vjs_cc_vjs_8_codex_as_sole_governed_leaf_runtime_and_submit_to_codex_orchestration_model_plus_joined_first_impression_question_of_model_egress_and_internet_search
holding: |
  APPEAL ALLOWED IN PART, ON CONDITIONS, UNANIMOUSLY (3-0: Redvers PJ, Calderhew PJ, Ashcombe PJ
  presiding). All three limbs are GRANTED ON CONDITIONS. This is a VARIATION of an incidental holding
  of [2026] VJS-CC-VJS 8 under ACT-002:s9, not an overruling; the load-bearing RATIO of that judgment
  is expressly reaffirmed and left intact, so the matter sits within the Privy Council's remit and is
  not certified up.

  WHAT IS RATIO AND SURVIVES UNTOUCHED. The load-bearing ratio of VJS-CC-VJS 8 is that the KERNEL is the
  sole locus of cross-cell orchestration and forks, attests, uid-isolates and audits EVERY cell, with
  Codex a governed leaf and Codex-native sibling spawning reserved to PR8. That ratio is untouched by
  changing WHICH BINARY each kernel-forked cell runs. The fact-findings of VJS-CC-VJS 5 (two cells at
  one uid leak a cross-tenant bearer) and the grant-conditions of VJS-CC-VJS 7 (J1-J11) are equally
  untouched. No party offered evidence to disturb them and none is disturbed.

  WHAT IS INCIDENTAL AND IS MOVED. K2 of VJS-CC-VJS 8 ("keep Codex as one governed leaf among several,
  the org's default_runtime remaining pi, never reframe as a thin wrapper") is incidental description of
  a transitional posture: it sits in a HELD FURTHER clause and answers a question, the number of leaf
  vendors, that was never the issue the court decided. The bench finds, unanimously, that the safety
  property of VJS-CC-VJS 8 was carried entirely by WHO FORKS THE CELL, never by which binary the cell
  runs or how many vendors are wired. Reducing the active leaf roster to Codex alone (retiring opencode,
  herdr, mastra and pi from the wired roster) therefore does not touch the ratio and is permitted.

  THE GROUND MATTERS, AND THE OCCASION IS NOT THE GROUND. Ashcombe PJ states the doctrine the whole
  bench adopts: an executive re-direction by the Principal is NOT of itself a lawful ground to move any
  holding. Under ACT-001:s2 the Prime Minister office gives policy and direction, but only the Sovereign
  office makes or unmakes law by due process, and a directive that conflicts with binding law is ultra
  vires until cured by the lawful route (ACT-001:s6; ACT-002:s6 trigger 4). What the Principal's
  re-direction lawfully does is TRIGGER this court. The incidental holding then moves, if at all, because
  the court on the law finds it incidental and varies it: the authority is the court's, the occasion
  alone is the Principal's. Accordingly the collapse to a single wired leaf is permitted on CONSOLIDATION
  and REDUCED-ATTACK-SURFACE grounds, and a collapse reasoned "because Boltrig is just a wrapper around
  Codex" remains FORBIDDEN, the wrapper intuition having been rejected in VJS-CC-VJS 8 and not revived
  here.

  LIMB 2, INTERFACE NOT EXECUTOR. "Submit to Codex's subagent, profile and skill model" is lawful ONLY on
  the interface-not-executor reading, and only while enforced mechanically at the chokepoint rather than
  documented: Codex may EMIT a subagent/profile/skill request, but the KERNEL, and only the kernel, forks
  the cell that fulfils it (distinct uid, per-slot tmpfs, /proc-attested J5, peer-uid attested J8,
  audited). Codex's own native spawn facility must be INTERCEPTED and SUPPRESSED at the model-proxy
  chokepoint exactly as the tool ceiling strips exec_command (VJS-CC-VJS 4), asserted at startup and
  failing closed, not merely left enabled-but-unused by configuration. Any actual Codex-native sibling
  spawn, or effectful out-of-cell tool, is PR8 and does not open on this order. The bench notes the
  organisational gravity of "we are a Codex shop" pulls toward PR8, and the chokepoint enforcement exists
  precisely to resist that drift.

  LIMB 3, EGRESS IS A KERNEL-MEDIATED VERB. The settled chokepoint principle (egress is an effect) is
  applied, not newly entrenched. Provider-side search (a hosted model searching inside the model call) is
  permitted ONLY where the kernel can SEE and AUDIT both the outbound query and the inbound results on the
  kernel-owned model-proxy to bifrost wire, granted per-cell and failing closed, and only where the cell
  context crossing that wire carries the same tenant-isolation the model call already carries; returned
  search results are treated as a new untrusted inbound surface. Opaque provider-side search, where the
  kernel cannot read the query or the results on the wire, COLLAPSES INTO unaudited model-native egress
  and is FORBIDDEN until made auditable. A local browser-CLI is an effectful out-of-cell tool and is PR8
  by VJS-CC-VJS 8 K4; it does not open on this appeal. No model may perform egress or search carrying a
  cell context that may hold another tenant's data beyond what the governed model call already legitimately
  carries.

  CONTINUITY FLOOR. Because VJS-CC-VJS 5's containment ("held shut only by refusing to start a second
  cell") presupposes a runtime that can refuse, and because Codex 0.144.3 cannot yet self-attest its own
  provider or schema contract (production_ready False, VJS-CC-VJS 7 J13), the grant is conditioned on the
  manifest's multi-runtime ROUTING MECHANISM being retained as live code, and on at least one non-Codex
  governed leaf remaining buildable and re-wirable by configuration alone (no fresh order) as a quarantine
  fallback, until production_ready is unblocked on a fresh application under VJS-CC-VJS 4 F9. Runtime
  agnosticism survives as a CAPABILITY even where the wired vendor count is one.

  production_ready stays False on every limb. PR8 write-enable (effectful tools, sibling spawning, local
  browser-CLI, model-native egress) remains court-gated and does not open. The read-only reasoning lane
  (VJS-CC-VJS 2) is unaffected and may deploy.
