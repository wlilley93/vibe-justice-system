issue: codex_cell_uid_capability_grant_narrowed_on_re_application
holding: |
  Re-application GRANTED IN PART, ON CONDITIONS. CAP_SETUID and CAP_SETGID are permitted on the
  kernel container with the container user at uid 0. CAP_CHOWN is REFUSED. CAP_SETPCAP and
  CAP_SYS_ADMIN remain refused. no_new_privileges and read_only stay true. production_ready stays
  False.
  The court verified the applicant's evidence rather than accepting it. The s.5 demonstration is
  TRUE and was reproduced on the pinned image under the exact pleaded posture: the uid 0 supervisor
  holds CapPrm/CapEff/CapBnd 00000000000000c1, the forked child at uid 20001 holds CapPrm 0,
  CapEff 0, CapAmb 0, CapBnd ...c1, NoNewPrivs 1, and setuid to a sibling uid, to uid 0 and to
  uid 10001 each return EPERM. The H1/H2 finding is also TRUE and was reproduced: the pinned
  app-server dies with "failed to initialize sqlite state runtime" under a non-writable CODEX_HOME,
  which disposes of Option E as this court framed it in VJS-CC-VJS 6. H3, H5 and H11 are satisfied
  on inspection of codex_cell_boundary, codex_runtime_config_argv, deploy/codex/managed_config.toml
  and the explicit noexec,nosuid,nodev on the cells tmpfs in docker-compose.
  FACT FOUND (material, and it supplies the necessity the applicant failed to plead): a NON-ROOT
  Docker container cannot hold CAP_SETUID at all. Under --user 10001:10001 --cap-add SETUID
  --cap-add SETGID the permitted set is EMPTY and only the bounding set survives (CapPrm 0,
  CapBnd ...c0). The otherwise obvious alternative, a uid 10001 supervisor that setuids to the cell
  uid and then empties its own permitted set by capset before execve, is therefore unavailable at
  the runtime and not merely unsafe. Uid 0 is genuinely load-bearing for per-cell uids inside one
  container, and the court so finds.
  FACT FOUND (material, and it narrows the grant): CAP_CHOWN is NOT necessary. H6 offered CAP_CHOWN
  or the layout that avoids it and the applicant engaged only the first limb. The court tested the
  second. One tmpfs per cell slot declared with uid=, gid= and mode=0700 yields trees the kernel
  creates already owned by the cell uid; a forked child that setuids first populates its own slot
  and is refused EACCES on its sibling's slot. Nothing is given away, so nothing needs to be
  chowned. The applicant's own concession that a root supervisor holding CAP_CHOWN is a real
  primitive is correct, and the answer is to delete the primitive rather than to weigh it.
  HELD FURTHER, and part of the ratio: the s.5 REASONING as pleaded is WRONG and is disbelieved as
  put. An empty permitted set does not make the bounding set inert. The bounding set is precisely
  the ceiling on what an execve of a file bearing file capabilities may place in the permitted set.
  What makes it inert here is no_new_privileges alone. That matters because the kernel image ships
  eleven setuid-root and setgid binaries including su, mount and passwd on a rootfs that is not
  nosuid, so the whole property rests on one control. H7 ordered the bounding set cleared; it is not
  cleared and cannot be without CAP_SETPCAP, which is refused. The free substitute is ordered
  instead: strip the setuid and setgid bits at image build so the property rests on two independent
  legs.
  HELD FURTHER: the pleading understates its own cost, on the fifth such occasion. "The SUPERVISOR
  runs as root inside the container" is not what user 0 does. CodexCellSupervisor._spawn is an
  in-process asyncio spawn inside the uvicorn API process, so uid 0 would be the identity of the
  entire Boltrig API, the process that parses untrusted model output. The grant is therefore
  conditioned on real privilege separation: uid 0 confined to a minimal spawner, the API at uid
  10001 with an empty permitted set, both asserted at startup.
  HELD FURTHER: the per-cell ingress socket is an ABSTRACT unix socket and carries no filesystem
  permission bits, so distinct uids buy nothing at that surface by themselves. Peer attestation must
  additionally match the peer uid to the cell's uid once uids are distinct.
  On the comparison the court was asked to make: the status quo is not neutral. Under one shared uid
  VJS-CC-VJS 5 found as fact that hostile cell A obtains cell B's cross-tenant bearer with no race
  and no defect in the attestation logic, held shut only by a runtime refusal to start a second
  cell. The narrowed posture ordered here, root confined to a spawner, two capabilities, cells at
  distinct uids with empty permitted sets, is preferred to both the status quo and the posture as
  pleaded.
