summary: |
  Re-application GRANTED IN PART on conditions. CAP_SETUID and CAP_SETGID permitted with the
  container at uid 0; CAP_CHOWN REFUSED as unnecessary. The court reproduced the s.5 proof exactly
  and the H1/H2 finding that app-server will not run under an unwritable CODEX_HOME, so Option E is
  dead. Two facts the applicant did not plead decide the shape of the order: a non-root container
  cannot hold CAP_SETUID at all (permitted set empty, bounding only), which supplies the necessity
  for uid 0; and per-slot tmpfs mounts declared with uid= and mode=0700 plus provisioning from a
  forked setuid child remove any need for CAP_CHOWN, which H6 had expressly offered as the
  alternative limb. The s.5 reasoning is disbelieved as put: an empty permitted set does not make
  the bounding set inert, no_new_privileges does, and the image ships eleven setuid-root binaries,
  so the setuid bits must be stripped at build. The pleading also understated its cost for the fifth
  time: the supervisor is an in-process spawn, so user 0 would have made the entire API root. Root
  is therefore confined to a minimal spawner, the API drops to uid 10001 with an empty permitted
  set, and both are asserted at startup. production_ready stays False.
