runtime_summary: >
  Sequencing to multiplayer Codex: trusted-first prevails and a production-walled trusted read-only
  bearer mint (from the child's real /proc identity, no SO_PEERCRED cross-check) is LAWFUL because
  [2026] VJS-CC-VJS 1 is production-scoped and the trusted path preserves the no-key-in-cell
  guarantee - but only under mandatory test-enforced fencing: dev-auth + trusted flag + fail-closed
  under any prod signal (D1); no real key in the cell, proxy injects it (D2); real /proc identity,
  never fabricated, marked non-attested (D3); production_ready stays False under allow_test_only
  (D4); maps 1:1 onto the SO_PEERCRED swap, single-uid only (D5); read-only, PR8-gated writes (D6).
  Build the shared path in trusted mode first, then harden to full SO_PEERCRED multi-tenant isolation.
