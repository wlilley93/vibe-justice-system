runtime_summary: >
  Q1-Q3 REFERRED UP: a County court cannot void a Privy Council order ([2026] VJS-PC 20 is affected)
  nor fix the reach of the PC-16 ratio. Q4 ANSWERED and severed. Two surfaces claiming to validate
  orders never run verify_bench, and local_ci iterates lawpack.orders alone, so NO County order has
  ever been in its scope. Rule stated: a check reporting a broader result than it computed is WORSE
  than no check. Repairs staged by blast radius: fix the single-file `order validate` now (D1); make
  local-ci run the check within its existing scope now (D2); STAY the widening to .vjs pending the
  referral, since it pre-empts Q1 (D3); correct misleading names and outputs now (D4). CC-OPBOX 2 is
  NOT in the affected class, its opinion exists and only its path is wrong; repair it separately (D5).
