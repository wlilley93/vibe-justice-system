id: "2026-VJS-CC-BLIND-VALIDATORS-011"
assent_source: standing_bounded_assent
citation: "[2026] VJS-CC-VJS 11"
title: Two validators that never ran their own check; Q1-Q3 referred up, the repair severed and staged
court: county
jurisdiction: vibe-justice-system
status: binding
issue: bench_opinion_absent_and_the_blind_validators
question: >
  Are thirteen binding orders declaring a bench with no source_opinion void ab initio under PC-16, or
  routed for correction, and may the blind validation surfaces be repaired independently?
holding: >
  Q1, Q2 and Q3 are REFERRED UP and this court decides nothing on them. One affected record is
  [2026] VJS-PC 20, a three-seat Privy Council order; a County court has no competence to declare a
  Privy Council order void, nor to determine the reach of the [2026] VJS-PC 16 ratio. The referral is
  not a dismissal: the questions are properly framed, the facts were established by seeded test
  rather than argument, and the matter is urgent because thirteen records of uncertain status are
  relied on daily. The reference discloses that its filer benefits from reading B; that disclosure is
  correct and does not affect a referral that turns on competence alone.
  Q4 is SEVERABLE and is answered. Whether a command named `order validate` should validate an order
  does not depend on what becomes of the thirteen. On any reading, a validator that cannot detect a
  constitutive defect is defective. Three surfaces claim to validate an order; one runs
  `verify_bench`; two check three emptiness conditions and then report in language that asserts far
  more than was computed. The seeded case is decisive: the same bytes return `Order validation: OK`
  from one surface and `[Fatal] BENCH_OPINION_MISSING` from another. Aggravating and not pressed in
  the reference: `local_ci` iterates `lawpack.orders` alone, so NO County order has ever been within
  the scope of that stage, in any run, in any clone. On this subject matter it is not a gate at all.
  The court states the rule the realm keeps meeting in new forms. A check that reports a broader
  result than it computed is WORSE than no check, because it consumes the attention that would
  otherwise notice the absence. A green is not evidence; a check that cannot fail is not a check;
  and now, a check that answers a question it never asked. The remedy is not only to widen it but to
  make its NAME and OUTPUT describe what was actually computed.
  The repairs are separated by blast radius, because widening the push gate today would turn the
  estate red on the thirteen and convert a referral into a stoppage, achieving by remedy what this
  court lacks competence to order directly. The single-file command blocks nothing and is repaired
  now; the push gate runs the check within its existing scope now; its widening to the .vjs roots is
  STAYED pending the higher court, that being the step whose outcome depends on Q1.
  [2026] VJS-CC-OPBOX 2 is NOT in the affected class and the court so finds. Its opinion exists and
  is intact in lawpack/v2/judgments; the order records a bare filename where `verify_bench` resolves
  `repo.join(p)`. The seat is not silent and the record's integrity is not in question. Correcting a
  path to a file that already exists changes no law and is within competence.
directives:
  - id: D1
    actor: lexby
    must: repair_vjs_order_validate_now_to_run_verify_bench_against_the_courts_constitution_and_the_orders_declared_source_opinion_it_is_a_single_file_command_that_blocks_nothing_and_its_repair_cannot_brick_the_estate
  - id: D2
    actor: lexby
    must: make_local_ci_order_validate_run_verify_bench_over_the_orders_already_within_its_scope_now_without_widening_that_scope
  - id: D3
    actor: lexby
    must: stay_the_widening_of_local_ci_order_validate_to_the_vjs_governed_record_roots_until_the_higher_court_disposes_of_q1_to_q3_because_that_widening_pre_empts_the_referral
  - id: D4
    actor: lexby
    must: correct_the_name_and_the_output_of_every_validation_surface_so_it_states_what_it_actually_computed_and_never_reports_orders_valid_for_a_three_field_emptiness_check
  - id: D5
    actor: lexby
    must: repair_the_source_opinion_path_on_2026_vjs_cc_opbox_control_boundary_contrast_002_from_a_bare_filename_to_its_repo_relative_path_immediately_and_separately_so_it_is_not_swept_into_the_referred_class
forbidden:
  - widening_the_local_ci_order_validate_scope_to_the_vjs_roots_before_the_higher_court_disposes_of_q1_to_q3
  - treating_this_order_as_deciding_anything_about_the_validity_of_the_thirteen_records
  - reporting_a_validation_result_broader_than_the_check_actually_performed
  - deleting_or_amending_any_of_the_thirteen_records_to_make_a_widened_gate_pass
supersedes: []
