decision: 'Implemented the Principal''s register-scope decision and the order-document improvements. (1) County Court orders off the register: recorded the rule as DEC-007 (the register and published lawpack carry the realm''s law and the binding precedent of the Privy Council and Supreme Court; County Court orders are repo-level/operational, recorded as shadow orders under .vjs/court/orders, not in the register; a load-bearing County principle gets lasting force only as an Act, Regulation or SI, or by a higher court). Moved the four County Court orders (BOOT-012 permit-hardening, CC-ORDER-SCHEMA, CC-ROUTE-EVAL, CC-WORKPLAN) to .vjs/court/orders and retired their PDFs; their principles already stand in DEC-006, REG-COURT-RECORD-001 and the permit-enforcement code, so no law is lost. PC-8''s appeal_of the now-shadow CC-ORDER-SCHEMA drops gracefully (the gazette drops edges to non-items); PC-8, the constitutive-operation-test ruling, stays. The register fell from 99 to 95 items; no County-tone orders remain. (2) Order documents now render as native cream HTML (the order''s full text - holding, directives, forbidden) instead of white embedded PDFs; all order PDFs retired. Each order carries a plain-language ''In plain terms'' section at its foot (the runtime_summary elevated from a trailing comment to a styled box) - the Lexby translation the Principal asked about. (3) The register status chip is smaller and moved from the top chip row to the citation/subheader line. Validation OK, 73 tests green, gazette regenerated.'
