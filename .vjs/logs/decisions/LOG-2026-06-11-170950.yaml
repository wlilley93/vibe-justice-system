decision: 'Fixed two Gazette display faults the Principal flagged. (1) The constellation: ''Governance (The Order)'' (the boot docket origin BOOT-001) was still flung far from the rest of the map. Root cause: d3''s default link strength is 1/degree, so a high-degree hub holding eleven docket spokes is left only weakly tethered to the graph by its single lineage edge, and the charge flings the whole cluster to the periphery. Fixed by setting a solid near-uniform link strength (thread spokes 0.8 hold the docket wheel tight; every other edge 0.5 holds its cluster anchored), applied in both applyEstateLayout and the spread control. Verified at high spread: the cluster stays integrated near the constitution acts. (2) The Acts of Union page (BILL-1, a v1 archive act) showed a white box: the PDF serves correctly (HTTP 200) and the page renders, but the inline embed element did not paint the PDF - the same inline-PDF weakness that moved orders to HTML. The v1 archive items have no markdown source, so they stay PDFs, but the embed is replaced by an iframe, which uses the browser''s built-in PDF viewer reliably; the fallback open-directly link now opens in a new tab. Display only.'
