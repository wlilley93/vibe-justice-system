decision: 'Two display-only citation refinements, both following the legal convention that the neutral citation lives beside the title, not inside it. (1) Acts: the title keeps the year and short name (''[2026] - Constitution and Sources of Authority Act'') and the official series ''[2026] VJS-ACT 1'' is restored to the meta line and the copy-citation, so the realm series is shown officially without crowding the heading (the Principal''s choice between three rendered options). (2) Court cases: order and judgment titles now drop the citation prefix entirely and read as the matter name alone (''The Embedded Corporate Jurisdiction (Vibe Policy System)''), because the neutral citation (''[2026] VJS-PC 10'') already sits on the meta line directly beneath the title - this is the UK law-reports convention (a case is named by its matter; the neutral citation is shown separately). Instruments keep their citation prefix; acts keep the year. All display only via displayTitle/displayCite in the three pages; the enacted citation series remain unchanged on the machine records and in the lawpack.'
