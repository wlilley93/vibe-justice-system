why: 'vjs next-citation handed out HELD citations on two series: [2026] VJS-CC-VJS 1, and [2026] VJS-PC 20 which a live precedent holds. live_citation_max read lawpack/v2 alone, which carries 86 defining citations and not one County one, so it returned 1 unconditionally while the CC series stood at 8. Roots now derive from front_door::is_governed_record, the existing declaration of what a governed record is, not config.toml which has no court key. Both front doors changed together per D4. The .exists() short-circuit to 0 is gone: a missing directory is not evidence a series is unstarted. The gate asserts BOTH a CC and a canon PC series and is proven RED; a CC-only test would have passed against the PC half. check_citation_uniqueness reads the same single root and is deliberately untouched, because widening it would report the orders-versus-court mirror pair as fatal, and which projection is the record is first-impression.'
