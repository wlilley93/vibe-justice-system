decision: 'The hooks legislation now enforces in the agent harness, not only at commit. The kernel''s pre-write hook is PERMIT-AWARE (evaluate_governed): a governed write under an active, unexpired, in-scope permit passes silently; an unpermitted one fails closed naming the file, with the route as the remedy. The governed surface has ONE definition: the jurisdiction''s own permit_required and permit_exempt lists from .vjs/config.toml, classified by the same PathClassifier the commit gate uses (the old hardcoded component list missed config-governed files like VJS.md and survives only as the no-config fallback). A thin adapter (.vjs/hooks/claude-pre-write.sh) reads the Claude Code hook payload, relativises the path to the repo, and execs the kernel; project .claude/settings.json wires SessionStart (the kernel reminder) and PreToolUse on Write, Edit, MultiEdit, and NotebookEdit to it. Pipe-tested all three classes: config-governed without permit blocks exit 2, permitted governed passes 0, ungoverned passes 0. The in-session firing awaits one /hooks open or a restart (the settings watcher does not pick up files created mid-session); the git-side gates remain live regardless.'
