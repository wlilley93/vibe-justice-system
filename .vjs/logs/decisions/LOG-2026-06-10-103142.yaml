decision: 'The Realm Invariants and Machinery Instrument 2026 is COMMENCED on the Privy Council''s construction. Convened on the registrar''s own motion, the Council held 2-1 ([2026] VJS-PC 7, Justice C dissenting in full on the record) that the Sovereign''s entire and immediate reply, the single word go, given in answer to a digest-pinned presentment stating that the draft alone remained, is express, antecedent, external assent within CASE-LAW s.23; the holding is confined to that exact posture and generic directives remain never assent (declining proceed-all yesterday was correct). The lifecycle gates ran in order: the assent event is recorded digest-pinned quoting the Sovereign verbatim and citing the ruling; the instrument lodged verbatim from the filed draft under the Framework Act SI power; the Gazette entry and lawpack adoption followed. Its effect is applied: the register now carries legislation and case law only (102 items); the 42 machinery records (28 invariants, 5 obligations, 4 rules, 5 specs) are read as Schedules 1 to 4 within the instrument''s own entry, carried in full; the kernel''s loading and enforcement of every scheduled record is unchanged in force, severity, and effect (the suite proves it: the record-completeness test now requires every machinery id in the schedules and forbids it as a separate register item).'
