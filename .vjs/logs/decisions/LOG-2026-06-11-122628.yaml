decision: Reworked the constellation link-hover tooltip to match the node hover cards. The old tip was a dark navy bar with harsh yellow node names; it is replaced by two paper mini-cards - one per endpoint - each carrying the kind chip and the document title in the record's tone colour (the same paper/ink/tone-left-border language as the node hovercards), with the association verb and a directional arrow in a connector between them. So hovering REG-TRANSITION-CONTINUITY-001's cite edge now reads as two cards, 'Transition and Continuity Regulation' [cites ->] 'Realm Consolidation and Reconciliation Framework Act', rather than a cramped yellow-on-navy line. The thread verb now reads 'same docket as' to match the hub docket model (cite -> 'cites', lineage -> 'descends from'). Display only; verified by a rendered preview of the card pair.
