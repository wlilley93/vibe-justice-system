decision: 'Removed the fixed short distance on the docket-thread connecting lines in the constellation. The boot docket threads were pinned at distance 14 regardless of the spread slider; so as the Principal opened the spread, the boot series stayed a tight knot while the rest of the map expanded, and the single lineage tether flung ''Governance (The Order)'' and its cluster to the edge - too far away. Now every connecting line, the docket threads included, scales with the spread multiplier; the hub model (each docket member links to its origin, not to its predecessor) keeps the series a wheel rather than the old tail without needing a fixed short distance. Verified: at default spread the boot series is a clean wheel around its origin with no tail; at high spread the boot orders distribute with the rest of the map instead of clumping into a flung knot. Display only.'
