decision: 'Archival robustness: the Gazette renders offline and trusts no third party. force-graph v1.49.5 is vendored and pinned (assets/vendor/, MIT banner, upstream sha256 recorded in the header and the vendor README; the unpkg tag served unpinned latest, an unacceptable dependency for a record); a test forbids any remote script src on either page. Print stylesheets make the Law Reports page print as a law report (white paper, black rules, URLs printed after external links, details opened on beforeprint, the provenance footer on every printout) while the constellation prints a pointer to it. noscript blocks state the trust position: the record itself needs no JavaScript - the lawpack, the archive citator, the JSON twin, and the Atom feed. Accessibility: the classic page''s filter bars no longer steal keyboard focus on re-render (built once, updated in place), carry group roles and aria-pressed, and announce result counts politely; the reading panel is a labelled dialog. OpenGraph, canonical, and feed-discovery metadata on both pages.'
basis:
- PERMIT-1781038814
risk: low
reversibility: easy
court_required: false
why: A record that needs a CDN, a mouse, and a screen is not archival. 57 tests green including the new self-hosting guard.
