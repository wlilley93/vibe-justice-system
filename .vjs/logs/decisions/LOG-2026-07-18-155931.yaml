id: LOG-2026-07-18-155931
time: 2026-07-18T15:59:31.761766361+00:00
actor: lexby
kind: implementation-decision
issue: codex-proxy-ingress-auth
decision: 'Adopt Option C: SO_PEERCRED (unix-socket AcceptedUnixPeer) attests the Codex auth-helper and gates bearer ISSUANCE; the loopback TCP model-call proxy authenticates each request by a short-TTL, single-cell bearer (find_active_by_id), binds 127.0.0.1, and injects the kernel-only upstream key.'
basis:
- '[2026] VJS-CC-VJS 1'
risk: high
reversibility: easy
court_required: false
why: The pinned Codex 0.144.3 config uses a TCP base_url, so per-call SO_PEERCRED (Option A) is infeasible without patching upstream Codex, and /proc/net/tcp peer resolution (Option B) is TOCTOU-racy caller-provenance the model-proxy contract expressly forbids. Option C reconciles the SO_PEERCRED-needs-unix-socket constraint with Codex's TCP reality by moving the peer attestation to bearer issuance over the helper's unix socket, matching the config's existing helper+proxy shape, while bounding the residual bearer-replay window with a short TTL, single-cell binding, and loopback-only bind. Read-only cutover only; the write/effects phase stays PR8-gated.
