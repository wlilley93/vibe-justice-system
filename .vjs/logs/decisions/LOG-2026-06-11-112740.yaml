decision: 'Fixed all three defects surfaced by the publishing-flow arc. (1) log from-permit is hardened: a decision log may only be written from a LIVE permit - active status and unexpired, failing closed on an unparseable expiry, mirroring the permit gate''s rule. This closes the stale-linkage class where a route returning court_required issues no permit and a caller grabbing the newest permit file silently links the log to an unrelated permit; verified by negative tests (an expired and a closed permit are both refused with the reason in the error) and the positive path (this very log). (2) The publishing machinery and the public record surfaces are now governed paths: scripts/**, PUBLISHING.md, the three html renderers, .vjs/config.toml itself, and the publication denylist - the boundary pass and the law of the boundary can no longer be edited without a permit (the PATH-UNGOVERNED warnings this beat closes fired on exactly these). (3) The promote script''s secrets exclusion is narrowed from words (synthetic, a filename) to the literal fixture token only, so a real secret on a line containing the word synthetic can no longer slip the check. 73 tests green, 0 clippy warnings.'
