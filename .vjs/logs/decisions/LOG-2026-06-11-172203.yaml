issue: ROUTE-20260611-172203
decision: 'Extended SPEC-KERNEL-002''s contract with an attestation clause: a conforming kernel MAY provide ed25519 officer signing (a verifiable signer behind the signer seam, key rotation and revocation, a revoked key fails closed) and external anchoring (publish the chain head to a timestamping authority, record the receipt, verify a fact as-of a time without trusting the mutable tail) as feature-gated extensions that never touch the model-free or no-default-network posture. The reference kernel kern reached v0.2.0 shipping both behind the ed25519 and anchor features, 23 tests green; the deterministic default core stays serde+serde_json+sha2 with no network. Additive only - the core contract (determinism, model-free, digest-pinned law, error-with-citation) is unchanged.'
basis:
- PERMIT-1781198523
risk: low
reversibility: easy
court_required: false
why: kern's v1.1 hardening shipped; the canon's kernel-contract spec should record the capabilities a conforming kernel may now offer.
