decision: 'Exercised the court ladder on a genuine first-impression question and dogfooded the new court record. The real question that arose in A2 (is extending the canonical order schema and enacting REG-COURT-RECORD-001 court MACHINERY or does it touch the courts CONSTITUTION?) was put to an independent County Court on a symmetric case file with no access to the registrar''s preference. Ledgerward CCJ (single judge) disposed the operational limb (machinery, valid under s.7) and granted permission to appeal on the dividing-line point ([2026] VJS-CC-AGENT-UNIVERSE-V2 14). An independent Privy Council of three (Marchmont, Tindale, Rowanne) heard the appeal and AFFIRMED 3-0, settling the constitutive-operation test as binding doctrine: a measure is constitution only if it alters who sits, bench size or parity, jurisdiction or tier, or the assent rule; everything else, including how a court records what it did, is machinery within the s.7 power, provided it stays optional, prospective and validity-neutral ([2026] VJS-PC 8, appeal_of the County order). Both rulings carry the structured court record REG-COURT-RECORD-001 requires: the bench, the vote, and the same case_file_digest (sha256:ef75c15b...) pinned by vjs court record before each order issued; the convenings are filed under .vjs/court/convenings. This is the first real County-to-Privy-Council appeal and the first general (non-founding) doctrine in the corpus. A tooling fix gives each convening id its court so same-second records do not collide. 69 tests green; the order PDFs and gazette regenerated; register 92 items.'
