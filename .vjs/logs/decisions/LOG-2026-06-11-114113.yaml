issue: ROUTE-20260611-114113
decision: Hovering a line in the constellation now identifies the association and its direction. A tooltip names the relationship by citation (for example '[2026] VJS-PC 10 cites -> ACT-007'; lineage reads 'descends from', threads read 'threads to'), and a directional arrowhead appears on the hovered link pointing source to target - a cite points at the authority it relies on - coloured to match the link type. The hovered link also brightens and widens so the line under the cursor is unambiguous. linkHoverPrecision is raised so thin lines are hoverable. The vendored force-graph already supports the four APIs used; no library change.
basis:
- PERMIT-1781178073
risk: low
reversibility: easy
court_required: false
why: The Principal asked that the association label on link hover carry an arrowhead so the direction of the relationship is visible.
