decision: 'Constellation polish, five changes. (1) Focus stays put: a graph node click while already focused now inspects only (panel updates, the map does not re-lay-out); focus moves only on a deliberate act (entering focus from the whole map, a list/search/link/association click, or the new ''Re-centre here'' control), so walking surrounds no longer disturbs the local map. (2) Nodes are stronger and more obvious: larger base radius, solid saturated tone fills with a crisp darker rim, a smaller paper core only on the biggest hubs. (3) More default spread (charge 300) and a wider range. (4) The spread slider moved out of the right-coverable legend into the always-visible topbar, so it stays reachable while a record is open. (5) The primary CTA is now pure black, bold, full-width and labelled ''Open Record'', and a square-with-diagonal-arrow open-record icon sits beside the panel title; both open the document. The single GitHub reference per page is preserved (test green).'
