why: 'Every seed fires and discriminates: removing the denylist limb reds only C1, restoring the .md skip reds C1 and C2, and disabling the linked-body scan reds only C5. One seed silently MISSED because my shell escaping broke the replacement and the test stayed green; I caught it because the anchor count did not change, and every later seed asserts its anchor is present before running. Two implementation errors were caught by the existing suite rather than by me: source_opinion paths are relative to the repository that OWNS the canon, so resolving them against the publishing repo refused every subscriber, and the e2e harness copied only the canon so it had no register. The seven fixtures that broke are all jurisdictions built the way vjs invoke builds one, which is a live gap now filed.'
