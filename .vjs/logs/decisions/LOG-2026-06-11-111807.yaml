decision: 'Tightened the publishing flow for the public repo. Previously the working branch pushed straight to the public origin and sat at the same tip as master and vjs-canonical, so drafts were published the moment they were pushed and canonical meant nothing. Now: (1) drafting lives privately - working branches go to the new private dev remote (vibe-justice-system-dev) and never to the public origin, because on a public repo push equals publish and history retention makes draft exposure irreversible (the SC-11 exposure is the precedent); (2) master is the integration line, public, gated by the ordinary hooks; (3) vjs-canonical - already the default branch and the Pages source - moves ONLY via scripts/promote-canonical.sh, which runs a boundary pass over everything the promotion would newly publish (private-record paths, high-confidence secret patterns, the hashed publication denylist, dev-machine paths, vjs validate) and then fast-forwards; (4) both public branches carry GitHub branch protection (no force-push, no deletion, admins included). The cited PC 25 precedent does not resolve in the record; the precedent actually on file and cited in PUBLISHING.md is the publication-boundary line: BREACH-2026-06-10-client-data-published and its cure, the vjs gazette publication gate, and the hashed denylist. The working branch is being removed from the public origin after this lands through the new flow itself.'
