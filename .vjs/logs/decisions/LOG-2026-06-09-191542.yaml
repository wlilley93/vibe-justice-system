decision: 'The Gazette is now generated, not hand-curated: vjs gazette walks every law object in the lawpack (nothing can be curated out of the record), overlays editorial summaries/points/edges from lawpack/v2/provenance/gazette/editorial.yaml (presentation only, never force), appends the curated frozen V1 estate from v1-estate.yaml (paths existence-verified against the v1 branch), and emits gazette-data.js. Link bases are the branches that exist on the public remote: blob/master for V2, blob/v1 for V1 (the old graph linked blob/main, which 404s). A citation edge may only point at an item: section cites collapse to their parent act, the unresolvable are dropped (208 edges stand). A testkit test fails the build if law changes without regeneration, if any edge points at a non-item, if any V2 path is missing, or if any URL is on a wrong branch.'
basis:
- PERMIT-1781032528
risk: low
reversibility: easy
court_required: false
why: The Gazette pages need one truthful data source; the prior graph embedded a hand-curated node list with dead links. 141 items across both estates.
