why: 'Constitutively inert under REG-GAZETTE-CONTINUITY-001: publication changes no law and mints no assent. The regeneration is required because the meta block binds the publication to the lawpack digest, and D4 changed how that digest is computed from a hash of manifest.toml alone to a hash of the whole lawpack tree. Leaving the published artefact on the old digest would have left the Gazette asserting a binding to a lock that no longer exists, which the gazette_publication test catches and did catch. 114 items, unchanged in content; only the digest and the derived files move.'
