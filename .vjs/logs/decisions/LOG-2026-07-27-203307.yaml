decision: Bound check_citation_uniqueness to the same register as the allocator and collapsed by record id, per [2026] VJS-CC-VJS 9 D1-D3.
basis:
- PERMIT-1785184264
risk: low
reversibility: easy
court_required: false
why: 'The allocator read all three governed-record roots; this guard read lawpack/v2 alone, where it could see no County order in the estate. A guard narrower than the allocator passes collisions the allocator can mint, so one half was wrong by construction. Both now call front_door::governed_record_roots. D2 required collapsing by record id first, because two files sharing an id are one record in two projections; keying on the file would have reported every projection pair as a fatal collision, the outcome CC-VJS 9 held unacceptable. Proven red in both directions as D3 requires: a distinct id in .vjs/orders claiming a citation held in lawpack/v2 now produces two CITATION_COLLISION fatals, one per colliding record, and removing it returns the estate to zero. The finding path is now repo-relative, since a lawpack/v2 prefix is wrong for a .vjs root.'
