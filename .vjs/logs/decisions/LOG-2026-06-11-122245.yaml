decision: 'Changed the docket-thread model in the gazette generator from a chain to a hub. Orders that share a subject family (the boot slate shares the vjs-v2 docket) were threaded each-to-its-predecessor via windows(2), producing a single-file chain that the force layout streamed off the cluster as a long tail. That sequential model is false for a slate: the twelve founding boot orders were passed together, so BOOT-005 (MCP) does not follow from BOOT-004 (Logs); they are siblings of one docket. The generator now threads every docket member after the first to the docket''s ORIGIN (its first entry), so a docket circles its first order. Verified: BOOT-002 through BOOT-011 all thread to BOOT-001, and the render shows a tight rosette around Governance (The Order) instead of a tail. A genuine appeal remains a separate relationship carried by appeal_of, untouched. 73 tests green.'
basis:
- PERMIT-1781180565
