why: 'The Principal instructed development proceed without returning to the client, and holds Parliament, so legislating is lawful where overruling a precedent is not, and the bench cannot sit until the usage limit resets. Drafted on the two-condition design VJS-CC-VJS 2 already validates: an explicit off-by-default superadmin flag PLUS an observed production-signal refusal, because a flag alone lets the constrained party remove their own constraint. It removes the CLICK, not the RECORD. Filing it INTO lawpack routed court_required/first_impression, so it sits under docs/proposals binding nothing. One measured finding decides whether enacting it helps: Classical Visas returns NO production signal despite serving a real client on a public domain, so a test keyed on that signal admits it because of an unset env var, not because it is in development.'
