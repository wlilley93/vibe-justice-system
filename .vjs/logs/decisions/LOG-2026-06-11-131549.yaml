decision: In the constellation's list drawer, each row's lineage dropdown lists related records (derives force from / same docket / relied on by) as buttons. Hovering one of those buttons now previews THAT related record's hover card in the same place the row's card occupies, so the reader can scan a record's relations without leaving the list; leaving the button reverts the card to the row's own record. Implemented by adding mouseenter/mouseleave to each related-item button that calls showHoverCard with the related record (on enter) and the row record (on leave), anchored to the row's right edge so it replaces in place. Verified by simulating the hover. Display only.
basis:
- PERMIT-1781183749
risk: low
reversibility: easy
court_required: false
why: 'The Principal: hovering a button like this should create a hover card that replaces the hover card currently in state for the item in the list.'
