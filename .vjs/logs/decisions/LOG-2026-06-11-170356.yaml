decision: 'Hardened PC-11''s mandated deployment-bundle verify from a reference Python script into a first-class kernel command. vjs bundle verify <bundle.lock> parses the TOML manifest and runs REG-BUNDLE-001''s checks fail-closed: every component carries id/repo/digest/source_commit/licence/adoption_mode; every digest is a well-formed sha256; and the AGPL/MIT licence firewall holds (a copyleft component into a permissive distribution boundary only as vendored-restamped-readonly). The validation core is a pure function (verify_bundle_manifest), unit-tested four ways (well-formed pass, firewall breach, missing field, malformed digest); the command resolves the path against the repo and errors via KernelError on the first violation. Verified: the reference governance-house bundle passes (3 components, firewall holds), and a monorepo-package breach exits non-zero. REG-BUNDLE-001 now names vjs bundle verify as the first-class verify, with scripts/bundle-verify.py as the portable reference. 77 tests green.'
