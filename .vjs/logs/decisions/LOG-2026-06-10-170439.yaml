decision: 'Entered [2026] VJS-PC 9 and executed it. On the Principal''s direction that CASE-LAW is V1, an independent Privy Council of three (Marbury, Calder, Ashby) was seated on a symmetric two-sided researched record with no access to the registrar''s preference, and held unanimously (3-0): CASE-LAW, an untouched V1 document, may not be cited as live binding V2 authority; under ACT-001 s.4 and ACT-COMPUTER-FIRST-REALM s.6/s.8/s.9 V1 binds V2 only by express incorporation, and a citation ''CASE-LAW s.X'' is reference, not incorporation. The remedy is the court''s own VJS-PC 4 route: a governed, meaning-preserving clerical pass. Executed: every ''CASE-LAW s.X'' in the six binding records (the Computer-First Realm Act, INV-ASSENT-SOURCE-001, the courts-constitution order, VJS-PC 3/4/7) is struck and re-grounded by its true V2 source - the assent floor to ACT-COMPUTER-FIRST-REALM s.23 and INV-ASSENT-SOURCE-001 with true source [2026] REALM-SC 10; the court-geography articles to [2026] REALM-SC 1 and REALM-SC 6; the V1 document named as V1 where it is the subject (PC-3, PC-4). The entrenched assent floor is SAVED, not repealed: only the citation form and pedigree change, no legal meaning altered (validation OK). The principle-20 gate now fails closed on any ''CASE-LAW s.X'' to a court-made SC article in all records. The ruling carries the structured court record REG-COURT-RECORD-001 requires (bench, vote 3-0, the pinned case-file digest); the convening is filed. This also corrects the live confusion REALM-SC 11 displayed when it purported to enact CASE-LAW s.24. 69 tests green; register 94.'
