decision: 'Broadened the corpus with two general-purpose subordinate regulations, made under the Framework Act s.7 statutory-instrument power on standing bounded assent (no fresh Sovereign assent; primary law is untouched). REG-COURT-RECORD-001 turns the A2 court infrastructure into a duty: every order issued from its commencement records the deciding bench and the case_file_digest (sha256 of the symmetric case file), recorded by vjs court record before the order issues; it is strictly additive (anti-Henry-VIII s.7), binds prospectively, changes no bench size, jurisdiction, or the assent rule, and does not invalidate the legacy 22 orders for want of the structured fields. REG-DEV-CONDUCT-001 codifies, for any adopter, the day-to-day operating model that until now lived only in doctrine: governed load-bearing work routes for a permit; reversible low-blast work is a decisive call plus a one-line work-log note; a genuine fork convenes the named court on the agent''s own motion, never the Principal. Both validated under the now-armed INV-LAWMAKING-001 (authority, status, kernel_effect present) and the assent-source allow-list; the route returned court_required false (the SI power is on point, not a fork). Register is now 90 items; 69 tests green.'
