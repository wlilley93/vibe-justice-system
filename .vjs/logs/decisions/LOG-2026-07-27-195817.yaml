why: 'Three comments certified that the allocator reads the LIVE persisted register, the citator index. It never did. After 5277a74 it reads the three governed-record roots and takes the highest N off each record''s own top-level citation field. Condition 2 requires that false statement struck from committed source: 5277a74 corrected the code and left the certification standing, so the kernel still asserted a PC-13 D2 compliance it did not have. The order named two sites. A grep found a third, crates/vjs-core/src/citation.rs, which also said the register comes from the lawpack, wrong twice over. All three now state what the code does. Comment-only. The behaviour is already locked by allocator_register_evals.rs and the in-crate case, so this adds no gate: the guard existed, only the description was false. K-25 failed on the edit and was re-locked.'
