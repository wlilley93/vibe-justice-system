decision: 'Filed a void first draft of the Subscribing Jurisdiction and External Supremacy law, advancing the Principal''s open item as far as is lawful without enacting: drafting is not assent, so this is offered for committee adoption and the Sovereign''s digest-pinned assent, never self-commenced (the cured breach of 2026-06-09 is the controlling lesson). It is grounded in the persuasive authority of [2026] REALM-SC 11 and the federation statute ACT-007, and states the concept in its proper legal name - accession with supremacy (primacy), the dualist model by which a jurisdiction joins a higher legal order and its own Sovereign gives that order''s law domestic supremacy (the European Communities Act 1972 shape). The draft sets out: an open question of tier (supremacy is likely primary law needing Sovereign assent; the mechanics are plausibly subordinate); accession as the subscriber''s own Sovereign''s act; supremacy with three reservations (the local entrenched constitution, the accession act, and the external-law floor of REALM-SC 9); the safe content-addressed mechanism (pin the canonical sha256; load only digest-matching law, fail-closed; lockstep by assent; never a vendored or stale copy); the two lawful shapes (a re-skinned client rendering live under the six REALM-SC 11 conditions, or a digest-pinned subscribed jurisdiction); and that a database-backed subscriber is lawful because publication is inert, the database a projection of the verified canon. Applying the boundary duty by hand, the draft was scrubbed of the client name (described generically as the server-of-law judgment and the subscriber local form) so no client identifier sits even in the working record. The local form will be built to whatever the lodged law prescribes. Draft digest 5e80ac... (pre-scrub) reconciled after the scrub.'
