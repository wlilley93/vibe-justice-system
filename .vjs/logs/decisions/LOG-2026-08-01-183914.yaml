decision: Implemented CC-VJS 16 C1, C2 and C4, and CC-VJS 17 C4. The MCP record verb now writes through Store::write_order to .vjs/orders, the same door vjs order apply uses; no production source under crates/ creates the canon directory; vjs_mcp::build_context is deleted and both doors build one graph in vjs-engine that overlays the local order register; and the Gazette publishes a repo-relative lawpack directory or omits the field.
