why: 'Both red seeds were run and both fire discriminatingly: restoring the hardcoded canon-tree write reds the two write-target assertions, and removing the overlay reds only the one-graph test. The Gazette had been REFUSING since CC-VJS 15 introduced the absolute-path field, so the committed artefact was six rulings stale while its page rendered today''s date; it now regenerates clean, carries the current digest and source commit, and contains no absolute path. Two binding rulings met at the artefact''s path field: CC-VJS 15 C4 required it to record the tree it read, CC-VJS 17 C4 forbids an absolute path, and an out-of-tree subscription has no repo-relative form. C17 C4 expressly authorises omission, so the CC-VJS 15 test is narrowed rather than deleted and the tension is filed for the court.'
