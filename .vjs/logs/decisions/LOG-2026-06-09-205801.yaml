decision: 'The Gazette''s credibility surface: vjs gazette now emits a meta block binding every publication to the record it was generated from (lawpack id and digest parsed leniently from .vjs/lawpack.lock, whose on-disk keys differ from the Store struct; the generating commit; estate counts), a plain gazette-data.json twin for tooling, and gazette.xml, an Atom feed whose entry ids are the lawpack''s own ids and whose dates come from enactment and amendment history (a second one-pass git log), so regeneration on unchanged law is byte-identical and subscribers see no synthetic churn; the inertness clause rides the feed''s rights element. Per-item assent_source is echoed only when the law declares it (the Gazette must not mint assent; a test enforces identity per item against the source YAML). Both pages carry a provenance colophon leading with the inertness sentence; cards and the panel show assent chips; cards gain History links; the classic page gains the Latest strip with the Subscribe link and a Timeline sort grouping the record by day. Per the Sovereign''s direction the one-Gazette-two-estates tagline is retired and v1/v2 never appear as estate labels (the list chips read CANON and ARCHIVE); node labels in the constellation now sit on translucent chip plates so they stay legible above the edge lines.'
