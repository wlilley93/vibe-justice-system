decision: 'The constellation is the Gazette''s front page (index.html, the Pages root), built as an ontology explorer: logo top left; type-ahead search up top (grouped hits, keyboard navigation, / to focus); a scrollable list sidebar with uniform fixed-width chips docked top right of each row, a per-row lineage disclosure, and sort by newest, kind, or most cited; a minimisable legend with lineage, machinery, and label toggles plus a node-spread (gravity) control; the estate dock bottom right; and the reading panel upgraded to read the law in place. The generator now emits gazette-text.js (105 kind-shaped full-text bodies, script-terminator-guarded) and treatment fields: supersedes and superseded-by, opinion links, derived order citations, and the SUBJECT structure the Principal directed: a case interweaves by the legislation it construes (textual citation extraction over every law file) or its docket thread (issue-tag families: the boot series, governance, constitutional), with the constitutional anchor a last resort; 16 of 20 cases thread, 6 construe legislation directly. Graph treatments: chip-tone solid fills with paper cores (colouration differentiated), screen-compensated node radii that shrink as you zoom, hover highlighting with neighbourhood dimming, a breathing slow-turning dashed selection halo, collision-avoided importance-first labels with bold major legislation. gazette-graph.html now redirects into the front page preserving deep links; the classic card view remains at gazette.html. On the BOOT naming question: BOOT is the bootstrap series file id minted at founding; the canonical name of those orders is their neutral citation ([2026] VJS-CC-AGENT-UNIVERSE-V2 n), which the UI displays; renaming enacted ids would need due process and a citation-map migration, not a display edit.'
