decision: 'Enacted The Unitary Stack (DEC-OPBOX-UNITARY-STACK-001, [2026] VJS-DEC 15, sovereign-assented): one source of truth for Opbox kernel-owned data on the shared-Postgres single-box deployment - reads direct from the kernel''s singular tables, writes only via kernel verbs, RLS at the database; dual-SoR-with-sync designated transitional debt. Added SPEC-OPBOX-UNITARY-STACK-001 and INV-OPBOX-UNITARY-001.'
basis:
- PERMIT-1781968101
risk: low
reversibility: easy
court_required: false
why: 'Principal exercised the Sovereign office to settle a first-impression architectural fork: the dual system-of-record with a sync projection is mid-flight migration debt (causing sync lag, silent failures, dual-schema upkeep, and the spawn-class dual-write bug). Because the frontend and kernel share one Postgres, HTTP read verbs add latency and rewrite for zero gain; reads should query the real tables. Consolidation principle (ACT-9) applied to the Opbox data plane. Contingent on the shared DB: if the DBs ever split, the decision reopens (reads -> verbs or event-projected CQRS).'
