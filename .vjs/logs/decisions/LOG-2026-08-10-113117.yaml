id: LOG-2026-08-10-113117
time: 2026-08-10T11:31:17.989984+00:00
actor: lexby
kind: implementation-decision
issue: order-reader-divergence-referral-door
decision: Extract one shared classifier (classify_unparsed_order + UnparsedOrder + ReferralRecord::announcement) into vjs-core and route all three order readers through it, replacing three separate statements of the referral/unreadable rule.
basis:
- PERMIT-1786361132
- ACT-001:s5
- '[2026] VJS-CC-OPBOX 160'
- '[2026] VJS-CC-OPBOX 16'
risk: low
reversibility: easy
court_required: false
why: The reader widened by CC-OPBOX 160 O1 was widened in vjs-engine alone. The other two readers kept their own statement of the rule and drifted, the same shape CC-OPBOX 16 C1 records for the record-writing doors. vjs-store hard-failed on the referral, so vjs status could not run at all against the First Subscriber's store; vjs-core::repo silently dropped unparseable records into the set that feeds evaluate_invariants, so invariants could pass over an order set that was quietly short. One classifier now states the rule once. The narrow door is unchanged and every existing negative control still passes; a genuinely unreadable order still fails closed in the store reader and is now announced rather than swallowed in the state reader.
