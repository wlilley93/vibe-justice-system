issue: ROUTE-20260728-152148
decision: Widen the order reader; do not edit the filed orders
basis:
- PERMIT-1785252108
risk: low
reversibility: easy
court_required: false
why: 'Two boltrig orders did not deserialise, so they were absent from the citator and bound nothing while everything downstream looked healthy - vjs route warned on stderr and carried on. This is the third instance: supersedes once broke six filed orders and privy needed an alias for the same reason. The rule already recorded on Order::supersedes is never rewrite a filed record to satisfy a struct, widen the struct to read the record, so the cure is reader-side. Added an appeal alias on CourtOfAppeal and a string-or-sequence deserialiser on both exceptions fields. Guarded against the real Order type, not a stand-in, and mutation-checked so each cure fails exactly one test. A negative case keeps an unknown court refused, so a widened reader cannot decay into one that accepts anything.'
