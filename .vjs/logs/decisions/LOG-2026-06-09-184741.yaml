decision: 'Lawpack referential integrity is now machine-checked: vjs validate scans every lawpack YAML for cited ACT/DEC/INV/OBL/SPEC/REG ids and reports any that resolve to no defined object as DANGLING_REFERENCE warnings (20 today). A negated mention (PC-005''s ''no DEC-INSTITUTIONS-001'') is a statement, not a reference, and is excluded. The 20 genuinely missing objects are queued for enactment by the lawmaking route in the draft submission 2026-06-09-dangling-citations-omnibus, not silently authored by the engineer. Also fixed: the testkit ran from the package dir, so every lawpack-backed test loaded an EMPTY lawpack and passed vacuously; tests are now anchored on the crate manifest and exercise the real lawpack.'
