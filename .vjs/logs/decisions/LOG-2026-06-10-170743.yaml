decision: 'Two corrections surfaced while executing the VJS-PC 9 strike, both made good. (1) Re-grounding the assent-floor citation in order VJS-PC 7 to the V2 home alone (ACT-COMPUTER-FIRST-REALM s.23), not adding the V1 case [2026] REALM-SC 10, because an order that cites a V1 authority without an express incorporation clause trips INV-NO-V1-GAP-FILLER; the V2 home is the correct and sufficient re-citation. (2) Narrowing INV-LAWMAKING-001 (New law requires authority basis) from statutes/regulations/rules to regulations/rules only: arming the required-fields predicate in the earlier kernel-teeth beat exposed that the invariant demanded authority and kernel_effect on primary statutes, which are authorised by Sovereign assent (assent_source + enacted_by, gated by INV-ASSENT-SOURCE-001), not a parent authority field; only subordinate law needs a parent authority. This conforms the invariant to ACT-CONSOLIDATION-FRAMEWORK s.7/s.10 and is a duty-of-care correction, not a weakening (statutes remain gated by the assent-source invariant). Validation OK, 69 tests green.'
