decision: 'The Gazette is read first, explored second. gazette.html is the primary surface in the V1 Realm Law Reports styling (cream/paper serif, the MoJ tone taxonomy: Acts red, instruments darker red, Supreme Court gold, Privy Council pink, first instance lighter blue, machinery gray): searchable, filterable by estate (V2 current / V1 archive) and class, every card headed by the act/case NAME with kind, estate, and status chips beside the header, citation and court on the secondary line, main points expandable, source plus constellation links. gazette-graph.html is demoted to a companion view restyled to the same language: solid stars for the canon, ringed stars for the archive, dashed amber source edges into V1, a rich reading sidebar (title-first, chips by the header, summary, main points, branch-labeled sources, relies-on / relied-on-by navigation), estate filters, search, reduced-motion support, hash deep links both ways. Both pages read gazette-data.js; the dead blob/main links are gone (master and v1 branch bases, test-enforced). README and GAZETTE.md now lead with the Gazette and offer the constellation second.'
