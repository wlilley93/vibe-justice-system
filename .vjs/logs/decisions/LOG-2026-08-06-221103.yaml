why: 'The last two denylisted terms outside .vjs/ were a serde alias in types.rs and its mirror fixture. The alias was wrong twice: it named a real subscriber in the canon''s own published source, and it made the long form readable for exactly one estate while every other subscriber''s long-form County orders failed to deserialise - silently, because an order that does not parse is an order absent from the citator that binds nothing. Replaced the derived Deserialize with a hand-written reader: case-insensitive ''county court at <anything>'' is a County seat, for any subscriber, named or not. An unknown seat is still an error, tested, because widening a reader risks a rule loose enough to swallow a typo. Split into types/court.rs under the 600-line structural ceiling rather than raising the ceiling.'
