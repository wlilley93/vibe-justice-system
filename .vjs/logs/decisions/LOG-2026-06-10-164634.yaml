decision: 'Added [2026] REALM-SC 11 to the books. It is the Acmeco judgment: a full court of nine, on the Principal''s leapfrog certificate, settling whether an embeddable, corporate-re-skinned governance client that renders the same canonical VJS governance from a central server of law is a lawful presentation DIVISION over the one spine or a forbidden parallel COURT. It holds: re-naming canonical governance is permitted, re-housing substantive law, citator, bench, or apex inside the product is forbidden, and the client is lawful only on six cumulative conditions (unity and CURRENCY of law - render live from the central source, never a vendored or stale local copy; unity of citator and apex; the synthesiser bar; delivery not law-making; candour of provenance; and 7:2 an external-law floor against impersonating regulated legal authority). It purports to enact CASE-LAW s.24 (ordinary, declaratory). As the Principal identified, it was produced by the V1-lineage court workflow in the agent-universe repo and cites the REALM-SC series, so in V2 it has NO BINDING STANDING; having been passed by a full court it is PERSUASIVE (ACT-001, the honoured archive binds nothing unless expressly incorporated). It is recorded accordingly: an honoured-archive item marked archived, its 212 KB PDF carried and served by the Gazette, the six conditions curated as its points, citing REALM-SC 5/8/9 and REALM-PC 14/15. The generator and the gazette-data test now recognise that the honoured archive spans the frozen V1-lineage repos (the vibe-justice-system v1 branch and agent-universe), an estate item naming its own frozen github source. This judgment is the persuasive authority on the server-of-law / subscribing-client question and will inform any binding V2 enactment of the subscribing-jurisdiction law. 69 tests green; register 93 items.'
