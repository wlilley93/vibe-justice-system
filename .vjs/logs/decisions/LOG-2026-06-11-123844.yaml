decision: 'Gave the constellation nodes iconography at the Principal''s direction (expand the node and include an icon). Each node is drawn a touch larger and, when it is big enough to read (significant by inbound-citation count, or zoomed in), carries a per-kind monoline glyph inside it: a classical column for statutes/acts, a page for regulations/rules/instruments, the scales of justice for orders and judgments, and a tick for decisions. The glyphs are inline path data (Path2D), never external images, so the page stays archival-robust and self-contained. The glyph is light on the saturated V2 tone fill and the tone colour on the V1 paper fill; it replaces the old paper-core. Below the legibility threshold a node stays a clean tone dot, so the wide star field is unchanged and only the major/zoomed nodes read as icons. Significance-sizing (node radius from inbound citations, screen-compensated for zoom) is unchanged. Display only; verified by a standalone glyph render and the full-graph render.'
