decision: Armed seven invariant predicates that were placeholders returning true, so the gate now means what it says. A kernel-owned LawpackFacts (validates, duplicate_ids, duplicate_citations, all_ids, mcp_local_first, directory_roles_resolve) is computed once by vjs-lawpack (reusing the LawpackValidator findings and a shared defined_ids helper, reading .vjs/config.toml for the roles and MCP checks) and threaded into evaluate_invariants/evaluate_predicate. LawpackValidates (INV-001), NoDuplicateIds (INV-002), NoDuplicateCitations (INV-003) read the whole-lawpack facts; RequiredFields (INV-LAWMAKING-001) requires every declared field on a staged in-scope record; IncludedInRuntimeAuthorityGraph (INV-LAWMAKING-002) consults all_ids so a draft record sitting in the runtime graph fails; McpLocalFirst (INV-011) and DirectoryRolesResolve (INV-012) read the config. This strengthens the kernel's implementation behind predicate kinds the lawpack already declares (REG-006 mandates evaluate_default_invariants); it does NOT amend the Realm Invariants Instrument and needs no court or assent (duty of care). Referential integrity stays a warning, already CI-enforced by lawpack_integrity. A new predicate_teeth.rs proves each armed predicate fails its bad fixture and passes good input (7 tests); the real lawpack stays green (test_invariant_evaluation); 68 tests, 0 clippy warnings.
basis:
- PERMIT-1781098238
risk: low
reversibility: easy
court_required: false
why: 'An honest-caveat fix: the placeholder predicates left fatal invariants toothless; arming them makes the gate trustworthy. Engineering behind declared predicate kinds, not lawmaking.'
