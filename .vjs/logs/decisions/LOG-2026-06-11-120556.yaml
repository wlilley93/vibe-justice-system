decision: 'Two presentation changes. (1) The big tail on the constellation was the founding docket thread: BOOT-001 through BOOT-011 chained one-to-next by thread links, each node holding only its neighbours, so the force layout streamed the chain outward. Thread links now use a short distance (14 vs 36) so docket series coil beside the cluster; verified by render. (2) The Principal changed his mind on act citations: acts now display as the year plus the short title (''[2026] - Computer-First Realm Act 2026'' style) everywhere a reader sees them - the title line, the meta line (which now carries the record id, e.g. ACT-001, instead of the series), and the copy-citation. The year falls back to the record date for the two constitutional acts that carry no citation field. DISPLAY ONLY: the enacted [2026] VJS-ACT n series remains on the machine records, because the series is itself law (REG-003 defines it; the Consolidation Framework mints the ordinals deterministically; the Computer-First Act discusses its own void ordinal on its face) - striking it from the records would require amending those instruments, which the presentation change does not need.'
