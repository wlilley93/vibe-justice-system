decision: 'Fixed three faults in the constellation link-hover tooltip the Principal spotted. Root cause: the vendored force-graph library names its tooltip container .float-tooltip-kap, not .graph-tooltip, so the earlier reset never applied and the library defaults leaked through - background rgba(0,0,0,0.6) (the transparent grey the box showed), font 12px sans-serif (why the text differed from the node hover cards), and color #eee. The real class is now reset (transparent background, ink colour, no padding, no max-width clamp, inherited font), and the link tooltip is a single solid white panel (border, radius, shadow, overflow hidden) holding the two record blocks and the association connector, in the Iowan Old Style serif that the node hover cards use. So the box is opaque white (proven against a dark background), the title and meta text match the node hover state, and the chips render in the same serif context. The two blocks keep their tone-coloured left borders as identity accents; the verb and arrow sit on white in the middle. Display only.'
