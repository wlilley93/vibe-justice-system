decision: 'Two link-tooltip refinements. (1) The chips (kind + court + status) sat on different baselines; the link card''s chip row is now flex with align-items centre and gap-spacing, so they are level. (2) The relationship now reads as a flow from the foundational record into the newer one that builds on it, at the Principal''s direction: a cite edge (data points citer to cited) shows the cited authority on the left and the citing instrument on the right with the verb ''cited by''; a lineage edge (data points descendant to ancestor) shows the v1 ancestor on the left and the v2 descendant on the right with ''carried into''. So hovering REG-LAWMAKING-001''s cite of ACT-001 reads left to right as the Constitution Act, cited by, the Lawpack Amendment Regulation - the constitution flowing into the regulation that relies on it. Docket threads stay symmetric (''same docket as''). Display only.'
