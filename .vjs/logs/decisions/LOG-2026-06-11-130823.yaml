decision: 'Two constellation adjustments. (1) Spread headroom: the spread slider''s ceiling is raised from a charge of 800 to 2000, and the spread now scales link distances as well as node repulsion (a shared linkDist that multiplies the base edge length by the spread multiplier), so turning it up genuinely opens the whole map rather than only repelling neighbours; docket-thread links stay short regardless so the boot series keeps coiling. Verified by a render at spread 1800 showing the cluster spread wide across the canvas. (2) Node icons: the per-kind glyphs already render correctly at every zoom (verified by forced renders at zoom 6 and 13 - the act column and the regulation page both show); the Principal''s screenshot was a stale browser cache from commit e4962b2, which predates the icons entirely, so a hard refresh shows them. As a belt-and-suspenders the on-screen icon threshold is lowered (r*scale from 6.5 to 5) so glyphs appear on more nodes. Display only.'
