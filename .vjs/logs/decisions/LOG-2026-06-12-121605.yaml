why: s.5 routes a text-effect discrepancy for correction and forbids the kernel to silently choose; s.23 requires assent to be DECLARED, not merely mentioned; s.11/DEC-KERNEL-001 require model-free and network-free. A raw-line scan admitted forged law (executed 2026-06-12) and a dead jsonschema pulled reqwest into the closure. These fixes make the code concord with enacted statute - concordance, not new law. Each is locked by an executed golden vector; determinism preserved (serde_yaml parse, no clock/model/network).
