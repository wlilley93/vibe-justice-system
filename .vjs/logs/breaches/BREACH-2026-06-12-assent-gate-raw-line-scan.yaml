id: BREACH-2026-06-12-assent-gate-raw-line-scan
time: "2026-06-12T00:00:00+00:00"
actor: lexby
kind: breach_self_report
issue: kernel-witness-soundness
what_happened: >
  The assent-source witness (PredicateExpr::AssentSourceValid, crates/vjs-core/
  src/spec.rs) read a record as a bag of raw lines (content.lines().any), so any
  line anywhere that trimmed to `assent_source: <allowed>` conferred force. A
  statute with NO operative top-level assent_source field, but the string buried
  in a section text block, validated OK; so did a record whose operative field
  declared the explicitly-void self_authorised, masked by a buried valid line.
  Confirmed by EXECUTION against the compiled binary on 2026-06-12 (a buried-line
  statute returned `Validation: OK`; a byte fuzz showed no-space, double-space,
  trailing-space, CRLF, and unicode NBSP all inject). The same raw-line /
  substring / denylist / is_empty shape recurred in six sibling witnesses
  (IncludedInRuntimeAuthorityGraph, CoreNoModelCalls, CoreNoNetwork,
  GovernedWritesRequirePermit, ProofsExistBeforeClose, V1NotLoadedByDefault). A
  dead jsonschema dependency in vjs-lawpack was pulling reqwest -> hyper -> tokio
  into the kernel closure: the model-free / network-free guarantee was already
  violated at the dependency level.
law_breached:
  - "ACT-COMPUTER-FIRST-REALM s.23: a record claims binding runtime force only if it DECLARES a resolving assent_source; a buried mention is not a declaration."
  - "ACT-COMPUTER-FIRST-REALM s.5: a material discrepancy between a section's text and its kernel effect is a validation defect routed for correction; the kernel must not silently choose."
  - "ACT-COMPUTER-FIRST-REALM s.11 / DEC-KERNEL-001: the kernel must be model-free and network-free; a transitive reqwest in the closure breaches this."
  - "INV-ASSENT-SOURCE-001: the predicate text promised a resolved/declared source; the code did raw-line membership (text-effect discrepancy)."
discovered_by: execution (the adversarial battery + byte fuzz against the compiled kernel)
containment: >
  Working-tree only; nothing reached the committed canonical line. The defect is
  cured on branch fix-kernel-witness-soundness before any commit to a protected
  branch.
remedy:
  - replace the three raw-line scanners (assent, runtime-graph, V1-not-loaded) with an operative-field reader that parses structure (top_level_scalar), so only the declared field confers force
  - strengthen GovernedWritesRequirePermit (require an Active permit, not mere presence) and ProofsExistBeforeClose (require a Passed proof), deterministically
  - remove the dead jsonschema dependency, dropping reqwest/hyper from the kernel closure; add deny.toml so no HTTP/model crate can return by silence (capability removed, not merely prohibited)
  - lock the executed battery and the status checks as permanent golden vectors (assent_source_invariant.rs, permit_proof_status.rs)
prevention:
  - deny.toml + `cargo deny check bans` is the authoritative model-free/network-free witness (dependency closure), with the source-scan predicates as secondary defense-in-depth
  - a witness must read parsed structure / full state / removed capability, never a scan for known-bad over raw text
deferred:
  - the s.5(a) "no-kernel-effect excludes from the graph" teeth-gate is NEW enforcement (first-impression design), filed separately for the court, not folded into this remediation
note: >
  Remedy is restorative, not punitive (the duty of care). The work is made good;
  the gap that let it through (a witness scanning text instead of reading the
  operative field) is recorded for the permanent suite.
