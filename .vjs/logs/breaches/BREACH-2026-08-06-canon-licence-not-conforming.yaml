id: BREACH-2026-08-06-canon-licence-not-conforming
time: "2026-08-06T22:30:00+00:00"
actor: lexby
kind: breach_self_report
issue: canon-licence-conformity
code: CANON-LICENCE-NOT-CONFORMING
operative_licence: "PolyForm Noncommercial License 1.0.0"
required_licence: "AGPL-3.0-only"
self_filed_under: "ACT-003 s.4-s.8 (duty of reasonable skill and care, breach self-fileable); [2026] VJS-PC 11 D2"
status: open_awaiting_the_copyright_holder
what_happened: >
  [2026] VJS-PC 11 is binding and its D2 names lexby as the actor:
  "keep_the_canon_a_separate_public_agpl_repo_at_the_root_with_zero_inbound_dependency".
  The holding says it in terms - the canon "must REMAIN a separate, PUBLIC, AGPL-3.0
  repository" - and the opinions call the AGPL stamp non-negotiable, because it is what
  keeps the REG-BUNDLE-001 AGPL/MIT firewall standing by construction instead of by
  anyone's care.

  The canon has been in breach of BOTH limbs of that directive.

  On the licence limb: the anonymising history squash of 2026-07-11 (ebf34d7, "chore:
  re-pin enforcement surface after anonymization") wrote LICENSE as PolyForm
  Noncommercial 1.0.0. No adoption record, no court order, no assent, no mention in the
  commit message. Cargo.toml and NOTICE.md went on reciting AGPL-3.0 throughout, so for
  close to a month the canon carried three statements of its own licence and two answers,
  and the two grants differ on the question a reader cares about most: AGPL permits
  commercial use and PolyForm Noncommercial forbids it.

  On the publicity limb: `gh repo view` reports the canon PRIVATE as at 2026-08-06.

  Nothing anywhere checked either limb. The contradiction was found by reading a grep
  result, not by running anything.
law_breached:
  - "[2026] VJS-PC 11 D2 (binding, actor lexby): the canon must remain a separate PUBLIC AGPL-3.0 repository at the root."
  - "REG-BUNDLE-001 (4): the licence firewall assumes the canon component is the AGPL side of the boundary. A canon that is not AGPL leaves the firewall asserting a fact about the corpus that stopped being true on 2026-07-11."
my_own_fault_in_it: >
  Two failures of care, both mine, and the second is the worse one.

  First: I worked in this repository across the whole of 2026-08-06 toward the stated goal
  of launching it publicly, and did not once check whether it satisfied the order that
  governs its publication. The goal was literally the discharge of PC 11 D2 and I did not
  read PC 11.

  Second, and this is the part that would have done lasting damage: the change I had in
  flight when I found this was to update Cargo.toml and NOTICE.md to say PolyForm, so that
  the three files agreed. That would have made the repository self-consistent, silenced
  the only remaining signal that anything was wrong, and left the breach of a binding
  order machine-invisible for good. I was one commit from curing the symptom and
  entrenching the defect. The gate below reports the drift and the non-conformity as
  SEPARATE codes precisely because of this: making the files agree on a forbidden licence
  clears the first and must not clear the second, and there is a test that says so.
containment:
  - "The in-flight change to Cargo.toml and NOTICE.md was reverted, not landed. The canon still says AGPL in two of three places, which is the signal, and it stays."
  - "LICENSE was NOT touched. Restoring AGPL myself would re-grant commercial rights the copyright holder may have deliberately withheld, and a licence grant cannot be un-published. The asymmetry decides it: a wrongly-restored AGPL is irreversible in the world, a wrongly-retained PolyForm is a curable breach on a record."
  - "The repository remains PRIVATE, so nothing has yet been published under either licence. That is the one piece of luck in this entry."
remedy:
  - "Built the gate that was missing: vjs-engine::canon_licence, wired into validate. CANON-LICENCE-DRIFT fires where the declaration and the LICENSE file provably disagree; CANON-LICENCE-NOT-CONFORMING fires where the operative licence is not the one PC 11 D2 requires. Two codes, because a drift is a mistake and a non-conforming licence is a breach of a binding directive."
  - "Both are held at Warning ONLY while this filing exists and names the actual operative licence, on the rule D4 settled for the store register the same day: the unresolved state is lawful while it is recorded and before the person who can decide it, and unlawful the moment it is silent. A straight Fatal would have refused the very filings that put the question to the copyright holder."
  - "The filing must name the operative licence verbatim, so it cannot be written in advance, cannot be generic, and goes stale by itself if the licence changes again - at which point the Fatal returns, because a new licence is a new question."
  - "Red seeds cover the 2026-07-11 state, the cure-the-symptom trap, the recorded/unrecorded split, a stale filing, a subscriber (who is NOT bound by the canon's licence condition), and a commented-out declaration."
what_i_cannot_do:
  - "Choose the licence. A licence is a grant by the copyright holder with effect in real-world law, which ACT-001:s3 places above everything in this corpus. No gate, no court and no engineer may make one."
  - "Publish. Publication under a licence a binding order forbids is the outward-facing act the order exists to prevent, and no record of the conflict makes it lawful."
before_the_principal:
  - "Which licence do you grant for the canon? If PolyForm Noncommercial was deliberate, PC 11 D2 needs to move on a fresh record before publication, and REG-BUNDLE-001's firewall needs re-reading against a canon that is no longer the AGPL side of it. If it was an artefact of the anonymising squash, LICENSE needs restoring to AGPL-3.0 and the drift closes on its own."
  - "Either way the adoption needs a record. The move away from the AGPL adoption that [2026] VJS-PC 5 recorded carries no adoption record of its own anywhere in this corpus."
note: >
  Restorative, not punitive (ACT-003 s.4-s.8). The work is made good as far as it can be
  made good by me: the hole is now a gate, the gate has red seeds, and the question is on
  the record in front of the only person who can answer it instead of sitting in a diff.
