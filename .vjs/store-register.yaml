# THE STORE REGISTER (ACT-PROCEEDINGS-DISCIPLINE s13). Every store capable of holding
# a governed record or a citation, registered so the audit sweeps a map and not a
# guess. Checked by the store-register gate at validate and local-ci: a governed
# record root missing from here is Fatal; a ghost entry warns; and since
# [2026] VJS-CC-VJS 20 D4, an entry that was here at HEAD and is not here now is
# Fatal unless it appears under `deregistered:` below with a reason and an authority.
# Deregistration is lawful. Silent deregistration is not.
#
# COMPLETED under [2026] VJS-CC-VJS 20 D4. The register previously carried three
# entries, all of them governed record roots, which meant it duplicated a list the
# kernel already derives and registered nothing the kernel did not already know. The
# stores that were NOT on it are the ones the completeness duty cannot see, and those
# are exactly the ones a lost entry would have vanished from in silence. That is why
# D4 ordered the witness FIRST and the completion second: registering these stores
# without the witness would have created seven new things to lose quietly.
#
# Registration is a claim about WHERE a record lives, never about what it contains.
# `.vjs/private` is registered and is not published; naming the path discloses
# nothing the repository's own .gitignore does not already say out loud.
stores:
- path: lawpack/v2
  kind: canonical_lawpack
  registered_at: "2026-08-05"
  note: the subscribed canon - statutes, regulations, rules, orders, specs, invariants, decisions, obligations, provenance
- path: .vjs/orders
  kind: filed_orders
  registered_at: "2026-08-05"
  note: this jurisdiction's own filed orders, overlaid on the canon by the shared door
- path: .vjs/court
  kind: court_records
  registered_at: "2026-08-05"
  note: convenings and court records under REG-COURT-RECORD-001
- path: .vjs/submissions
  kind: submissions_and_engrossed_texts
  registered_at: "2026-08-06"
  registered_by: "[2026] VJS-CC-VJS 20 D4"
  note: >
    drafts, filed instruments, commission reports and self-files. Record-bearing in the
    strongest sense the corpus has: lawpack assent records pin engrossed texts under
    here BY DIGEST, so a signature's subject matter lives in this store. That pinning is
    why D2 refuses to untrack it until D3 re-seats those pointers.
- path: .vjs/permits
  kind: route_permits
  registered_at: "2026-08-06"
  registered_by: "[2026] VJS-CC-VJS 20 D4"
  note: >
    permits issued by `vjs route`. Citation-bearing: a permit names the authorities it
    was granted under, and a decision log discharges its obligation by carrying the
    permit id, so the permit is the far end of a citation the log makes.
- path: .vjs/logs
  kind: decision_and_breach_logs
  registered_at: "2026-08-06"
  registered_by: "[2026] VJS-CC-VJS 20 D4"
  note: >
    decision logs and self-filed breaches. Citation-bearing (each cites its permit and
    its authorities) and record-bearing for the breach ledger, which is the discipline's
    own memory under ACT-004.
- path: .vjs/invocation
  kind: invocation_records
  registered_at: "2026-08-06"
  registered_by: "[2026] VJS-CC-VJS 20 D4"
  note: >
    the sovereign invocation records that constitute this jurisdiction and pin the
    lawpack it subscribes to. The store that answers "by what authority is there a
    jurisdiction here at all".
- path: .vjs/proofs
  kind: proof_artefacts
  registered_at: "2026-08-06"
  registered_by: "[2026] VJS-CC-VJS 20 D4"
  note: >
    proof artefacts produced under the certification machinery. Citation-bearing: a
    proof names the instrument and digest it was taken over.
- path: .vjs/audit
  kind: audit_sink
  registered_at: "2026-08-06"
  registered_by: "[2026] VJS-CC-VJS 20 D4"
  note: >
    the append-only audit sink written by the MCP surface. Registered because it is
    capable of holding a citation, and because an audit trail that no register knows
    about is the precise shape of a store the audit sweeps past.
- path: .vjs/private
  kind: pseudonym_register
  registered_at: "2026-08-06"
  registered_by: "[2026] VJS-CC-VJS 20 D4"
  published: false
  note: >
    the pseudonym register: the mapping from a real subscriber name to its accessioned
    rendering. Citation-bearing (every pseudonym in a published record resolves here)
    and NEVER published - gitignored, and the boundary scan holds hashes so no gate
    message can quote its contents. Registered so that the audit knows the store
    exists; the register says where, never what.

# Stores that have LEFT the register, and why. An entry here is what makes a
# deregistration lawful rather than silent ([2026] VJS-CC-VJS 20 D4).
deregistered: []
