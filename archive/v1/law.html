<style>
  :root {
    --cream:#fcf7f1; --paper:#fffdfa; --ink:#1a2744; --rule:#c8d0dc; --muted:#5b6472; --accent:#8b0000;

    --ca:#1d4f91;  --ca-bg:#e8f1ff;
    --first:#3d7fbd; --first-bg:#eef7ff;
    --act:#b42318; --act-bg:#fff0ec;
    --si:#761919;  --si-bg:#fbe6e6;
    --pc:#5b6472;  --pc-bg:#eceef2;
    --submission:#4b5563; --submission-bg:#f3f4f6;
    --v1:#7a5c1e;  --v1-bg:#f6eeda;
    --v2:#1a5c46;  --v2-bg:#e9f5ef;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--cream); color:#15202b;
    font-family:'Iowan Old Style','Palatino Linotype','Times New Roman',serif; line-height:1.55; }

  /* the compact header bar */
  .bar { position:sticky; top:0; z-index:9; display:flex; align-items:center; gap:.8rem;

  .bar .word { line-height:1.1; }
  .bar .word b { display:block; font-size:.95rem; letter-spacing:.03em; color:var(--ink); }
  .bar .word span { font-size:.64rem; color:var(--muted); font-style:italic; }
  .bar nav { display:flex; gap:.9rem; margin-left:1rem; }
  .bar nav a { color:var(--ink); text-decoration:none; font-size:.85rem; border-bottom:1px solid transparent; }
  .bar nav a:hover { border-bottom-color:var(--ink); }
  .bar .gh { margin-left:auto; display:flex; align-items:center; color:var(--ink); }
  .bar .gh svg { width:22px; height:22px; display:block; }
  .bar .gh:hover { opacity:.7; }
  .backbtn { border:1px solid var(--ink); background:var(--paper); color:var(--ink); border-radius:6px;

  .tl { display:inline-block; font-size:.7rem; letter-spacing:.05em; text-transform:uppercase;

    background:#fff; margin-right:.5rem; vertical-align:.05rem; }
  .tl.live { background:#dff3e4; color:#0a5a26; border-color:#7cc894; }
  .tl.arch { background:#f1ece1; color:#6b5b3a; border-color:#cdbf9c; }
  .archnote { color:var(--muted); font-size:.82rem; font-style:italic; }
  .tl.bad  { background:#fbe3e3; color:#a01010; border-color:#c0392b; }
  .tl.pend { background:#fff2d6; color:#8a5a00; border-color:#d99b1f; }

  /* chips: the same tone-on-tint pairs as everywhere */
  .chip { display:inline-block; width:6.1rem; text-align:center; border:1px solid var(--tone,var(--muted));
    border-radius:4px; background:var(--tone-bg,#fff); color:var(--tone,var(--muted)); font-size:.66rem;
    font-style:normal; font-weight:normal; letter-spacing:.04em; line-height:1.2; text-transform:uppercase;
    padding:.1rem 0; margin:0 .3rem .25rem 0; vertical-align:.08rem; }
  .chip.tone-sc { --tone:var(--sc); --tone-bg:var(--sc-bg); }
  .chip.tone-ca { --tone:var(--ca); --tone-bg:var(--ca-bg); }
  .chip.tone-first { --tone:var(--first); --tone-bg:var(--first-bg); }
  .chip.tone-act { --tone:var(--act); --tone-bg:var(--act-bg); }
  .chip.tone-si { --tone:var(--si); --tone-bg:var(--si-bg); }
  .chip.tone-pc { --tone:var(--pc); --tone-bg:var(--pc-bg); }
  .chip.tone-submission { --tone:var(--submission); --tone-bg:var(--submission-bg); }
  .chip.tone-v1 { --tone:var(--v1); --tone-bg:var(--v1-bg); }
  .chip.tone-v2 { --tone:var(--v2); --tone-bg:var(--v2-bg); }

  /* the document */
  main { max-width:50rem; margin:0 auto; padding:1.4rem 1.2rem 4rem; }
  main.wide { max-width:74rem; }

  /* legislation.gov.uk-style layout: a sticky Contents rail and numbered
     sections in a left gutter */
  .legdoc { display:grid; grid-template-columns:16rem 1fr; gap:2.4rem; align-items:start; margin-top:1rem; }
  .legdoc .contents { position:sticky; top:58px; align-self:start; max-height:calc(100vh - 76px); overflow:auto;
    font-size:.85rem; padding-right:.4rem; }
  .legdoc .contents .lbl { font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
    margin-bottom:.4rem; padding-bottom:.3rem; border-bottom:1px solid var(--rule); }
  .legdoc .contents a { display:grid; grid-template-columns:2rem 1fr; gap:.4rem; padding:.2rem 0;
    color:var(--ink); text-decoration:none; line-height:1.3; }
  .legdoc .contents a .cn { color:var(--muted); text-align:right; }
  .legdoc .contents a:hover { text-decoration:underline; }
  .legdoc .contents a.active { font-weight:bold; }
  .legdoc .contents a.active .cn { color:var(--ink); }
  .legdoc .contents .res { color:var(--muted); }
  .legbody { min-width:0; }
  .leg-section { display:grid; grid-template-columns:2.6rem 1fr; gap:.7rem; margin:0 0 1.8rem;

  .leg-section .num { text-align:right; color:var(--muted); font-size:1rem; padding-top:.15rem; }
  .leg-section .num .pilcrow { display:block; margin:.15rem 0 0; font-size:.85rem; opacity:0; }
  .leg-section:hover .num .pilcrow, .leg-section.flash .num .pilcrow { opacity:1; }
  .leg-section .content h3 { margin:0 0 .4rem; font-size:1.12rem; color:var(--ink); line-height:1.3; }
  .leg-section.flash .content h3 { color:var(--accent); }
  .leg-section .content p { margin:.5rem 0; }
  .leg-reserved { display:grid; grid-template-columns:2.6rem 1fr; gap:.7rem; margin:0 0 1rem; color:var(--muted); }
  .leg-reserved .num { text-align:right; }
  @media (max-width: 760px) {
    .legdoc { grid-template-columns:1fr; gap:1rem; }
    .legdoc .contents { position:static; max-height:none; border-bottom:1px solid var(--rule); padding-bottom:.6rem; }
    .leg-section, .leg-reserved { grid-template-columns:2.2rem 1fr; gap:.5rem; }

  .kicker { font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  h1 { margin:.25rem 0 .35rem; font-size:1.85rem; line-height:1.2; color:var(--ink); }
  .docmeta { color:var(--muted); font-size:.88rem; margin:.2rem 0 .1rem; }
  .docmeta b { color:var(--ink); font-weight:normal; }
  .statusline { font-size:.88rem; margin:.2rem 0 1rem; color:var(--ink); }

  article p { margin:.6rem 0; }

  .commentary { color:var(--muted); font-size:.88rem; font-style:italic; }

  .qbox { border-left:3px solid var(--ink); background:var(--paper); border-radius:0 6px 6px 0;

  .qbox .qlabel { font-size:.66rem; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
          font-weight:700; margin-bottom:.25rem; }
  .qbox p { margin:.2rem 0 0; font-size:1.02rem; line-height:1.5; }
  .headnote { border:1px solid var(--rule); background:#fbfaf6; border-radius:6px; padding:.5rem .8rem;
    margin:0 0 .9rem; font-size:.9rem; }
  .headnote .hn-label { font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
    font-weight:bold; margin-bottom:.35rem; }
  .headnote .hn-row { display:grid; grid-template-columns:5.5rem 1fr; gap:.6rem; padding:.12rem 0; }
  .headnote .hn-k { color:var(--muted); }
  .headnote .hn-v { color:var(--ink); }
  .headnote .mono { font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:.78rem; word-break:break-all; }
  .plainbox { border-left:3px solid var(--accent); background:#fbf6ee; border-radius:0 6px 6px 0;
    padding:.5rem .85rem; margin:1.4rem 0 .4rem; }
  .plainbox .plabel { font-size:.64rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:bold; }
  .plainbox p { margin:.25rem 0 0; font-size:1rem; line-height:1.55; color:#2a3340; }
  .facts { background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:.6rem .8rem;

  article table { border-collapse:collapse; font-size:.86rem; margin:.6rem 0; width:100%; background:var(--paper); }
  article td, article th { border:1px solid var(--rule); padding:.3rem .5rem; text-align:left; vertical-align:top; }
  article th { font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .pred { font-family:ui-monospace,Menlo,monospace; font-size:.8rem; background:var(--paper);

  a.lawref { color:var(--ink); text-decoration:underline; text-decoration-color:var(--rule); cursor:pointer; }

  h2.sect { margin:1.6rem 0 .4rem; font-size:.78rem; letter-spacing:.12em; text-transform:uppercase;

  .points { margin:.4rem 0; padding-left:1.25rem; }

  .pdfhead h1 { font-size:1.25rem; margin:.1rem 0; }
  .pdfwrap { height:calc(100vh - 132px); max-width:62rem; margin:0 auto; padding:0 1.2rem 1rem; }
  .pdfwrap iframe { width:100%; height:100%; border:1.5px solid var(--ink); border-radius:6px; background:#fff; }

  footer { border-top:1px solid var(--rule); margin-top:2rem; padding:1rem; text-align:center;
    color:var(--muted); font-size:.78rem; font-style:italic; }
  .toc { background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:.5rem .8rem;
    font-size:.84rem; margin:.8rem 0; columns:2; column-gap:1.4rem; }
  .toc a { display:block; color:var(--ink); text-decoration:none; padding:.1rem 0; }
  .toc a:hover { text-decoration:underline; }
  .copycite { font:inherit; font-size:.74rem; color:var(--muted); border:1px solid var(--rule);
    border-radius:4px; background:var(--paper); cursor:pointer; padding:.08rem .5rem; margin-left:.5rem; }
  .copycite:hover { border-color:var(--ink); color:var(--ink); }
  .pilcrow { color:var(--rule); text-decoration:none; margin-left:.35rem; cursor:pointer; font-size:.9rem; }
  article section:hover .pilcrow { color:var(--muted); }
  .pilcrow:hover { color:var(--ink) !important; }
  .docnav { display:flex; justify-content:space-between; gap:1rem; margin:1.8rem 0 0; }
  .docnav a { color:var(--ink); text-decoration:none; font-size:.86rem; border:1px solid var(--rule);

  .docnav a:hover { border-color:var(--ink); }
  .docnav .spacer { flex:1; }
  .headrule { border:none; border-top:2px solid var(--ink); margin:.9rem 0 1rem; }
  .longtitle { margin:.2rem 0 1rem; }
  .longtitle .lbl { font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
    margin-bottom:.15rem; }
  .reserved { color:var(--muted); font-size:.88rem; margin:.5rem 0 .5rem .9rem; }
  .archivedoc h2, .archivedoc h3, .archivedoc h4 { margin:1.1rem 0 .4rem; color:var(--ink); line-height:1.25; }
  .archivedoc h2 { font-size:1.25rem; } .archivedoc h3 { font-size:1.08rem; } .archivedoc h4 { font-size:.98rem; }
  .archivedoc blockquote { border-left:3px solid var(--rule); margin:.6rem 0; padding-left:.9rem; color:#33404f; }
  .archivedoc code { font-family:ui-monospace,Menlo,monospace; font-size:.85em; background:#f1ece3; padding:.05rem .25rem; border-radius:3px; }
  .archivedoc hr { border:none; border-top:1px solid var(--rule); margin:1rem 0; }
  .tocres { display:block; color:var(--muted); padding:.1rem 0; }
  .assoc-row { display:flex; align-items:baseline; gap:.55rem; padding:.28rem 0;
    border-bottom:1px solid #eee6da; cursor:pointer; }
  .assoc-row:hover .t { text-decoration:underline; }
  .assoc-row .minichip { flex:none; width:3.6rem; text-align:center; border:1px solid var(--tone,var(--muted));
    border-radius:4px; background:var(--tone-bg,#fff); color:var(--tone,var(--muted)); font-size:.58rem;
    letter-spacing:.05em; text-transform:uppercase; padding:.08rem 0; }
  .assoc-row .t { color:var(--ink); font-size:.92rem; }
  .assoc-row .c { margin-left:auto; color:var(--muted); font-size:.76rem; white-space:nowrap; }

  .pdftools { display:flex; gap:.6rem; align-items:center; max-width:62rem; margin:0 auto .2rem; padding:.3rem 1.2rem 0; }
  .pdftools a { font-size:.8rem; color:var(--ink); border:1px solid var(--rule); border-radius:6px;
    background:var(--paper); padding:.22rem .6rem; text-decoration:none; }
  .pdftools a:hover { border-color:var(--ink); }
  .pdftools .lbl { font-size:.72rem; color:var(--muted); margin-right:.1rem; }
  @media print {
    .bar, footer, .neigh, h2.sect.assoc, .docnav, .copycite, .pilcrow, .backbtn,
    .pdftools { display:none !important; }
    body { background:#fff; }
    .facts, .pred, article table { background:#fff; }
    main, main.wide { max-width:none; padding:0; }
    a.lawref { text-decoration:none; color:#000; }
    @page { margin:2cm; }
  }
</style>

<script>
'use strict';
const ITEMS = window.GAZETTE.items;
const byId = new Map(ITEMS.map(d => [d.id, d]));

const TONES = { sc:'#8a5a00', ca:'#1d4f91', first:'#3d7fbd', act:'#b42318', si:'#761919',
  pc:'#a31963', submission:'#4b5563' };
function tone(d) {
  if (d.kind === 'statute' || d.kind === 'act') return 'act';
  if (d.kind === 'regulation' || d.kind === 'rule' || d.kind === 'instrument') return 'si';
  if (d.kind === 'order' || d.kind === 'judgment') {
    if (d.court === 'sc') return 'sc';
    if (d.court === 'pc') return 'pc';
    if (d.court === 'ca') return 'ca';
    return 'first';
  }
  if (d.kind === 'decision') return 'first';
  return 'submission';
}
const KIND_LABEL = { statute:'Act', act:'Act', regulation:'Regulation', rule:'Rule', instrument:'Instrument',
  order:'Order', judgment:'Judgment', decision:'Decision', invariant:'Invariant', obligation:'Obligation', spec:'Spec' };
const SOURCE_LABEL = { sc:'Supreme Court', pc:'Privy Council', ca:'Court of Appeal', county:'County Court' };
function esc(t) {
  return String(t ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${d} ${M[m - 1]} ${y}`;
}
function statusKind(s) {
  s = (s || '').toLowerCase();
  if (/(void|per.incuriam|superseded|revoked|stayed|not.law)/.test(s)) return 'bad';
  if (/(draft|pending|proposed)/.test(s)) return 'pend';
  if (/(in.force|good.law|binding|active|assented|enacted|made)/.test(s)) return 'live';
  return '';
}

/* citation linkification (same grammar as the explorer) */
const ID_ALTERNATION = [...byId.keys()].sort((a, b) => b.length - a.length)
  .map(id => id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
const ID_RE = new RegExp(`(^|[^\\w:-])(${ID_ALTERNATION})((?::s\\d+)?)(?![\\w-])`, 'g');
const CITE_RE = /\[(\d{4})\]\s+(VJS|REALM)-([A-Z]{2})\s+(\d+)/g;
function linkify(escaped) {
  let out = escaped.replace(ID_RE, (m, pre, id, sec) =>
    `${pre}<a class="lawref" href="law.html#${encodeURIComponent(id)}" data-id="${id}">${id}${sec}</a>`);
  out = out.replace(CITE_RE, (m, year, realm, court, n) => {
    const id = realm === 'VJS' ? `${year}-VJS-${court}-${String(n).padStart(3, '0')}` : `REALM-${court}-${n}`;
    return byId.has(id) ? `<a class="lawref" href="law.html#${encodeURIComponent(id)}" data-id="${id}">${m}</a>` : m;
  });
  return out;
}
document.addEventListener('click', e => {
  const a = e.target.closest('a.lawref');
  if (a && a.dataset.id) { e.preventDefault(); location.hash = encodeURIComponent(a.dataset.id); }
});

/* the full text, lazily */
let textPromise = null;
function ensureText() {
  if (window.GAZETTE_TEXT) return Promise.resolve();
  if (!textPromise) textPromise = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'gazette-text.js';
    s.onload = res;
    s.onerror = rej;
    document.head.appendChild(s);
  });
  return textPromise;

function paras(text) {

    const kids = ups.map(u => node(u, depth + 1)).filter(Boolean).join('');

      + `<span class="at-c">${esc(displayCite(x))}</span>${kids ? `<ul>${kids}</ul>` : ''}</li>`;

    a.addEventListener('click', e => {
      e.preventDefault();
      history.replaceState(null, '', '#' + encodeURIComponent(a.dataset.sec));
      copyText(citeFor(d, a.dataset.sec), null);
      const sec = document.getElementById('sec:' + a.dataset.sec);
      if (sec) sec.classList.add('flash');
    }));
  document.querySelectorAll('.contents a, .toc a').forEach(a =>
    a.addEventListener('click', e => {
      e.preventDefault();
      const sec = decodeURIComponent(a.getAttribute('href').slice(1));
      const el = document.getElementById('sec:' + sec);
      if (el) { el.classList.add('flash'); el.scrollIntoView({ block: 'start' }); }
      history.replaceState(null, '', '#' + encodeURIComponent(sec));
    }));
  // gov.uk-style: the Contents rail tracks the section in view
  const tocLinks = new Map([...document.querySelectorAll('.contents a[data-toc]')].map(a => [a.dataset.toc, a]));
  if (tocLinks.size && 'IntersectionObserver' in window) {
    const obs = new IntersectionObserver(entries => {
      for (const en of entries) {
        if (!en.isIntersecting) continue;
        const sid = en.target.id.replace(/^sec:/, '');
        tocLinks.forEach(l => l.classList.remove('active'));
        tocLinks.get(sid)?.classList.add('active');
      }
    }, { rootMargin: '-60px 0px -70% 0px' });
    document.querySelectorAll('.leg-section').forEach(el => obs.observe(el));
  }
}

window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
render();

{
  const m = window.GAZETTE.meta || {}, lp = m.lawpack || {};
  document.getElementById('colophon').innerHTML =
    `Publication is constitutively inert (REG-GAZETTE-CONTINUITY-001): force comes from the lawpack and the
     Sovereign's assent, never from publication. Generated ${esc((window.GAZETTE.generated_at || '').slice(0, 10))}
     from ${esc(lp.id || 'the lawpack')} &middot; <a href="gazette-data.json">data</a> &middot; <a href="gazette.xml">feed</a>`;
}
