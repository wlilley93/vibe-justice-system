[workspace]
resolver = "3"
members = [
    "crates/vjs-core",
    "crates/vjs-lawpack",
    "crates/vjs-store",
    "crates/vjs-engine",
    "crates/vjs-cli",
    "crates/vjs-mcp",
    "crates/vjs-git",
    "crates/vjs-redact",
    "crates/vjs-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
authors = ["wlilley93"]
repository = "https://github.com/wlilley93/vibe-justice-system"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
walkdir = "2"
schemars = "0.8"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"

[profile.release]
opt-level = 3
lto = true
